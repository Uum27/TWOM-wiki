<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>装备图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",system-ui,sans-serif}
body{background:#f0f2f5;padding:12px}

.top-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;

  position:sticky;
  top:0;
  z-index:100;

  background:#f0f2f5;
  padding:6px 0;
}

/* 搜索框自动撑满 */
.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

/* 翻译按钮固定不压缩 */
.lang-btn{
  flex-shrink:0;
}

/* 部位分类栏 */
#typeBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

/* 职业分类栏 */
#jobBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}
.lang-btn,.page-btn,.type-btn{
  padding:8px;border:1px solid #ccc;background:#fff;border-radius:8px;white-space:nowrap;font-size:16px
}
.type-btn.active{ background:#718ACC;color:#fff;border-color:#718ACC }
/* ===== NAV_CAT_SPLIT：顶部页面标签([data-nav]) 与页内分类按钮 视觉分层 —— 阶段1 顶栏 =====
   顶栏 = 大号药丸 tab（白底 + 蓝灰边 + 悬停黄），8 个一组、页面级切换。
   margin-bottom:6px：顶栏按钮是 body 裸按钮，换行后上下两行原本 vGap=0 紧贴。
   ⚠ 必须放在 .type-btn.active 那一行之后：[data-nav](0,2,0) 与它同优先级、靠后者胜。

   ⚠⚠ 尺寸按「387px（iPhone 14/15 的 CSS 宽度）每行能放 4 个」反推：
     387 - 15(竖滚动条) - 24(body padding 12*2) = 348px 可用宽（最严的 6 页）；
     index/equip 的 body padding 实为 8px（equip 有两条 body 规则，后者覆盖前者），
     可用 356px，更宽松。
     4 个按钮 + 3 个 2px 间距 = 4*82 + 6 = 334px <= 348 -> **余量 14px**，
     即使遇到竖滚动条宽度差异也不会掉到 3 个。
     按钮 = min-width:80px + 2px 边框 = 82px；中文 4 个汉字(64px) + 2*8px padding
     + 2px 边框 = 82px，**正好放下且不溢出**。
   ⚠ padding 用 8px（不是 12px）：12px 时按钮需 90px，4 个要 372px > 348px 放不下。
   ⚠ margin-right:2px 制造 2px 间距（inline 流默认无间距，8 个按钮会贴在一起）。
   ⚠ 非中文语言文字更长 -> 按内容自适应撑宽（min-width 只作下限），
     每行变 3 个且**文字完整显示**（不加 max-width/overflow:hidden/text-overflow）。
 */
.type-btn{cursor:pointer}
.type-btn[data-nav]{min-width:80px;padding:8px 8px;margin:0 2px 6px 0;box-sizing:border-box;
border-radius:999px;background:#fff;border-color:#94A6BE;color:#3D4E68;font-weight:500;
white-space:nowrap;text-align:center}
.type-btn[data-nav]:hover{background:#FFE58A;border-color:#E8C33A;color:#22334A}
.type-btn.active[data-nav]{background:#718ACC;border-color:#3774AE;color:#fff}
/* ===== NAV_CAT_SPLIT：页内分类按钮（小号方角 chip）—— 阶段2 分类栏 =====
   :not([data-nav]) = 排除顶部标签；:not(.active) = **active 态一律沿用页面原有规则**
     （含 pet 的 [data-cat=large] #3774AE / [data-cat=small] #518B38 / 排序按钮青绿 #4E9A8C），
     本段只改「未选中」的几何与配色。
   分类栏容器（body 直接子元素）补 margin-top，与顶栏拉开呼吸（10px -> 12px 见注释③）。 */
.type-btn:not([data-nav]):not(.active):not([id="sortBtn"]){padding:5px 12px;font-size:14px;border-radius:6px;background:#fff;border-color:#C9D4E0;color:#4D5A75}
.type-btn:not([data-nav]):not(.active):not([id="sortBtn"]):hover{background:#F7FAFD;border-color:#94A6BE}
body > #catBar,body > #classBar,body > #jobBar,body > #typeBar,body > #bookBar,body > #zonePanel{margin-top:12px}


.page-btn{margin:0 4px}

.pagination{text-align:center;margin:8px 0}

.equip-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* 平板 */
@media(min-width:768px) and (max-width:1023px){
  .equip-grid{
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
}

/* PC */
@media(min-width:1024px){
  .equip-grid{
    grid-template-columns:repeat(4,1fr);
    gap:18px;
  }
}

.equip-card{
  background:#D9E3EC;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);overflow:hidden;
  display:flex;flex-direction:column;padding:4px;gap:4px;border: 1px solid #94A6BE;
}
.equip-name{
  text-align:center;font-weight:bold;font-size:18px;
  padding:4px 4px;
  border-top: 2px solid #b9cad6; border-bottom: 2px solid #b9cad6;
  background: linear-gradient(100deg, #c1ceda, #E7F7FF, #c1ceda);
  border-radius: 8px 8px 8px 8px;
  line-height:1.2;
}
@media(min-width:1024px){ .equip-name{ font-size:20px; padding:6px 4px; } }

.equip-info-row{display:flex;padding:4px;gap:4px;align-items:center}
.equip-icon-col{ width:30%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px }
/* 徽章绝对定位在右上角，给标签列留出让位空间（徽章区最大 132px） */
.equip-text-col{width:70%;padding-right:2px;display:flex;flex-direction:column;gap:4px;padding-left:4px}   /* 标签右移 4px */

.hex-icon{ width:50px;height:50px;display:flex;align-items:center;justify-content:center; clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%); background:linear-gradient(145deg,#6085ac,#2f4666);position:relative;overflow:hidden; }
.hex-icon::before{ content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0.5),rgba(255,255,255,0) 40%); }
.hex-icon::after{ content:"";position:absolute;inset:0;box-shadow:inset 0 0 15px rgba(255,255,255,0.35),inset 0 0 25px rgba(255,255,255,0.15); }
.hex-icon .star{ position:absolute;width:8px;height:8px;z-index:1; }
.hex-icon .star::before{ content:"";position:absolute;width:100%;height:2px;top:50%;left:0;transform:translateY(-50%);background:linear-gradient(to right,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star::after{ content:"";position:absolute;width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star1{ top:18%;left:15%; }
.hex-icon .star2{ bottom:18%;right:15%; }
.hex-icon img{width:30px;height:30px;object-fit:contain}
@media(min-width:1024px){ .hex-icon{width:60px;height:60px} .hex-icon img{width:38px;height:38px} }

/* ⚠ 限宽 + 省略号：右上角被强化徽章占着，稀有度文案再长也只能截断，不能溢出压住徽章 */
.tag-rarity{ padding:3px 6px;border-radius:8px;color:#D6E5DC;font-size:13px;width:fit-content;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap }
.item-level{ font-size:17px;font-weight:bold;color:#3D67D4;text-align:center;line-height:1;margin-top:5px }
@media(min-width:1024px){.item-level{font-size:19px}}
/* 职业图标：尺寸与排布和时装图鉴一致（20px 图标 + 3px 间距），一行放得下 4 个职业 */
.tag-job{ display:flex;flex-wrap:nowrap;align-items:center;gap:3px;min-height:20px;width:fit-content }
.tag-job img{ width:20px;height:20px;object-fit:contain;display:block }
.equip-stats{ background:#C6D4E4;padding:8px 4px;border-radius:8px;margin-top:4px }
.stat-item{ font-size:15px;font-weight:bold;text-align:left;padding:2px 0 }
@media(min-width:1024px){.stat-item{font-size:17px}}
.btn-source{ width:60%;margin:0 auto;padding:8px;margin-top:auto;background:#718ACC;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;display:block }
.btn-source.disabled{ background:#9AA7BC;cursor:default }
@media(min-width:1024px){.btn-source{padding:10px;font-size:16px}}

/* 卡片底部操作行 */
.card-actions{ display:flex;gap:6px;margin-top:auto;align-items:stretch }
/* 一排按钮（获取途径 / 获得概率 / 文物概率 / 重置概率）：文字**单行不换行 + 垂直居中**，
   这样同一排里各按钮的文字上下对齐（按钮高度不一致时也不会错位）。 */
.card-actions .btn-source,
.card-actions .btn-reset,
.card-actions .btn-rate,
.card-actions .btn-relic{
  flex:1 1 0;width:auto;min-width:0;margin:0;
  padding:7px 2px;font-size:14px;line-height:1.3;
  white-space:nowrap;display:flex;align-items:center;justify-content:center;
  border:none;border-radius:10px;font-weight:bold;cursor:pointer;color:#F8EFF3;
}
.btn-reset{ background:#ECBC5C }   /* 重置概率：调淡的暖黄 */
.btn-rate{ background:#4E9A8C }    /* 获得概率：绿（不变） */
.btn-relic{ background:#9DC48A }   /* 文物概率：淡蓝绿偏黄 */
.card-actions .btn-reset{ color:#6B4E16 }   /* 淡黄底配深琥珀字，清晰不刺眼 */
/* 各档位字号/内边距都按「最宽的语言（日文 14em）+ 该列数下卡片最窄时的可用宽度」反推，
   保证一排三个按钮永远单行放得下（模型见 _smoke/harness_equipbtn.js）；
   选择器必须写成 .card-actions .btn-*，否则盖不住上面那条共用规则。 */
@media(min-width:481px) and (max-width:767px){ .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:8px 2px;font-size:13px} }
@media(min-width:768px){ .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:10px 2px;font-size:14px} }
@media(min-width:1120px){ .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:10px 2px;font-size:16px} }

/* 手机端：卡片更窄，一排 3 个 4 字按钮要放得下 → 收窄页面/卡片内边距并逐档缩小字号（文字始终单行居中） */
@media(max-width:480px){
  body{ padding:8px }
  .equip-grid{ gap:8px }
  .equip-card{ padding:2px }
  .card-actions{ gap:3px }
}
/* 字号档位按「最宽的语言（日文 14em / 韩文 13.8em）+ 0 内边距 + 3px 间距」推到刚好放得下：
   见 _smoke/harness_equipbtn.js 的字宽模型（320~1024px 全区间 × 四语言 × 各种按钮组合） */
@media(min-width:416px) and (max-width:480px){
  .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:6px 0;font-size:13px}
}
@media(min-width:388px) and (max-width:415px){
  .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:6px 0;font-size:12px}
}
@media(min-width:360px) and (max-width:387px){
  .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:6px 0;font-size:11px}
}
@media(min-width:332px) and (max-width:359px){
  .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:6px 0;font-size:10px}
}
@media(max-width:331px){
  .card-actions .btn-source,.card-actions .btn-reset,.card-actions .btn-rate,.card-actions .btn-relic{padding:6px 0;font-size:9px}
}

/* 重置概率弹窗（自适应大小，最大 80% × 60%） */
.modal-content.reset-modal{ width:fit-content;max-width:80%;height:auto;max-height:60%;display:flex;flex-direction:column;text-align:left }
.modal-content.reset-modal .modal-title{ flex-shrink:0 }
.modal-content.reset-modal .modal-close{ align-self:center;flex-shrink:0 }
.reset-body{ flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:4px 0 12px;padding-right:4px }
/* 重置消耗（标题下方一行）：起源石 ×N · 重置的古书 ×N，按 装备类型/要求等级/阶级 分档 */
.reset-cost{ background:#f5f7fa;border-radius:10px;padding:6px 12px;margin:0 0 10px;
  font-size:14px;color:#3D4E68;text-align:center;line-height:1.6 }
.reset-cost b{ color:#22334a }
.reset-stats{ display:flex;flex-wrap:wrap;justify-content:center;gap:10px }
@media(min-width:768px){ .reset-stats{ flex-wrap:nowrap } }
.reset-stat{ flex:0 1 auto;width:240px;max-width:100%;background:#f5f7fa;border-radius:10px;padding:8px }
.reset-stat-name{ text-align:center;font-weight:bold;font-size:17px;color:#3D4E68;padding:2px 4px 0 }
.reset-stat-name::after{ content:"";display:block;width:32px;height:3px;background:#718ACC;border-radius:2px;margin:6px auto 8px }
.reset-table{ width:100%;border-collapse:collapse;font-size:14px;background:#fff }
.reset-table th{ background:#e0e7f3;color:#3D4E68;padding:5px 8px;font-weight:bold;text-align:center }
.reset-table td{ padding:4px 8px;border-top:1px solid #eef2f7;text-align:center }
.reset-table tbody tr:nth-child(even) td{ background:#f7f9fc }
.reset-table td.reset-val{ font-weight:bold;color:#3D4E68 }

.modal-backdrop{ position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999 }
.modal-content{ background:#fff;width:80%;max-width:380px;padding:20px;border-radius:16px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.3) }
.modal-title{font-size:18px;font-weight:bold;margin-bottom:12px;color:#333}
/* 弹窗标题文字色：与对应按钮色协调（同色系加深，白底清晰易读、不刺眼） */
#modalTitle{ color:#355E9C }                                   /* 获取途径：蓝 */
#rateModalTitle,#probModalTitle{ color:#2C7267 }                /* 获得概率：青绿 */
#relicModalTitle{ color:#4E7A3C }                               /* 文物概率：深绿 */
.modal-desc{font-size:15px;color:#3D4E68;line-height:1.6;margin-bottom:16px;min-height:60px;}
.modal-desc div{ padding:8px; border-radius:8px; cursor:pointer; margin:4px 0; background:#f5f7fa; text-align:center; }   /* 获取途径正文居中 */
.modal-desc div:hover{ background:#e0e7ff; }
.item-link{ color:#3774AE;text-decoration:underline;cursor:pointer }
.modal-close{padding:7px 16px;background:#5c6bc0;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

/* 获取途径弹窗：内容超高时内部滚动 */
.modal-content.source-modal{ max-height:60%;display:flex;flex-direction:column }
.modal-content.source-modal .modal-title{ flex-shrink:0 }
.modal-content.source-modal .modal-desc{ flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain }
.modal-content.source-modal .modal-close{ align-self:center;flex-shrink:0 }
/* 语言下拉框：原生箭头无法调整位置，改为自定义箭头并往左收一些 */

/* 语言切换：自定义点击下拉（PC/手机一致，替代原生 select） */
.lang-dd{position:relative;display:inline-block;vertical-align:middle}
.lang-dd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:104px;padding:8px 12px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:15px;line-height:1;color:#3D4E68;white-space:nowrap;cursor:pointer;font-family:inherit}
.lang-dd-btn:hover{border-color:#94A6BE;background:#F7FAFD}
.lang-dd.open .lang-dd-btn{border-color:#94A6BE;background:#F7FAFD}
.lang-dd-caret{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid #4D5A75;transition:transform .15s}
.lang-dd.open .lang-dd-caret{transform:rotate(180deg)}
.lang-dd-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:100%;background:#fff;border:1px solid #B9C4D4;border-radius:8px;box-shadow:0 8px 22px rgba(34,44,62,.18);padding:4px;z-index:300}
.lang-dd.open .lang-dd-menu{display:block}
.lang-dd-item{padding:8px 14px;border-radius:6px;font-size:15px;line-height:1.2;color:#3D4E68;white-space:nowrap;text-align:center;cursor:pointer}
.lang-dd-item:hover{background:#EAF1F8}
.lang-dd-item.active{background:#EDF0F4;font-weight:600}
/* ===== SIM 装备模拟器（强化 + 重置，单弹窗） ===== */
#simBar{margin-top:10px;margin-bottom:8px;display:flex;justify-content:center}
.sim-entry{background:#7A6FA8;color:#fff;border:none;border-radius:999px;padding:9px 26px;
  font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.sim-entry:hover{filter:brightness(1.07)}
/* ⚠ 模拟器弹窗尺寸（2026-10-06 重做）。
   旧写法 `width:fit-content; max-width:94%; max-height:84%` 有两个问题：
     ① fit-content 让宽度随内容跳变 —— PC 上副属性/长装备名会把窗口拉得很宽，
        标签行与 KPI 网格被拉散，视觉松散；
     ② PC 上 max-height:84% 对超宽屏没有意义，窗口仍只占屏幕中央一小块。
   新策略：**手机端贴边铺满（用满纵向），PC/平板固定上限居中**。
   ⚠ 断点 768px 与站点主栅格一致（MEMORY：标签栏按 387px 反推，平板 2 列）。
   ⚠ 横向必须 100% 减去外边距，否则 387px 下会因 body padding 产生横向滚动。 */
.modal-content.sim-modal{width:100%;max-width:none;height:100%;max-height:100%;
  border-radius:0;padding:12px 12px 10px;
  display:flex;flex-direction:column;text-align:left}
.modal-content.sim-modal .modal-close{align-self:center;flex-shrink:0;margin-top:10px}
@media (min-width:768px){
  /* ⚠ max-height 从 88vh 提到 **92vh**（用户 2026-10-06 报「选防具后有一点点滑动条」）。
     实测内容高 490~507px：1440×900/1280×800/1024×768 都不溢出；
     但矮屏（900×700，88vh=616px）下武器会溢出 23px、防具 6px —— 就是那条多余的滑动条。
     92vh 在 700 高屏上多给 28px，正好吃掉溢出。
     ⚠ 别再往上加到 96vh+：贴到屏幕边缘会失去弹窗「浮在页面上」的观感。 */
  .modal-content.sim-modal{width:680px;max-width:94vw;height:auto;max-height:92vh;
    border-radius:16px;padding:16px 18px 14px}
}
@media (min-width:1200px){
  /* 超宽屏再放宽一点，但要封顶 —— 再宽就会出现「一行放不下几个 KPI」的稀疏感 */
  .modal-content.sim-modal{width:760px}
}
/* ⚠ 手机端：内容区自己留出底部安全区，关闭按钮不被 iOS home 条压住 */
@media (max-width:767px){
  .modal-content.sim-modal{padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
  .modal-content.sim-modal .modal-close{margin-top:8px;padding:9px 0;width:100%}
  /* 标签/控件在窄屏更大更好点 */
  .sim-tab{padding:9px;font-size:15px}
  .sim-btn{padding:9px 13px}
}
.sim-tabs{display:flex;gap:6px;margin-bottom:11px;flex-shrink:0}
.sim-tab{flex:1;background:#fff;border:1px solid #94A6BE;color:#3D4E68;border-radius:999px;
  padding:7px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.sim-tab.active{background:#7A6FA8;border-color:#5B4F8C;color:#fff}
/* ⚠ padding 不能省（2026-10-06）：`.sim-equip.clickable` 用 `margin:-2px -4px` 让 hover
   背景向外扩一点，这个**负 margin 会让内容向上溢出 2px**，被 `scrollHeight` 计入 →
   未选装备时内容只有 54px 而 clientHeight 52px，**凭空多出一条 2px 的滑动条**
   （用户报「点进模拟器选防具后有一点滑动条」；实测武器/防具都是 ovf=2，只是先注意到防具）。
   padding:2px 4px 正好抵消负 margin，滑动条消失且 hover 背景仍不外扩。 */
.sim-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:2px 4px}
.sim-equip{display:flex;align-items:center;gap:11px;background:#f5f7fa;border-radius:10px;
  padding:9px 11px;margin-bottom:11px}
/* ⚠ 副属性栏：装备头**右侧**第三栏（用户 2026-10-06）。
   布局取舍：`.sim-equip-txt` 是 flex:1（min-width:0 允许压缩），副属性 flex:0 0 auto 保持自身宽度。
   ⚠ 窄屏**不换行** —— 换行会让「装备右边有副属性」变成「装备下面有副属性」，违背需求。
     代价是装备名/等级行会被压缩，必要时靠 text-overflow:ellipsis 截断（见 .sim-equip-sub）。 */
.sim-subattr{flex:0 0 auto;width:100px;padding-left:12px;border-left:1px solid #DCE3EC}
.sim-subattr-t{font-size:10px;color:#7A8AA0;margin-bottom:2px}
.sim-subattr-i{display:flex;justify-content:space-between;gap:6px;font-size:11px;line-height:1.65}
.sim-subattr-k{color:#4D5A75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-subattr-v{color:#22334a;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
/* ⚠ 官方没公示这件装备的副属性 —— 必须显式说明，否则空白会被读成「没有副属性」 */
.sim-subattr.empty{color:#A9B6C6;font-size:11px;padding-top:2px}
@media (min-width:480px){
  .sim-subattr{width:auto;min-width:104px;max-width:200px}
  .sim-subattr-t{font-size:11px;margin-bottom:3px}
  .sim-subattr-i{font-size:12px;line-height:1.6}
}
.sim-equip-icon{width:52px;height:52px;flex:0 0 auto;background:#EDF0F4;border:2px solid #94A6BE;
  border-radius:8px;object-fit:contain}
.sim-equip-txt{min-width:0;flex:1 1 auto}
/* ⚠ 副属性占了右侧一栏，装备名/等级行必须能收缩 + 省略号，否则长装备名会把栏挤破 */
.sim-equip-name{font-size:15px;font-weight:500;color:#22334a;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sim-equip-sub{font-size:12px;color:#5A6B85;margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* 装备的**原始属性数值**（攻击力 7~35 / 防御力 11 / 精准 8） */
.sim-equip-stat{margin-top:3px;font-size:13px;font-weight:600;color:#3D5A80;
  font-variant-numeric:tabular-nums}
/* 已选装备时整块可点（点图标或名字切换装备） */
.sim-equip.clickable{cursor:pointer;border-radius:10px;padding:2px 4px;margin:-2px -4px;
  transition:background .12s}
.sim-equip.clickable:hover{background:#EEF3FA}
.sim-swap{margin-left:7px;font-size:11px;font-weight:400;color:#7A8AA0;
  border:1px solid #C6D0DE;border-radius:7px;padding:0 5px;white-space:nowrap}
.sim-sec{font-size:13px;font-weight:500;padding-bottom:5px;border-bottom:1px solid #e8edf4;margin-bottom:9px}
.sim-sec-enh{color:#5B4F8C}
.sim-sec-rst{color:#8A6412;margin-top:14px}
.sim-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:#3D4E68}
/* ⚠ 强化徽章（.enh-slot）绝对定位在卡片右上角，**会压在「稀有度」标签上** ——
   英文 "Advanced"(73px) + "Enhance"(62px) + 图标(50px) 在 387px 的 2 列卡片里必然超宽。
   对策：① 徽章文案在 lang.json 里用符号简写（en 用 "+"）；② .tag-rarity 限宽 + 省略号，
   宁可截断也不许溢出压住徽章。 */
.equip-info-row{position:relative}
.ce-sel{font-size:13px;color:#3D4E68;margin-bottom:10px}
.ce-sel select{min-width:96px}
/* ⚠ max-width 必须留够徽章（+15 约 40px）+ 数值行（约 52px）的位置，
   否则数值会盖到稀有度/职业标签上。 */
.enh-slot{position:absolute;top:3px;right:3px;z-index:2;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px;max-width:min(56%,118px);pointer-events:auto}
.tag-enh{position:static;max-width:100%;white-space:nowrap;padding:2px 8px;border:1px solid #C89A3C;
  border-radius:9px;background:#FFF9E8;color:#8A6412;font-size:11px;font-family:inherit;cursor:pointer}
.tag-enh.on{background:#C89A3C;border-color:#8A6412;color:#fff;font-weight:500}
.tag-enh:hover{border-color:#8A6412}
/* ⚠ 手机端 387px 卡片很窄，数值若 nowrap 会横向溢出压到「稀有度/职业」标签上。
   改成可换行 + 限宽，超长时自动折行而不是盖住标签。 */
.enh-val{font-size:11px;color:#2C7267;text-align:right;line-height:1.3;
  white-space:normal;word-break:break-word;max-width:100%;display:flex;
  flex-direction:column;align-items:flex-end}
.enh-val b{font-weight:500;color:#5A7799;font-size:10px}
.enh-val span{font-weight:500}
.ce-out2{background:#EEF3FA;border:1px solid #C9D8E8;border-radius:9px;padding:9px 11px;
  margin-top:6px;font-size:13px;color:#22334A;font-weight:500;line-height:1.7}
.ce-out2:empty{display:none}
.ce-out{background:#F5F7FA;border:1px solid #D9E3EC;border-radius:9px;padding:9px 11px;
  font-size:13px;color:#22334A;line-height:1.7}
.sim-ctl{padding:5px 8px;border:1px solid #B9C4D4;border-radius:8px;background:#fff;
  color:#3D4E68;font-size:14px;font-family:inherit;
  -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
/* ⚠ 手机端原生 <select> 会弹系统全屏选择器、且在弹窗内选不动。
   去掉 appearance 后由浏览器画下拉，配合下面 .sim-ctl 的自绘箭头。 */
.sim-ctl-wrap{position:relative;display:inline-block;min-width:0;max-width:100%}
.sim-ctl-wrap::after{content:"";position:absolute;right:8px;top:50%;margin-top:-3px;
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid #718ACC;pointer-events:none}
.sim-ctl-wrap>.sim-ctl{width:100%;padding-right:24px;cursor:pointer}
/* ⚠ 必须用 fixed：.sim-body 是 overflow-y:auto 的滚动容器，
   absolute 定位的列表会被容器边界裁掉（表现为「点开后看不见/点不动」）。
   打开时用 JS 按按钮位置设 left/width/top，再靠 fixed 逃出滚动容器。 */
/* ⚠ max-height（2026-10-06 加长）：手机端模拟器已改为**全屏**，浮层可以放得更开 ——
   `min(58vh,420px)` 在 387×844 只有 420px，一屏只能看到 ~15 项，91 件武器要滚很久。
   改成 `min(76vh,620px)` → 844 高屏能到 620px（约 24 项）。
   ⚠ `placeSelList()` 里有「下方空间不够就翻到按钮上方」的逻辑，会自动处理空间不足，
     所以这里可以放心加大。 */
.sim-sel-list{position:fixed;z-index:10050;display:block;
  max-height:min(76vh,620px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#fff;border:1px solid #94A6BE;border-radius:9px;
  box-shadow:0 6px 22px rgba(32,48,72,.22);padding:0 0 4px;text-align:left}
.sim-sel-list[hidden]{display:none}
/* 🆕 搜索框：sticky 粘在浮层顶部（用户 2026-10-06）。
   ⚠ z-index 必须高于 .sim-sel-group（也是 sticky）—— 否则搜索框会被分组标题盖住。 */
.sim-sel-search{position:sticky;top:0;z-index:2;background:#fff;
  padding:6px 8px 5px;border-bottom:1px solid #E3E9F0;
  /* ⚠ 计数与输入框同行右侧（`flex`）—— 之前是块级独占一行，把结果列表挤到很下面。 */
  display:flex;align-items:center;gap:8px}
.sim-sel-search input{flex:1 1 auto;min-width:0;width:auto;padding:6px 9px;
  border:1px solid #B9C4D4;border-radius:8px;
  background:#F7F9FC;color:#22334a;font-size:14px;font-family:inherit;
  -webkit-appearance:none;appearance:none}
.sim-sel-search input:focus{outline:none;border-color:#718ACC;background:#fff}
.sim-sel-search input::-webkit-search-cancel-button{cursor:pointer}
/* ⚠ 计数在 flex 行内：必须 flex-shrink:0，否则「20 / 91」会被输入框挤掉 */
.sim-sel-count{flex:0 0 auto;font-size:11px;color:#7A8AA0;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap;min-height:0}
.sim-sel-group{padding:5px 11px 2px;font-size:11px;color:#8A6412;font-weight:500;
  background:#FFF9E8;position:sticky;top:0;z-index:1}
.sim-sel-opt{padding:7px 11px;font-size:14px;color:#3D4E68;cursor:pointer;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sim-sel-opt:hover{background:#EEF3FA}
.sim-sel-opt.on{background:#E4ECF8;font-weight:500;color:#22334A}
.sim-sel-none{padding:16px 11px;text-align:center;font-size:13px;color:#94A6BE}
.sim-sel-none[hidden]{display:none}
.sim-ctl:focus{outline:none;border-color:#718ACC}
.sim-num{width:66px}
.sim-sep{color:#94A6BE;font-weight:500}
.sim-sw{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.sim-sw input{position:absolute;opacity:0;width:0;height:0}
.sim-sw i{width:30px;height:16px;border-radius:999px;background:#C9D4E0;position:relative;transition:background .15s}
.sim-sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.sim-sw input:checked + i{background:#718ACC}
.sim-sw input:checked + i::after{transform:translateX(14px)}
.sim-btns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sim-btn{padding:7px 13px;border:1px solid #94A6BE;border-radius:10px;background:#fff;
  color:#3D4E68;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.sim-btn.pri{background:#718ACC;border-color:#3774AE;color:#F8EFF3}
.sim-btn.amber{background:#C89A3C;border-color:#8A6412;color:#fff}
.sim-btn.ghost{background:#EDF0F4}
.sim-btn.prot{border-color:#C89A3C;color:#8A6412}
.sim-btn.prot.on{background:#C89A3C;border-color:#8A6412;color:#fff}
/* ⚠ 保护卷按钮组：每个可用等级一个「+N 保护卷 ×n」，当前下一级才高亮 */
.sim-prots{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.sim-btn.prot.dis{opacity:.45;cursor:not-allowed;border-color:#C6CFD9;color:#8A97A8}
/* ⚠ 保护卷可用时整块「亮起」：金色描边 + 浅金底+ 右侧概率 */
.sim-prot-wrap{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 2px;
  border:1px solid transparent;border-radius:9px}
.sim-prot-wrap.on{border-color:#E0BE72;background:#FFF6E2}
.sim-prot-rate{font-size:12px;font-weight:600;color:#8A6412;min-width:30px;text-align:left;
  font-variant-numeric:tabular-nums}
.sim-prot-wrap:not(.on) .sim-prot-rate{color:#A9B6C6;font-weight:400}
/* 装备列表浮层的挂载点：现在**只剩浮层本体**，触发入口是装备头（.sim-equip.clickable）。
   ⚠ 2026-10-06 删除了 #simEquipSelBtn 触发按钮 + .sim-selhost 的 picked 状态：
   装备头在「已选/未选」两种状态下都可点，浮层锚点也统一用它（见 simEquipMenu）。 */
.sim-selhost{position:relative}
/* ⚠ 开关行：双倍活动 / 圣水 / **修理**（修理按钮 2026-10-06 挪到这里）。
   `.sim-row` 自带 `flex-wrap:wrap`，387px 放不下会自动换行，不用手写断点。 */
.sim-row-sw{gap:14px;margin-bottom:8px}
/* 修理按钮：损坏时高亮（金色），未损坏时置灰禁用。
   ⚠ 与 .sim-btn.dis 复用置灰样式；padding 略小于普通按钮，避免挤开关行。 */
.sim-btn.sim-repair{padding:6px 11px;font-size:12px}
.sim-btn.sim-repair.dis{opacity:.45;cursor:not-allowed;background:#EDF0F4;
  border-color:#C6CFD9;color:#8A97A8}
/* 损坏提示（留在目标表下方，替代原先那个重复的修理按钮） */
.sim-broken-note{margin-bottom:9px;font-size:12px;color:#C0392B}
/* 参数行：模拟强化目标 / 强化模拟 / 次数 / 清零 —— 387px 一排不换行（用户 2026-10-06 收窄） */
.sim-row-params{gap:5px;row-gap:5px}
.sim-row-params .sim-lb{margin-right:-2px;font-size:10px;white-space:nowrap}
/* ⚠ 目标选择框（#simTo）收窄，给 387px 一排腾地方 */
.sim-row-params select.sim-num{width:48px;padding:5px 4px}
/* ⚠ 次数框收窄；placeholder 用更小字号让「最大5000」完整显示，留空时即按 1 次算 */
.sim-runs{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#5A6B85;white-space:nowrap}
.sim-runs input{width:58px;box-sizing:border-box;padding:3px 4px;font-size:13px}
.sim-runs input::placeholder{font-size:8px;color:#9AA7B8}
.sim-runs input::-webkit-inner-spin-button,
.sim-runs input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sim-runs input[type=number]{-moz-appearance:textfield}
/* ⚠ 参数行按钮（强化模拟/清零）收窄，保证 387px 一排不换行 */
.sim-row-params .sim-btn{font-size:11px;padding:5px 7px}
/* 参数区行内标签（强化目标等） */
.sim-lb{font-size:12px;color:#5A6B85}
/* 保护卷按钮上的「已用张数」小角标 */
.sim-btn.prot .prot-used{display:inline-block;min-width:15px;padding:0 3px;margin-left:3px;
  border-radius:7px;background:#8A6412;color:#fff;font-size:10px;font-weight:600;text-align:center}
/* ⚠ 当前强化等级徽章：一眼看到「我现在是 +几」 */
.sim-curbar{margin:0 0 9px;padding:8px 12px;border:1px solid #C9D4E4;border-radius:11px;
  background:linear-gradient(180deg,#F7FAFF,#EDF2FA)}
/* 上行：当前强化等级（大号） */
.sim-cur-top{display:flex;align-items:baseline;gap:8px}
.sim-cur-lb{font-size:12px;color:#5A6B85}
.sim-cur-v{font-size:22px;font-weight:700;color:#3D5A80;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sim-cur-sub{margin-left:auto;font-size:11px;color:#7A8AA0}
/* 下行：紧贴徽章的下一级成功率（不再单独一个 nowbox） */
.sim-cur-rate{margin-top:5px;padding-top:5px;border-top:1px dashed #C9D4E4;
  font-size:12px;color:#5A6B85}
.sim-cur-rate.dim{color:#93A2B4}
.sim-cur-rate b{color:#3D5A80;font-weight:600}
.sim-cur-rate b.ok{color:#1E8449}
.sim-cur-rate i{font-style:normal;color:#8A6412}
.sim-cur-rate .sim-stk{margin-left:4px}
.sim-cur-prot{display:inline-block;margin-left:5px;padding:0 5px;border-radius:6px;
  background:#F6E7C4;color:#8A6412;font-size:10px;font-weight:600}
.sim-curbar.bad{border-color:#E0B4B0;background:linear-gradient(180deg,#FFF6F5,#FDEAE8)}
.sim-curbar.bad .sim-cur-v{color:#C0392B}
/* KPI 里的保护卷格：上下两层分别显示 +N / +M 的消耗件数 */
.sim-kpi.prot .sim-kpi-v2{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.sim-kpi.prot .sim-kpi-v2 span{white-space:nowrap;font-size:11px;color:#5A7799;font-weight:400}
.sim-kpi.prot .sim-kpi-v2 b{font-weight:600;color:#8A6412}
.sim-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:10px}
.sim-kpi{background:#f5f7fa;border-radius:8px;padding:7px 4px;text-align:center}
.sim-kpi-v{font-size:19px;font-weight:500;color:#22334a;line-height:1.15}
.sim-kpi-k{font-size:11px;color:#5A6B85;margin-top:2px}
.sim-kpi.ok .sim-kpi-v{color:#2C7267}
.sim-kpi.bad .sim-kpi-v{color:#C0392B}
/* ⚠ 「未达标」：卷轴格标黄（区别于 bad 红=失败、ok 绿=成功） */
.sim-kpi.warn{background:#FFF6E0}
.sim-kpi.warn .sim-kpi-v{color:#8A6412}
/* ⚠ 未达标横幅：说清「实际到几级 / 目标几级 / 是否撞护栏」 */
.sim-warnbar{background:#FFF6E0;border:1px solid #F0D9A0;border-radius:8px;
  padding:7px 9px;margin-bottom:9px;font-size:12px;color:#8A6412;line-height:1.5}
/* ⚠ 日志只渲染最近 60 条，这里告诉玩家总数，别让他以为只有 60 条 */
.sim-log-more{padding:3px 5px 5px;font-size:11px;color:#7A8AA0;text-align:center;
  border-bottom:1px solid #EEF2F7;margin-bottom:3px}
.sim-log{background:#fff;border:1px solid #E3E9F0;border-radius:9px;padding:5px;margin-bottom:9px;
  max-height:150px;overflow-y:auto}
.sim-log-i{display:flex;gap:7px;padding:2px 5px;font-size:12px}
.sim-log-i:nth-child(even){background:#f7f9fc}
.sim-log-n{color:#94A6BE;min-width:22px}
.sim-log-t{font-weight:500}
.sim-log-i.ok .sim-log-t{color:#2C7267}
.sim-log-i.fail .sim-log-t{color:#C0392B}
.sim-log-d{color:#4D5A75}
.sim-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:9px}
.sim-table th{background:#e0e7f3;color:#3D4E68;padding:5px 4px;font-weight:500;text-align:center}
.sim-table td{padding:4px;text-align:center;border-top:1px solid #eef2f7}
.sim-table tbody tr:nth-child(even) td{background:#f7f9fc}
.sim-table tr.cur td{background:#FFF1CC!important}
.sim-now{font-size:12px;color:#5A6B85}
.sim-nowbox{background:#F4F7FB;border:1px solid #D9E3EC;border-radius:9px;padding:6px 10px;
  margin-bottom:9px;font-size:12px;color:#5A6B85}
.sim-nowbox b{color:#22334A;font-weight:500}
.sim-nowbox b.ok{color:#2C7267}
.sim-nowbox i{font-style:normal;color:#C08A2E}
.sim-bv{background:#FFF9E8;border:1px solid #F0DCA8;border-radius:9px;padding:7px 10px;margin-bottom:9px}
.sim-bv b{display:block;font-size:12px;color:#8A6412;font-weight:500;margin-bottom:4px}
.sim-bv span{display:block;font-size:13px;color:#22334a;font-weight:500}
.sim-bv span i{font-style:normal;font-size:11px;color:#A98A3E;margin-left:7px;font-weight:400}
.sim-stk{display:inline-block;margin-left:4px;padding:0 4px;border-radius:5px;background:#EAF1F8;
color:#5A7799;font-size:11px;line-height:15px;white-space:nowrap}
.sim-note{background:#FFF7E6;border:1px solid #F0D999;border-radius:9px;padding:7px 10px;

<script>
/* ===== 语言工具（内联，不依赖额外 js 文件；语言对照数据在 lang.json） ===== */
var TWOM_LANG_OPTIONS=[["en","English"],["zh","中文"],["ja","日本語"],["ko","한국어"]];
var TWOM_UI2CODE={en:"en",zh:"cn",ja:"ja",ko:"kr"};
var TWOM_CODE2UI={en:"en",cn:"zh",ja:"ja",kr:"ko"};
var TWOM_NAV={},TWOM_TXTJA={};
function twomReadLang(){var v="";try{v=localStorage.getItem("twom-lang")||"";}catch(e){}return ({en:"en",cn:"cn",zh:"cn",ja:"ja",kr:"kr",ko:"kr"})[v]||"cn";}
function twomWriteLang(c){try{localStorage.setItem("twom-lang",TWOM_CODE2UI[c]||"zh");}catch(e){}}
function twomLocale(c){return c==="cn"?"zh-Hans":c==="ja"?"ja":c==="kr"?"ko":"en";}
function twomFillLangSelect(sel,lang,onPick){
  if(!sel) return;
  var cur = TWOM_CODE2UI[lang] || "zh";
  var curLabel = "中文";
  for(var i=0;i<TWOM_LANG_OPTIONS.length;i++){ if(TWOM_LANG_OPTIONS[i][0]===cur) curLabel=TWOM_LANG_OPTIONS[i][1]; }
  if(sel.classList) sel.classList.add("lang-dd");
  sel.innerHTML = '<button type="button" class="lang-dd-btn" aria-haspopup="listbox" aria-expanded="false">'
    + '<span class="lang-dd-cur">' + curLabel + '</span><span class="lang-dd-caret"></span></button>'
    + '<div class="lang-dd-menu" role="listbox">'
    + TWOM_LANG_OPTIONS.map(function(o){ return '<div class="lang-dd-item' + (o[0]===cur?' active':'') + '" role="option" data-code="' + o[0] + '">' + o[1] + '</div>'; }).join("")
    + '</div>';
  if(!sel.querySelector) return;   /* 无 DOM 环境（用例桩）跳过交互绑定 */
  var btn = sel.querySelector(".lang-dd-btn");
  var menu = sel.querySelector(".lang-dd-menu");
  if(!btn || !menu) return;
  var items = menu.querySelectorAll(".lang-dd-item");
  btn.onclick = function(ev){ if(ev&&ev.stopPropagation) ev.stopPropagation(); var on = sel.classList.toggle("open"); btn.setAttribute("aria-expanded", on?"true":"false"); };
  for(var j=0;j<items.length;j++){ (function(it){
    it.onclick = function(ev){
      if(ev&&ev.stopPropagation) ev.stopPropagation();
      for(var k=0;k<items.length;k++) items[k].classList.remove("active");
      it.classList.add("active");
      var curEl = sel.querySelector(".lang-dd-cur"); if(curEl) curEl.innerText = it.innerText;
      sel.classList.remove("open"); btn.setAttribute("aria-expanded","false");
      if(typeof onPick === "function") onPick(it.getAttribute("data-code"));
    };
  })(items[j]); }
  if(!twomFillLangSelect._outsideBound){
    twomFillLangSelect._outsideBound = 1;
    document.addEventListener("click", function(){
      var open = document.querySelectorAll(".lang-dd.open");
      for(var k=0;k<open.length;k++){ open[k].classList.remove("open"); var b=open[k].querySelector(".lang-dd-btn"); if(b) b.setAttribute("aria-expanded","false"); }
    });
  }
}
function twomApplyLangData(L){
  TWOM_NAV=(L&&L.nav)||{};
  TWOM_TXTJA=(L&&L.txtJa)||{};
  rarityConfig=(L&&L.rarityColor)||rarityConfig;
  /* 语言文案唯一来源 = lang.json：equipLang + 顶层 rarity */
  var E=(L&&L.equipLang)||{};
  typeLangMap = E.typeName || {};
  jobLangMap  = E.jobName  || {};
  langConfig.searchPlaceholder = E.searchPlaceholder || {};
  langConfig.pageText          = E.pageText          || {};
  langConfig.btnText           = E.btnText           || {};
  /* 卡片内强化的文案（equip.html 专用）。
     ⚠ lang.json 的 enhText 存成 {lang:{key}}，要拉平成 {key:{lang}} 才能被 tr() 读到。 */
  langConfig.enhText = {};
  (function(){
    var src = E.enhText || {}, k;
    /* ⚠ enhText 结构是 {lang:{key}}，要显式按四个语言各自拷贝。
       （原先 for(lg in src) 的写法在 lang.json 里 enhText 不是顶层可枚举时拿不到值） */
    var LANGS = ["cn","en","ja","kr"];
    for(k=0;k<LANGS.length;k++){
      var lg = LANGS[k], m = src[lg];
      if(!m) continue;
      for(var kk in m) langConfig.enhText[kk] = langConfig.enhText[kk] || {};
      for(var kk2 in m) langConfig.enhText[kk2][lg] = m[kk2];
    }
  })();
  langConfig.attrName          = E.attrName          || {};
  langConfig.job               = E.jobName           || {};
  langConfig.setValue          = E.setValue          || {};
  /* equip.html 专用扩展（装备模拟器 simText），其余 7 页无此行，别同步过去 */
  langConfig.simText           = E.simText           || {};
  langConfig.rarity            = (L&&L.rarity)       || {};
  twomUpdateNav();
}
function twomUpdateNav(lang){lang=lang||(typeof currentLang!=="undefined"?currentLang:"cn");document.querySelectorAll("[data-nav]").forEach(function(b){var o=TWOM_NAV[b.dataset.nav];if(o)b.innerText=o[lang]||o.cn||o.en;});}
function twomTxt(cn,lang){return lang==="ja"?(TWOM_TXTJA[cn]||cn):cn;}
function twomUi(L,k,lang,vars){var o=((L&&L.ui)||{})[k];var s=o?(o[lang]||o.cn||o.en||k):k;return String(s).replace(/\{(\w+)\}/g,function(_,n){return (vars&&vars[n]!=null)?vars[n]:"";});}
</script>
<script>
let currentLang = twomReadLang();
let typeLangMap = {};   /* ← lang.json 的 equipLang.typeName（页面不再自带文案） */
let jobLangMap  = {};   /* ← lang.json 的 equipLang.jobName  */
function updateJobButtonsLang() {
  document.querySelectorAll('#jobBar .type-btn').forEach(btn => {
    const o = jobLangMap[btn.dataset.job];
    if(o) btn.innerText = o[currentLang] || o.cn || o.en || btn.innerText;
  });
}
function updateTypeButtonsLang() {
  document.querySelectorAll('#typeBar .type-btn').forEach(btn => {
    const o = typeLangMap[btn.dataset.type];
    if(o) btn.innerText = o[currentLang] || o.cn || o.en || btn.innerText;
  });
}
/* 语言文案全部来自 lang.json 的 equipLang / rarity（在此只声明空壳，加载后填充） */
let langConfig = { searchPlaceholder:{}, pageText:{}, btnText:{}, attrName:{}, job:{}, rarity:{}, setValue:{} };

let page = 1;
let allItems = [];
let filteredItems = [];
let resetMap = {};
let relicMap = {};   /* 文物选项概率（equipment_data/relic_rate.json），按装备中文名索引 */
/* 获得概率（官方选项机率页）：rateMap 键 = 装备数据的 name_cn；rateCols = 四语列名 */
let rateMap = {};
let rateCols = {};
let nameMap = {};
let cnToEnMap = {};
let dropMap = {};
let aliasIndex = {};
let aliasList = [];
let aliasPattern = null;
let equipIndex = {};
let plainEquipIndex = {};
let plainEquipPattern = null;
let currentType = "all";
let currentJob = "all";
function getPerPage(){

  // PC
  if(window.innerWidth >= 1024){
    return 20;
  }

  // 平板
  if(window.innerWidth >= 768){
    return 15;
  }

  // 手机
  return 12;
}
const equipFiles = [ { type:"all", path:"equipment_data/all_equip.json" } ];

const statKeys = [
  "precision",
  "attack",
  "armor",
  "speed",
  "block",
  "hp",
  "mana",
  "hp_regen",
  "mana_regen",
  "hit",
  "cri",
  "str",
  "dex",
  "int",
  "deadly",
  "ice_resist",
  "fire_resist",
  "magic_resist",
  "lightning_Resist",
  "move",
  "set2",
  "set3"
];

;
function statValueText(k, v){
  const s = String(v).replace(/ to /g,"~");
  /* 2件套/3件套 的属性值：文案表在 lang.json 的 equipLang.setValue（四语齐全） */
  if(k === "set2" || k === "set3"){
    const m = langConfig.setValue && langConfig.setValue[s];
    if(m) return m[currentLang] || m.cn || m.en || s;
    return s;
  }
  return s;
}

/* 稀有度配色统一在 lang.json 的 rarityColor（名称字体用 .color，标签底色用 .bg） */
let rarityConfig = {};

// 导航按钮（改用公共库）
function updateNavLang(){ twomUpdateNav(currentLang); }

function tr(key, type){
  const o = langConfig[type]?.[key];
  return o?.[currentLang] || twomTxt(o?.cn, currentLang) || o?.cn || key;
}

function updateLangText(){
  /* 徽章与数值都依赖 lang.json -> 语言切换后重渲染卡片 + 恢复数值 */
  if(typeof renderCards === "function"){
    try{
      renderCards();
      /* 重渲染会清空 .enh-val，按 CARD_ENH 恢复 */
      if(typeof ceRestoreVals === "function") ceRestoreVals();
    }catch(e){}
  }
  document.getElementById('searchBox').placeholder = langConfig.searchPlaceholder[currentLang];
  document.getElementById('prevTop').innerText = document.getElementById('prevBot').innerText = tr('prev','btnText');
  document.getElementById('nextTop').innerText = document.getElementById('nextBot').innerText = tr('next','btnText');
  document.getElementById('modalTitle').innerText = tr('modalTitle','btnText');
  document.querySelector('.modal-close').innerText = tr('close','btnText');
  document.getElementById('resetModalClose').innerText = tr('close','btnText');
  document.getElementById('rateModalClose').innerText = tr('close','btnText');
  document.getElementById('relicModalClose').innerText = tr('close','btnText');
  updateNavLang();
}

function updatePageInfo(){
  const total = Math.ceil(filteredItems.length / getPerPage());
  const s = langConfig.pageText[currentLang].replace("{now}",page).replace("{total}",total||1);
  document.getElementById('pageInfo').innerText = document.getElementById('pageInfoBot').innerText = s;
}

function doSearch(){ filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim()); }

function filterAndRender(keyword=""){
  let list = allItems;
  if(currentType !== "all") list = list.filter(x=>x.type === currentType);

  if(currentJob !== "all"){

  list = list.filter(item => {

    let jobs = [];

    if(Array.isArray(item.job)){
      jobs = item.job;
    }
    else if(typeof item.job === "string"){
      jobs = item.job.split(",").map(x=>x.trim().toLowerCase());
    }

    return jobs.includes(currentJob);

  });

}

  if(keyword){
    list = list.filter(item=>{
      const name = (item.name_cn||item.name||"").toLowerCase();
      const nameEn = (item.name||"").toLowerCase();
      const nameJa = (item.name_ja||"").toLowerCase();
      const nameKr = (item.name_kr||"").toLowerCase();
      let attrStr = "";

statKeys.forEach(k => {

  if(item[k] == null || item[k] === "") return;

  const value = String(item[k]).replace(/ to /g,"~");
  const valueAlt = statValueText(k, item[k]);

  // 属性翻译
  const cn = langConfig.attrName[k]?.cn || "";
  const en = langConfig.attrName[k]?.en || "";
  const kr = langConfig.attrName[k]?.kr || "";

 let alias = "";

if(k === "move") alias = "移速 speed movement";
if(k === "cri") alias = "暴率 crit critical";
if(k === "hp") alias = "血量 生命";
if(k === "mana") alias = "蓝量 魔力";
if(k === "attack") alias = "攻击 攻";
if(k === "armor") alias = "防御 防";
if(k === "hp_regen") alias = "回血 回复";
if(k === "mana_regen") alias = "回蓝";
if(k === "deadly") alias = "致命 致死";
if(k === "block") alias = "格挡";
if(k === "fire_resist") alias = "火";
if(k === "precision") alias = "精准";

  attrStr += `
    ${k}
    ${cn}
    ${en}
    ${kr}
    ${alias}
    ${value}
    ${valueAlt}
  `;

});
      const all = [name,nameEn,nameJa,nameKr, String(item.level||""), attrStr].join(" ").toLowerCase();
      return all.includes(keyword);
    });
  }
  filteredItems = list;
  page = 1;
  renderCards();
}

function clearSearchBox(){
  const box = document.getElementById('searchBox');
  if(box) box.value = "";
}

async function loadMyJson(){
  let items = [];
  for(const f of equipFiles){
    try {
      const res = await fetch(f.path);
      items.push(...await res.json());
    } catch(e) {
      console.log("load fail",f.path,e);
    }
  }

  // 加载重置概率数据
  try {
    const res = await fetch("equipment_data/option_reset.json");
    resetMap = await res.json();
  } catch(e) {
    console.log("load reset fail", e);
    resetMap = {};
  }

  // 加载「文物概率」数据（官方概率公示页：24 件武器的文物选项）
  try {
    const res = await fetch("equipment_data/relic_rate.json");
    const rl = await res.json();
    relicMap = rl.equips || {};
  } catch(e) {
    console.log("load relic fail", e);
    relicMap = {};
  }

  // 加载「获得概率」数据（官方选项机率页：意志之三枚戒指）
  try {
    const res = await fetch("equipment_data/option_rate.json");
    const rd = await res.json();
    rateMap = rd.rings || {};
    rateCols = rd.cols || {};   /* 官方列名（备用，页面表头改用站点 resetValue/resetRate 文案）*/
  } catch(e) {
    console.log("load rate fail", e);
    rateMap = {};
  }

  // 加载语言数据（获取途径弹窗怪物名/材料名本地化）
  let langData = {};
  try {
    const res = await fetch("lang.json");
    langData = await res.json();
    nameMap = langData.nameMap || {};
    dropMap = langData.dropMap || {};
  } catch(e) {
    console.log("load lang fail", e);
    nameMap = {};
    dropMap = {};
  }
  // 语言对照（lang.json：nav / ui / 装备 ja 名等）
  twomApplyLangData(langData);
  const eqTab = langData.equips || {};
  items.forEach(function(it){
    const x = eqTab[it.name]; if(!x) return;
    if(x.ja && !it.name_ja) it.name_ja = x.ja;
    if(x.kr && !it.name_kr) it.name_kr = x.kr;
    if(x.cn && !String(it.name_cn||"").trim()) it.name_cn = x.cn;
  });
  // 界面词日文补齐（lang.json.txtJa）
  cnToEnMap = {};
  for(const en in nameMap){
    const v = nameMap[en];
    if(v && v.cn) cnToEnMap[v.cn] = en;
  }

  // 获取途径文案中的物品/装备名 -> 可点击（物品跳物品图鉴、装备跳装备图鉴）
  aliasIndex = {};
  equipIndex = {};
  for(const en in dropMap){
    const v = dropMap[en];
    const cn = ((v && v.cn) || "").trim();
    if(cn.length < 2 || !v.en || en === "-") continue;
    if(aliasIndex[cn]) continue;
    aliasIndex[cn] = { alias: cn, kind: "item", en: en };
  }
  items.forEach(item=>{
    if(item.hide) return;
    const cn = (item.name_cn || "").trim();
    if(cn.length < 2) return;
    aliasIndex[cn] = { alias: cn, kind: "equip", en: item.name };
    equipIndex[item.name] = item;
  });
  // 自动补充去掉「的/之」的写法（如「森林守护者印章」→「森林守护者的印章」）
  Object.keys(aliasIndex).forEach(cn=>{
    if(!/[的之]/.test(cn)) return;
    const short = cn.replace(/[的之]/g, "");
    if(short.length < 2 || aliasIndex[short]) return;
    aliasIndex[short] = { alias: short, kind: aliasIndex[cn].kind, en: aliasIndex[cn].en };
  });
  aliasList = Object.values(aliasIndex).sort((a, b)=>b.alias.length - a.alias.length);
  aliasPattern = new RegExp(aliasList.map(x=>x.alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");

  // 纯文本装备名（含隐藏装备）：仅做显示语言本地化，不生成链接
  plainEquipIndex = {};
  const plainNames = [];
  items.forEach(item=>{
    const cn = (item.name_cn || "").trim();
    if(cn.length < 2) return;
    if(!plainEquipIndex[cn]){ plainEquipIndex[cn] = item; plainNames.push(cn); }
  });
  plainNames.sort((a, b)=>b.length - a.length);
  plainEquipPattern = new RegExp("<[^>]*>|" + plainNames.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");

  // 过滤掉隐藏装备
  allItems = items.filter(item => !item.hide);
  // 初始显示全部可见装备
  filteredItems = [...allItems];
  
  // 清除可能的搜索和分类状态
  // 注意：必须限定在 #typeBar / #jobBar 内。若用 '.type-btn' 会把
  // 导航栏([data-nav]) 与 职业栏([data-job]) 的 active 一并清掉，
  // 表现为「点进装备图鉴后 顶部导航与『全部职业』的蓝底消失」。
  currentType = "all";
  document.querySelectorAll('#typeBar .type-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.type === "all"));
  document.querySelectorAll('#jobBar .type-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.job === "all"));
  document.getElementById('searchBox').value = "";

  // 先更新界面文字（不渲染）
  updateLangText();
  updateTypeButtonsLang();
  updateJobButtonsLang();

  // 根据是否有定位参数决定如何渲染（只渲染一次）
  if(location.search.includes('equip=')){
    jumpToEquipFromUrl();
  } else {
    renderCards();
  }
}

/* ---------- 卡片内强化（不依赖模拟器，直接算强化后数值） ---------- */
const CARD_ENH = {};   /* nameCn -> 强化等级 */

/* ⚠ 卡片区统一用这个转义：模拟器里的 ceEsc() 在其 IIFE 闭包内，跨不到这里 */
function ceTr(key, type, fb){
  let v = tr(key, type);
  if(!v || v === key) v = fb || "";
  return v;
}
function ceEsc(x){
  return String(x == null ? "" : x).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function enhTypeOf(type){
  /* 与 enhance_rate.json 的 enhanceableTypes 保持一致 */
  return (type === "weapon") ? "weapon" : "armor";
}
function enhCat(item){
  return (item.type === "weapon") ? "weapon" : "armor";
}
/* ⚠ 可强化部位白名单：**必须与 enhance_rate.json 的 enhanceableTypes 完全一致**。
   披风 / 项链 / 戒指 / 腰带 游戏里不能用盔甲卷强化 —— 数据侧本来就没列，
   但卡片渲染是无脑给所有装备画徽章的，所以这里必须按同一份名单过滤，
   否则会出现「点进去弹窗写『暂无强化数据』」的死按钮。 */
const CE_ENHANCABLE = ["weapon","armor","hats","gloves","shoes","shields","charms","quivers"];
/* 挂到 window 便于真机验收脚本核对「页面白名单 == enhance_rate.json 的 enhanceableTypes」 */
window.CE_ENHANCABLE_LIST = CE_ENHANCABLE;
function ceCanEnhance(item){
  return !!(item && CE_ENHANCABLE.indexOf(item.type) >= 0);
}
function cardEnhKey(nameCn){
  /* id 只能用安全字符：中文 + 去掉标点 */
  return String(nameCn||"").replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"");
}
/* ⚠ 传 item（不是只传名字）：白名单过滤需要 type，光有 name_cn 判断不了。
   不可强化的部位返回空串 → 连 .enh-slot 容器一起不渲染，卡片右上角完全干净。 */
function cardEnhTag(item){
  const nameCn = item && item.name_cn;
  if(!nameCn || !ceCanEnhance(item)) return "";
  const lv = CARD_ENH[nameCn] || 0;
  /* ceTr：取不到时回退中文，不会显示 key 字面量 */
  const txt = lv > 0 ? "+" + lv : ceTr("enhance","btnText","强化");
  return `<button class="tag-enh${lv>0?" on":""}" data-cn="${nameCn.replace(/'/g,"")}" ` +
         `onclick="openCardEnh(this.dataset.cn)">${ceEsc(txt)}</button>`;
}
window.openCardEnh = function(nameCn){
  var it = null, i;
  for(i=0;i<allItems.length;i++) if((allItems[i].name_cn||"").trim() === nameCn){ it = allItems[i]; break; }
  /* 找不到（名字不存在）-> 关掉弹窗，别留上一次的残留内容 */
  if(!it){ closeCardEnh(); return; }
  /* ⚠ 兜底：披风/项链/戒指/腰带不可强化。即使按钮已被白名单挡住，
     也不排除 console 或历史书签直接调 openCardEnh(name)，这里再拦一道。 */
  if(!ceCanEnhance(it)){ closeCardEnh(); return; }
  var cur = CARD_ENH[nameCn] || 0;
  /* ⚠ 一次性拼好再赋值：循环里反复 `innerHTML +=` 会每次重新解析、option 会丢 */
  var opts = [], mx = 15;
  for(i=0;i<=mx;i++) opts.push('<option value="' + i + '"' + (i===cur?" selected":"") + '>+' + i + '</option>');
  document.getElementById("cardEnhBody").innerHTML =
      '<div class="ce-sel"><label>' + ceEsc(ceTr("enhLevel","btnText","强化等级")) +
      ' <select class="sim-ctl" id="cardEnhSel" onchange="cardEnhPick(this.dataset.cn,+this.value)" data-cn="' +
      ceEsc(nameCn) + '">' + opts.join('') + '</select></label>' +
      '<div class="ce-out" id="cardEnhOut">' + ceEsc(ceLines(it, cur).line1) + '</div>' +
      '<div class="ce-out2" id="cardEnhOut2">' + ceEsc(ceLines(it, cur).line2) + '</div>';
  var cb = document.getElementById("cardEnhClose");
  if(cb) cb.textContent = tr("close","btnText");
  document.getElementById("cardEnhName").textContent =
    (currentLang==="cn" ? (it.name_cn||it.name)
     : currentLang==="ja" ? (it.name_ja||it.name)
     : currentLang==="kr" ? (it.name_kr||it.name) : it.name);
  document.getElementById("cardEnhModal").style.display = "flex";
  if(typeof lockPageScroll === "function") lockPageScroll(true);
  ceLoadData().then(function(){
    var o = document.getElementById("cardEnhOut");
    var sel = document.getElementById("cardEnhSel");
    if(o && sel){
      var L2 = ceLines(it, +sel.value);
      o.innerHTML = ceEsc(L2.line1);
      var o2 = document.getElementById("cardEnhOut2");
      if(o2) o2.innerHTML = ceEsc(L2.line2);
    }
    /* 同步卡片徽章下方的强化后数值 */
    var vEl = document.getElementById("enhVal-" + cardEnhKey(nameCn));
    if(vEl){
      if((+sel.value) > 0){
        var L4 = ceLines(it, +sel.value);
        vEl.innerHTML = '<b>' + ceEsc(L4.statName) + '</b><span>' + ceEsc(L4.fin) + '</span>';
      } else vEl.textContent = "";
    }
  });
};
window.cardEnhPick = function(nameCn, lv){
  CARD_ENH[nameCn] = lv;
  if(!CE_DATA){ ceLoadData().then(function(){ window.cardEnhPick(nameCn, lv); }); return; }
  var out = document.getElementById("cardEnhOut");
  if(!out) return;
  var it = null, i;
  for(i=0;i<allItems.length;i++) if((allItems[i].name_cn||"").trim() === nameCn){ it = allItems[i]; break; }
  if(!it){ closeCardEnh(); return; }
  if(it){
    var L1 = ceLines(it, lv);
    out.innerHTML = ceEsc(L1.line1);
    var o2b = document.getElementById("cardEnhOut2");
    if(o2b) o2b.innerHTML = ceEsc(L1.line2);
  }
  /* 同步下拉值 + 标题（下次打开直接显示当前等级） */
  var sel0 = document.getElementById("cardEnhSel");
  if(sel0) sel0.value = String(lv);
  /* 卡片徽章下方显示强化后数值 */
  if(it){
    var k = cardEnhKey(nameCn);
    var vEl = document.getElementById("enhVal-" + k);
    if(vEl){
      /* 属性名一行、数值一行（用户要求） */
      if(lv > 0){
        var L3 = ceLines(it, lv);
        vEl.innerHTML = '<b>' + ceEsc(L3.statName) + '</b><span>' + ceEsc(L3.fin) + '</span>';
      } else vEl.textContent = "";
    }
  }
  /* 刷新卡片徽章 */
  document.querySelectorAll(".tag-enh").forEach(function(b){
    if(b.dataset.cn !== nameCn) return;
    b.textContent = lv > 0 ? "+" + lv : tr("enhance","btnText");
    b.className = "tag-enh" + (lv>0 ? " on" : "");
  });
};
window.closeCardEnh = function(){
  document.getElementById("cardEnhModal").style.display = "none";
  if(typeof lockPageScroll === "function") lockPageScroll(false);
};

/* 纯计算：强化后的主属性。卡片区自己懒加载 enhance_rate.json，
   不依赖模拟器是否打开（模拟器的 ENH 是打开时才 fetch 的）。 */
let CE_DATA = null, CE_LOADING = null;
function ceLoadData(){
  if(CE_DATA) return Promise.resolve(CE_DATA);
  if(CE_LOADING) return CE_LOADING;
  CE_LOADING = fetch("equipment_data/enhance_rate.json")
    .then(function(r){ return r.json(); })
    .then(function(j){
      CE_DATA = { staff:(j.bonus&&j.bonus.staffExtra)||{}, byKind:(j.bonus&&j.bonus.byKind)||{},
                  armorTable:(j.bonus&&j.bonus.armorTable)||{},
                  staffBonus:(j.bonus&&j.bonus.staffExtraBonus)||{} };
      return CE_DATA;
    })
    .catch(function(){ CE_DATA = {staff:{},byKind:{},armorTable:{},staffBonus:{}}; return CE_DATA; });
  return CE_LOADING;
}
function cardEnhText(it, lv){
  if(!lv) return ceTr("enhNone","btnText","未强化");
  var t = CE_DATA;
  if(!t) return ceTr("enhLoading","btnText","加载中…");
  var bv = null, kind = "", xb = 0;
  if(it.type === "weapon" || it.type === "charms" || it.type === "quivers"){
    /* 法杖有**独立**的额外强化值表（键带等级后缀如「古代法杖（30）」） */
    if(it.type === "weapon"){ bv = ceStaffExtra(it, lv); xb = ceStaffBonus(it) || 0; }
    if(bv == null){
      kind = (it.type === "weapon") ? "melee" : "charmQuiver";
      if(t.byKind && t.byKind[kind]) bv = t.byKind[kind][lv];
      xb = 0;
    }
    if(bv == null) return ceTr("enhTbd","btnText","暂无强化数据");
    /* ⚠ 箭袋站点数据里**没有 attack 字段**，主属性是 precision —— 要按字段取，不能写死 attack */
    var isQuiver = (it.type === "quivers");
    var a = String((isQuiver ? it.precision : it.attack) == null ? "" : (isQuiver ? it.precision : it.attack)).trim();
    if(!a) return ceTr("enhTbd","btnText","暂无强化数据");
    var ab = a.split("~"), lo = parseFloat(ab[0]), hi = ab.length>1 ? parseFloat(ab[1]) : lo;
    if(isNaN(lo)) return ceTr("enhTbd","btnText","暂无强化数据");
    /* 强化值 = 百分数；法杖额外值在此之上再叠加（法师装备独立数值） */
    /* ⚠ xb = 表外额外百分点（古代法杖 +10），要并进百分数一起算 final */
    var pct = (bv + xb) / 100;
    /* ⚠ 保留一位小数：Math.round 会把 17.8 变18，损失精度 */
    var f = function(n){ return (Math.round(n * 10) / 10).toFixed(1); };
    var fLo = lo*pct + lo, fHi = hi*pct + hi;
    return {
      stat: isQuiver ? "precision" : "attack",
      raw: a,
      add: "+" + (bv + xb) + "%",
      extra: xb,                       /* 表外额外百分点（古代法杖 +10），弹窗里要写明 */
      fin: (f(fLo) === f(fHi)) ? f(fLo) : f(fLo) + " ~ " + f(fHi)
    };
  }
  /* 防御力类（头/衣/手/脚/盾） */
  var dv = parseInt(it.armor, 10);
  if(isNaN(dv) || !t.armorTable || !t.armorTable[String(dv)]) return ceTr("enhTbd","btnText","暂无强化数据");
  var row = t.armorTable[String(dv)];
  var n2 = row[Math.min(lv, row.length-1)];
  /* ⚠ 防御力是**整数**，不显示小数点（armorTable 30 行 × 16 级实测全为整数，取整不丢精度）。
     攻击力/精准才保留一位小数 —— 别把两者混成一个格式化函数。 */
  return { stat: "armor", raw: String(dv), add: "+" + (n2 - dv), extra: 0,
           fin: String(Math.round(n2)) };
}
/* 法杖额外强化值：表键「古代法杖（30）」-> 站点名「古代法杖」，要剥掉括号等级。
   站点名可能是简体、表里是繁体 -> 再做一次简繁归一（逐字映射常见的几组）。 */
const CE_T2S = {"渾":"浑","沌":"沌","純":"纯","真":"真","實":"实","習":"习","樹":"树","樺":"桦",
  "鐵":"铁","飾":"饰","戰":"战","鬥":"斗","漁":"渔","農":"农","手":"手","藝":"艺","華":"华",
  "盜":"盗","聖":"圣","騎":"骑","鎧":"铠","鎖":"锁","戒":"戒","項":"项","珠":"珠","寶":"宝"};
function ceT2S(x){
  return String(x||"").replace(/[渾沌純實習樹鐵飾戰漁農藝華盜聖騎鎧鎖]/g, function(c){ return CE_T2S[c] || c; });
}
function ceStaffExtra(it, lv){
  var t = CE_DATA;
  if(!t || !t.staff) return null;
  var raw = String(it.name_cn || "").trim();
  if(!raw) return null;
  var keys = Object.keys(t.staff);
  for(var i=0;i<keys.length;i++){
    /* 表键 = 站点名 + 可选「（等级）」 */
    var base = keys[i].replace(/[（(]\d+[）)]\s*$/, "").trim();
    if(base === raw || ceT2S(base) === ceT2S(raw)){
      var arr = t.staff[keys[i]];
      return arr ? arr[Math.min(lv, arr.length-1)] : null;
    }
  }
  return null;
}
/* ⚠ 古代法杖在 staffExtra 表值之外**额外再加 10 个百分点**（用户 2026-10-05 确认）。
   匹配规则与 ceStaffExtra 相同（键名可带「（等级）」、做简繁归一）。
   返回 0 = 没有额外加成。注意是**百分点 +10**，不是 ×1.1。 */
function ceStaffBonus(it){
  var t = CE_DATA;
  if(!t || !t.staffBonus) return 0;
  var raw = String((it&&it.name_cn) || "").trim();
  if(!raw) return 0;
  var keys = Object.keys(t.staffBonus);
  for(var i=0;i<keys.length;i++){
    var base = keys[i].replace(/[（(]\d+[）)]\s*$/, "").trim();
    if(base === raw || ceT2S(base) === ceT2S(raw)) return Number(t.staffBonus[keys[i]]) || 0;
  }
  return 0;
}
/* 强化数值渲染：弹窗两行 / 卡片下方一行 */
/* ⚠ 属性名必须按**主属性**取，不能一律写「攻击力」：

const CE_STAT_NAME = { attack:"atkName", precision:"precName", armor:"defName" };
const CE_STAT_FB   = { attack:"攻击力", precision:"精准", armor:"防御力" };
function ceLines(it, lv){
  var v = cardEnhText(it, lv);
  if(typeof v === "string") return { line1: v, line2: "" };
  var k = CE_STAT_NAME[v.stat] || "defName";
  /* ⚠ 古代法杖在表值之外还有额外百分点，必须在弹窗里写明，否则玩家会以为算错 */
  var l1 = ceTr("atkFrom2","enhText","原") + " " + v.raw + "　" + ceTr("atkAdd","enhText","加成") + " " + v.add;
  if(v.extra) l1 += "（" + ceTr("enhExtraTip","btnText","额外增加") + " " + v.extra + "%）";
  /* statName 单独给卡片下方用（属性名一行、数值一行） */
  return {
    line1: l1,
    line2: ceTr(k, "enhText", CE_STAT_FB[v.stat] || "防御力") + " " + v.fin,
    statName: ceTr(k, "enhText", CE_STAT_FB[v.stat] || "防御力"),

  };
}

// 弹窗打开时锁定页面滚动（含滚动条宽度补偿，防止页面横向跳动）
let pageScrollLocked = false;
function lockPageScroll(lock){
  if(lock === pageScrollLocked) return;
  pageScrollLocked = lock;
  if(lock){
    const sw = window.innerWidth - document.documentElement.clientWidth;
    const pr = parseFloat(getComputedStyle(document.body).paddingRight) || 0;
    document.body.style.overflow = "hidden";
    if(sw > 0) document.body.style.paddingRight = (pr + sw) + "px";
  } else {
    document.body.style.overflow = "";
    document.body.style.paddingRight = "";
  }
}

    // 怪物（可点击，名称跟随语言）

// 整行名称 -> 别名（去掉【】与数量后缀后精确匹配）
function rowAlias(t){
  let core = String(t).replace(/[【】]/g, "").trim();
  core = core.replace(/\s*[xX×]\s*[\d,~\-/]+\s*.*$/, "").trim();
  return aliasIndex[core] || null;
}

// 只在【】外按 / 拆行（括号内的斜杠保留，如卡牌 10/J/Q/K/A）
function splitOutsideBrackets(t){
  const parts = [];
  let depth = 0, cur = "";
  for(const ch of String(t)){
    if(ch === "【") depth++;
    else if(ch === "】") depth = Math.max(0, depth - 1);
    if(ch === "/" && depth === 0){ parts.push(cur); cur = ""; }
    else cur += ch;
  }
  parts.push(cur);
  return parts.map(x=>x.trim()).filter(Boolean);
}

// 显示层去掉【】，】后留空格（不处理 HTML 标签内部）
function stripBrackets(html){
  return html.replace(/<[^>]*>|[【】]/g, m=>{
    if(m === "【") return "";
    if(m === "】") return " ";
    return m;
  }).replace(/[ \t]{2,}/g, " ").replace(/[ \t]+$/g, "");
}

// 文案显示名（跟随当前语言）
function aliasDisplayName(hit){
  if(hit.kind === "equip"){
    const eq = equipIndex[hit.en];
    if(!eq) return hit.en;
    if(currentLang === "en") return eq.name;
    if(currentLang === "ja") return eq.name_ja || eq.name;
    if(currentLang === "kr") return eq.name_kr || eq.name;
    return eq.name_cn || eq.name;
  }
  const v = dropMap[hit.en] || {};
  if(currentLang === "en") return v.en || hit.en;
  if(currentLang === "ja") return v.ja || v.en || hit.en;
  if(currentLang === "kr") return v.kr || v.en || hit.en;
  return v.cn || hit.en;
}

// 卡牌简写：库伊卡10/J/Q/K/A -> 每张分别链接
function cardShorthandHtml(text){
  const m = String(text).match(/^([^\s【】\/]+?)((?:10|[JQKA])(?:\/(?:10|[JQKA]))+)$/);
  if(!m) return text;
  const base = m[1];
  return m[2].split("/").map(rk=>{
    const name = base + rk;
    const hit = aliasIndex[name];
    if(!hit || hit.kind !== "item") return name;
    return `<span class="item-link" onclick="goItem('${hit.en.replace(/'/g,"\\'")}')">${aliasDisplayName(hit)}</span>`;
  }).join("/");
}

// 同名物品按装备上下文消歧（如两个「魔力卷轴」）
const SRC_CONTEXT = {
  "Ring of Promise": { "魔力卷轴": "Enchant Scroll - MP" }
};

// 获取途径文案里的物品/装备名 -> 可点击（括号内须整体同名，避免误链）
function linkifyEquipText(text, ctxName){
  // 卡牌简写先取出占位，避免被单个卡名截断
  const shorthands = [];
  let out = String(text).replace(/(^|[\s【()（）:：,，、])([^\s【】\/:：,，、]+?)((?:10|[JQKA])(?:\/(?:10|[JQKA]))+)/g, (full, pre, base, ranks)=>{
    shorthands.push(base + ranks);
    return pre + "\u0001" + (shorthands.length - 1) + "\u0001";
  });
  if(aliasPattern){
    out = out.replace(aliasPattern, (m, offset, whole)=>{
      const hit = aliasIndex[m];
      if(!hit) return m;
      const open = whole.lastIndexOf("【", offset);
      const close = whole.lastIndexOf("】", offset);
      if(open > close){
        const end = whole.indexOf("】", offset + m.length);
        const inner = whole.slice(open + 1, end === -1 ? whole.length : end).trim();
        if(inner !== m) return m;
      }
      const ov = ctxName && SRC_CONTEXT[ctxName];
      const targetEn = (ov && ov[m]) || hit.en;
      const en = targetEn.replace(/'/g,"\\'");
      const call = hit.kind === "equip" ? `goEquip('${en}')` : `goItem('${en}')`;
      return `<span class="item-link" onclick="${call}">${aliasDisplayName(hit)}</span>`;
    });
  }
  // 纯文本装备名 -> 本地化显示（不生成链接）
  if(plainEquipPattern){
    out = out.replace(plainEquipPattern, m=>{
      if(m.charAt(0) === "<") return m;
      const eq = plainEquipIndex[m];
      if(!eq) return m;
      if(currentLang === "en") return eq.name || m;
      if(currentLang === "ja") return eq.name_ja || eq.name || m;
      if(currentLang === "kr") return eq.name_kr || eq.name || m;
      return eq.name_cn || m;
    });
  }
  if(shorthands.length){
    out = out.replace(/\u0001(\d+)\u0001/g, (_, i)=>cardShorthandHtml(shorthands[+i]));
  }
  return out;
}

/* 跳转助手：把「英文键或任意语言的名字」解析成当前语言的显示名，找不到就原样返回 */
function locKeyOf(map, v){
  const s = String(v == null ? '' : v).trim();
  if(!s || !map) return null;
  if(map[s]) return s;
  const low = s.toLowerCase();
  const ks = Object.keys(map);
  for(let i = 0; i < ks.length; i++){
    const o = map[ks[i]] || {};
    const cand = [ks[i], o.cn, o.en, o.ja, o.kr];
    for(let j = 0; j < cand.length; j++){
      if(String(cand[j] || '').toLowerCase() === low) return ks[i];
    }
  }
  return null;
}

/* 跳转统一传「当前语言的名称」 */
function equipDispName(name){
  const eq = (typeof equipIndex !== 'undefined' && equipIndex) ? equipIndex[name] : null;
  if(!eq) return name;
  if(currentLang === "ja") return eq.name_ja || eq.name || name;
  if(currentLang === "kr") return eq.name_kr || eq.name || name;
  if(currentLang === "en") return eq.name || name;
  return eq.name_cn || eq.name || name;
}

/* 重置消耗（官方表）：
   武器            → Lv23-29 所有 84/1 · Lv30-39 所有 168/2 · Lv40+ 一般/高级 252/3 · 稀有 504/6 · 英雄 1260/15
   盔甲/头/手/脚   → 同上，但 Lv40+ 英雄是 840/10
   返回 [起源石, 重置的古书]；官方表只给了这两大类，其它类型返回 null（不显示消耗行）。
   等级 <23 的低级装备（重置表里有 6 件 21/22 级）按最低档 84/1 处理。 */
function resetCostOf(item){
  if(!item) return null;
  const isWeapon = item.type === "weapon";
  if(!isWeapon && ["armor","hats","gloves","shoes"].indexOf(item.type) < 0) return null;
  const lv = parseInt(item.level, 10) || 0;
  const rar = item.rarity || "";                 /* 空 = 一般 */
  if(lv < 30) return [84, 1];
  if(lv < 40) return [168, 2];
  if(rar === "稀有") return [504, 6];
  if(rar === "英雄") return isWeapon ? [1260, 15] : [840, 10];
  return [252, 3];                               /* Lv40+ 一般、高级 */
}

  const c = resetCostOf(item);
  if(!c) return "";
  return `<div class="reset-cost">${tr('resetCost','btnText')}：`
       + `<b>${tr('originStone','btnText')}</b> ×${c[0]} · `
       + `<b>${tr('resetBook','btnText')}</b> ×${c[1]}</div>`;
}

<script>
/* ===== PAGE_NAV_PATCH：首页 / 尾页 / 点击「第 x/y 页」输入页码（6 个图鉴页共用） =====
   在各页原有脚本之后运行，复用其 page / filteredXxx / getPerPage / renderCards 或 render / updatePageInfo。 */
(function(){
  var JUMP_LABEL = {
    cn:{first:"首页",last:"尾页",tip:"点击可输入页码"},
    en:{first:"First",last:"Last",tip:"Click to enter a page number"},
    ja:{first:"最初へ",last:"最後へ",tip:"クリックしてページ番号を入力"},
    kr:{first:"처음",last:"마지막",tip:"클릭하여 페이지 번호 입력"}
  };
  function langOf(){ return (typeof currentLang !== "undefined" && currentLang) ? currentLang : "cn"; }
  function lbl(){ return JUMP_LABEL[langOf()] || JUMP_LABEL.cn; }
  function listOf(){
    if(typeof filtered !== "undefined" && filtered) return filtered;
    if(typeof filteredItems !== "undefined" && filteredItems) return filteredItems;
    if(typeof filteredSkills !== "undefined" && filteredSkills) return filteredSkills;
    return [];
  }
  function totalPages(){ return Math.max(1, Math.ceil(listOf().length / getPerPage())); }
  function draw(){
    if(typeof renderCards === "function") return renderCards();
    if(typeof render === "function") return render();
  }
  function syncInfo(){ if(typeof updatePageInfo === "function") updatePageInfo(); }
  function goTo(n){
    var t = totalPages(), v = Math.min(Math.max(1, parseInt(n, 10) || 1), t);
    if(v === page){ syncInfo(); return; }
    page = v; draw(); syncInfo();
  }
  function refresh(){
    var t = totalPages(), L = lbl();
    [["Top","firstTop","lastTop"],["Bot","firstBot","lastBot"]].forEach(function(a){
      var f = document.getElementById(a[1]), l = document.getElementById(a[2]);
      if(f){ f.innerText = L.first; f.disabled = page <= 1; }
      if(l){ l.innerText = L.last;  l.disabled = page >= t; }
      var jw = document.getElementById("pageJump" + a[0]), inp = document.getElementById("pageInput" + a[0]);
      if(jw) jw.title = L.tip;
      if(inp){ inp.max = t; inp.title = L.tip; if(!jw || !jw.classList.contains("editing")) inp.value = page; }
    });
  }
  function cancelEdit(jw, inp){ jw.classList.remove("editing"); inp.value = page; inp.blur(); syncInfo(); }
  function commit(jw, inp){
    if(!jw.classList.contains("editing")) return;
    var v = parseInt(inp.value, 10);
    jw.classList.remove("editing");
    if(!isNaN(v)) goTo(v); else syncInfo();
  }
  function bindJump(sfx){
    var jw = document.getElementById("pageJump" + sfx), inp = document.getElementById("pageInput" + sfx);
    if(!jw || !inp) return;
    jw.onclick = function(ev){
      if(ev && ev.target === inp) return;
      if(jw.classList.contains("editing")) return;
      jw.classList.add("editing");
      inp.value = page;
      inp.focus(); try{ inp.select(); }catch(e){}
    };
    inp.onkeydown = function(e){
      var k = e.key || "";
      if(k === "Enter" || e.keyCode === 13){ e.preventDefault(); commit(jw, inp); inp.blur(); }
      else if(k === "Escape" || e.keyCode === 27){ e.preventDefault(); cancelEdit(jw, inp); }
    };
    inp.onblur = function(){ commit(jw, inp); };
  }
  function bindBtn(id, fn){
    var b = document.getElementById(id);
    if(!b) return;
    b.onclick = function(){ if(b.disabled) return; fn(); };
  }
  ["Top","Bot"].forEach(function(sfx){
    bindJump(sfx);
    bindBtn("first" + sfx, function(){ if(page > 1){ page = 1; draw(); syncInfo(); window.scrollTo(0,0); } });
    bindBtn("last" + sfx,  function(){ var t = totalPages(); if(page < t){ page = t; draw(); syncInfo(); window.scrollTo(0,0); } });
  });
  // 包一层 updatePageInfo：每次刷新（含切语言）都同步按钮文案 / 输入框上下限
  if(typeof updatePageInfo === "function"){
    var _orig = updatePageInfo;
    updatePageInfo = function(){ var r = _orig.apply(this, arguments); refresh(); return r; };
  }
  refresh();
})();
</script>
