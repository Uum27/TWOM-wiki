  function protLevels(cat){
    var P = ENH.protection[cat], out = [];
    if(!P) return out;
    for(var k in P.rate){ var lv = Number(k); if(lv >= P.fromLevel) out.push({lv:lv, rate:P.rate[lv]}); }
    out.sort(function(a,b){ return a.lv - b.lv; });
    return out;
  }
  /* ⚠⚠ 等级口径：**保护卷按「当前强化度」标记**（用户 2026-10-05）。
     玩家在 +7 时点保护卷 = 冲 +8 时生效（失败维持 +7）；在 +8 时点 = 冲 +9 时生效。
     而 enhance_rate.json 的 protection.rate 是按**目标等级**索引的
     （武器 8=10% / 9=1%，防具 6=10% / 7=1%），所以当前等级 = 目标等级 - 1。 */
  function protCurLevels(cat){
    return protLevels(cat).map(function(x){
      return {cur:x.lv - 1, target:x.lv, rate:x.rate};
    });
  }
  /* 该**当前等级**是否已预留保护卷（单次使用，不吃双倍） */
  function hasProtAt(cat, cur){
    if(!protLevel(cat, cur + 1)) return false;   /* 下一级不是可用等级 -> 不可用 */
    return (S.protAt && S.protAt[cur]) > 0;
  }
  function effBase(cat, lv, dbl, prot){
    /* ⚠ 保护卷是「按等级、单次」的：只有该等级被预留了才用它的费率 */
    if(prot){
      var P = protLevel(cat, lv);
      if(P) return P.rate;
    }
    var b = baseRate(cat, lv);
    if(dbl && lv >= ENH.doubleEvent[cat].fromLevel)
      b = Math.min(ENH.doubleEvent.cap, b * ENH.doubleEvent[cat].factor);
    return b;
  }
  function rateAt(cat, lv, stack, o){
    var b = effBase(cat, lv, o.dbl, o.prot);
    return Math.min(100, b * (1 + ENH.blessing.stepRatio * stack));
  }
  function repairCost(item, cat){
    var c = ENH.repair.cost[gradeOf(item)];
    if(!c) return 0;
    var key = ENH.repair.rarityMap[item.rarity || ""] || ENH.repair.rarityMap[""];
    var v = c[cat === "weapon" ? "weapon" : "armor"][key];
    return v || 0;
  }
  function restoreRoll(cat){
    var rows = ENH.repair.restoreChance[cat] || [[1,100]], tot=0, i;
    for(i=0;i<rows.length;i++) tot += rows[i][1];
    var r = Math.random()*tot, s=0;
    for(i=0;i<rows.length;i++){ s += rows[i][1]; if(r < s) return rows[i][0]; }
    return rows[rows.length-1][0];
  }

  /* ---------- 强化数值 ---------- */
  function matchStaff(cn){
    var ex = ENH.bonus.staffExtra;
    if(ex[cn]) return ex[cn];
    var base = String(cn).replace(/[（(].*?[)）]/g, "").trim();
    for(var k in ex){
      if(String(k).replace(/[（(].*?[)）]/g, "").trim() === base) return ex[k];
    }
    return null;
  }
  /* ⚠ 表外额外百分点（古代法杖 +10）。匹配规则与 matchStaff 一致。
     是**百分点 +10**，不是 ×1.1 —— 用户 2026-10-05 确认的口径。 */
  function matchStaffBonus(cn){
    var ex = ENH.bonus.staffExtraBonus;
    if(!ex) return 0;
    if(ex[cn] != null) return Number(ex[cn]) || 0;
    var base = String(cn).replace(/[（(].*?[)）]/g, "").trim();
    for(var k in ex){
      if(String(k).replace(/[（(].*?[)）]/g, "").trim() === base) return Number(ex[k]) || 0;
    }
    return 0;
  }
  /* ⚠⚠ 不能按 tab 类别（cat）判 —— 护身符/箭袋**也在「防具」tab 里**（都用盔甲卷轴、
     走防具那套概率表），但主属性是 攻击力/精準，不走防具表。
     必须按 `mainStatOf` 的主属性分流：
       "armor"    -> 查 armorTable（防具度 × 强化等级）= 头/衣/手/脚/盾
       "attack"   -> 查 byKind[kindOf[type]] = 武器(基础) / 护身符(charmQuiver)
       "precision"-> 查 byKind[charmQuiver] = 箭袋
     法杖另有「额外强化值」表，命中则优先用它。 */
  function isDefenseKind(item){
    return (ENH.mainStatOf[item.type] || "") === "armor";
  }
  function bonusValue(item, cat, lv){
    var li = Math.min(lv, ENH.maxEnhance);
    if(!isDefenseKind(item)){
      var st = matchStaff(item.name_cn);
      if(st) return st[li] + matchStaffBonus(item.name_cn);
      var kind = ENH.bonus.kindOf[item.type] || "melee";
      var arr = ENH.bonus.byKind[kind];
      return arr ? arr[li] : null;
    }
    var a = parseInt(item.armor, 10);
    if(isNaN(a)) return null;
    var t = ENH.bonus.armorTable[String(a)];
    return t ? t[Math.min(li, t.length-1)] : null;
  }

  /* 最终攻击力 = (武器基本攻击力 + 额外强化值) / 100
     ⚠ all_equip.attack 是**区间字符串**（如 "1~3"），两端都要算，不能只算下限。
     解析失败返回 null（界面显示「待补充」，不编数字）。 */
  function finalAtk(item, bv){
    if(bv == null) return null;
    var a = String(item.attack == null ? "" : item.attack).trim();
    if(!a) return null;
    var lo, hi;
    if(a.indexOf("~") >= 0){
      var ab = a.split("~");
      lo = parseFloat(ab[0]); hi = parseFloat(ab[1]);
      if(isNaN(lo)) lo = NaN;
      if(isNaN(hi)) hi = lo;
    } else {
      lo = hi = parseFloat(a);
    }
    if(isNaN(lo)) return null;
    /* 强化值表里的数字是**百分数**（+1=11 → 11%、+15=264 → 264%）：
       加成 = 攻击力 × 强化值%，区间两端各自算 —— lo×bv% + lo / hi×bv% + hi。
       ⚠ 不要写成 lo + bv（那是把百分数当倍率，会把 7 算成 271）。 */
    var r = bv / 100;
    return {lo:lo * r + lo, hi:hi * r + hi, add:bv, rawLo:lo, rawHi:hi};
  }
  function fmtAtk(v){
    if(!v) return "";
    var r = function(n){ return String(Math.round(n)); };
    return v.lo === v.hi ? r(v.lo) : r(v.lo) + " ~ " + r(v.hi);
  }

  /* ---------- 重置 ---------- */
  function resetData(item){
    return (typeof resetMap !== "undefined") ? resetMap[String(item.name_cn || "").trim()] : null;
  }
  function resetCostBy(item, way){
    if(typeof resetCostOf !== "function") return 0;
    var c = resetCostOf(item);
    if(!c) return 0;
    return way === "book" ? c[1] : c[0];
  }
  function resetRoll(rd){
    var out = [], i, j;
    for(j=0;j<rd.stats.length;j++){
      var st = rd.stats[j], cum=[], s=0;
      for(i=0;i<st.rows.length;i++){ s += st.rows[i][1]; cum.push(s); }
      cum[cum.length-1] = 100;
      var r = Math.random()*100, lo=0, hi=cum.length-1;
      while(lo<hi){ var m=(lo+hi)>>1; if(cum[m] < r) lo=m+1; else hi=m; }
      out.push({key:st.key, name:st.name, val:st.rows[lo][0]});
    }
    return out;
  }

  /* ---------- 强化模拟一次 ---------- */
  function newEnhState(item, cat){
    /* ⚠ cur 必须从**起始强化度 S.from** 起算，不能硬编码成安全段上限（武器6/防具4）。
       否则新建 state 后 cur 已经在上限，「一键强化」的循环一次都不跑 ——
       卷轴/成功数全是 0，玩家看到「按了没反应」。 */
    var c0 = (typeof S !== "undefined" && S.from != null) ? S.from : 0;
    c0 = Math.max(0, Math.min(ENH.maxEnhance, c0));
    /* ⚠ stk = 普通卷的叠加层数；stkP = **保护卷自己的**叠加层数（两套独立） */
    return {item:item, cat:cat, cur:c0, stk:{}, stkP:{}, tries:0,
      ok:0, fail:0, scrolls:0, holy:0, prot:0, stone:0, repairs:0,
      /* ⚠ guardHit = 这一轮**没跑到 target** 就撞上 ENH.guardMax 护栏被截断。
         UI 用它显示「未达标」—— 绝不能靠 `cur === target` 判断（护栏会骗）。 */
      guardHit:false,
      levelN:{}, stkMax:{}, pMax:{}, stkPMax:{}, pPMax:{}, protBy:{}, log:[]};
  }
  /* 把界面上的「已失败 n 次」播种到**每一个危险等级**（各等级独立累加） */
  function seedStk(e){
    e.stk = {}; e.stkP = {};
    var n0 = S.stack || 0;
    if(!n0) return;
    /* 两套都播种：玩家填的「已失败 n 次」对普通卷和保护卷各自成立 */
    for(var lv = ENH.safeMax[e.cat] + 1; lv <= ENH.maxEnhance; lv++){ e.stk[lv] = n0; e.stkP[lv] = n0; }
  }
  function stepEnhance(st, o){
    var t = st.cur + 1;
    /* ⚠ 保护卷按**当前等级 st.cur** 判定（+7 点的卷用在冲 +8 上），且是「单次」：
       这一等级有预留才算，用掉即扣。不用再读全局开关（已移除 S.prot）。 */
    var useProt = hasProtAt(st.cat, st.cur);
    /* ⚠⚠ 叠加层数是**两套独立的**：普通卷记 stk[t]，保护卷记 stkP[t]（用户 2026-10-05）。
       「保护卷的叠加概率」= 保护卷基础率 × (1 + 10% × 保护卷自己的失败次数)，
       不能把普通卷攒的层数混进来 —— 否则 30% 的普通卷叠了 5 层会让 10% 的保护卷
       直接变成 15%，与官方规则不符。 */
    var sk = useProt ? (st.stkP[t] || 0) : (st.stk[t] || 0);
    var op = {dbl:o.dbl, holy:o.holy, prot:useProt};
    var p = rateAt(st.cat, t, sk, op);
    /* ⚠ 圣水/保护卷只在**危险段**（100% 之外）才消耗 —— 安全段必定成功，用它们没有意义 */
    var risky = t > ENH.safeMax[st.cat];
    st.tries++; st.scrolls += ENH.scroll.perTry;
    if(o.holy && risky) st.holy++;
    if(useProt && risky){
      st.prot++;
      if(!st.protBy) st.protBy = {};
      /* ⚠ 分桶键 = **当前等级**（与按钮/KPI 标签同一口径） */
      st.protBy[st.cur] = (st.protBy[st.cur]||0) + 1;
      S.protAt[st.cur] = (S.protAt[st.cur]||1) - 1;
    }
    st.levelN[t] = (st.levelN[t]||0) + 1;
    /* ⚠ 直接记录**实际用过的最大层数**，不要用概率反推：
       反推的分母若用「不含双倍的基础值」，开双倍时会成倍高估（+8 叠1层被算成叠12层）。 */
    if(risky){
      /* ⚠ 保护卷与普通卷的最大层数/最大率也分开记，目标表要分别显示 */
      if(useProt){
        if((st.stkPMax[t]||0) < sk) st.stkPMax[t] = sk;
        if((st.pPMax[t]||0) < p) st.pPMax[t] = p;
      } else {
        if((st.stkMax[t]||0) < sk) st.stkMax[t] = sk;
        if((st.pMax[t]||0) < p) st.pMax[t] = p;
      }
    }
    var good = Math.random()*100 < p;
    var rec = {n:st.tries, lv:t, p:p, b:effBase(st.cat, t, o.dbl, useProt),
               ok:good, note:"", after:st.cur};
    if(good){
      /* ⚠ 叠加是**按等级各自独立**的：+8 成功只清 +8 的层数，+7 的层数不动。
         两套表都清（当前这次走的是哪套就清哪套，另一套留着继续攒）。 */
      st.cur = t;
      if(useProt) st.stkP[t] = 0; else st.stk[t] = 0;
      st.ok++; rec.after = t;
    } else {
      if(useProt) st.stkP[t] = sk + 1; else st.stk[t] = sk + 1;
      st.fail++;
      if(useProt){
        /* 保护卷：强化度维持不变（不清零），只消耗一张 */
        rec.note = tx("keepProt") + " +" + st.cur;
      } else if(o.holy){
        /* 圣水失败：归零但免维修，日志只记「圣水-1」 */
        st.cur = 0; rec.note = tx("holyUsed"); rec.after = 0;
      } else {
        /* 损坏 → 归零且**不再自动修理**，本轮模拟到此为止（修理是玩家的单独操作） */
        st.cur = 0; st.broken = true; st.repairs++;
        rec.note = tx("broken") + "　" + tx("needRepair");
        rec.after = 0;
      }
    }
    /* 只记录危险等级（100% 的安全段不进日志） */
    if(t > ENH.safeMax[st.cat]) st.log.push(rec);
    return good;
  }
  function runEnhance(st, o, autoRepair){
    var guard = 0;
    /* ⚠⚠⚠ 护栏从 100000 抬到 **50000000**（用户 2026-10-05）。
       为什么必须抬：**失败会归零**（st.cur=0），每失败一次都要从 +0 重爬，
       而武器 +9 起基础率只有 5% —— 需要的卷轴是**指数级**增长的（实测均值）：
         +7 ≈ 18 张 / +8 ≈ 112 / +9 ≈ 1,159 / +10 ≈ 10,612
         +11 ≈ 124,011 / +12 ≈ 1,221,027 / +13 ≈ 16,792,250
       旧的 100000 护栏从 **+11 起就必然被拦**，导致：
         - KPI「卷轴」恒显 100000（= guard 上限，perTry=1）；
         - `agg.cur` 被写死成 S.to → 界面假装「已达 +12」，其实那一轮早中断了；
         - 日志停在断点。
       抬到 5e7 覆盖到 +13 的量级。
       ⚠⚠ 护栏仍然必须存在：+14 以上随机游走可能永不收敛，没有护栏 = 页面永久死循环。
       **护栏触发时必须如实上报 `st.guardHit`，不许假装成功**（见 simBatch / simQuick）。 */
    st.guardHit = false;
    while(st.cur < st.target && guard < ENH.guardMax){
      if(st.broken){
        if(!autoRepair) break;
        var c = repairCost(st.item, st.cat);
        st.stone += c; st.repairs++;
        st.cur = restoreRoll(st.cat);
        st.broken = false;
        st.log.push({n:st.tries, lv:st.cur, p:0, ok:false, isRepair:true,
                     note:fmt("repairBack", c, st.cur), after:st.cur});
      }
      stepEnhance(st, o); guard++;
    }
    /* ⚠ 到达护栏 = **没跑到目标**，必须记下来给 UI 如实上报 */
    if(st.cur < st.target) st.guardHit = true;
    return st;
  }

  /* ---------- 渲染 ---------- */
  function iconHtml(item){
    var f = item.icon || "";
    if(!f) return '<div class="sim-equip-icon"></div>';
    return '<img class="sim-equip-icon" src="' + esc("equip_icons/" + encodeURI(f)) +
           '" alt="" onerror="this.style.visibility=\'hidden\'">';
  }
  /* ⚠ 手机端原生 <select> 会弹系统选择器、在弹窗里划不动 —— 改成自绘下拉：
     按钮显示当前值，点开一个可滑动的分组列表（.sim-sel-list，max-height 46vh）。 */
  function optHtml(cat){
    var pool = poolOf(cat), g = {}, order = [], i, k;
    for(i=0;i<pool.length;i++){
      var ty = pool[i].type;
      if(!g[ty]){ g[ty] = []; order.push(ty); }
      g[ty].push(pool[i]);
    }
    /* ⚠⚠ 触发按钮 `#simEquipSelBtn` **已整块删除**（用户 2026-10-06）。
       它和装备头（.sim-equip.clickable）功能完全重复 —— 两者都调 `simEquipMenu()`。
       旧按钮存在的唯一原因是 `placeSelList(btn, L)` 要一个元素算浮层坐标；
       现在 `simEquipMenu()` 改为**直接用装备头当锚点**，按钮彻底不需要了。
       ⚠ 保留 `#simEquipSelWrap` 这层 div：它是 `.sim-sel-list` 的父级，
         删掉会改变浮层的 initial containing block（position:fixed 不受影响，但别冒险）。 */
    var h = '<div class="sim-sel" id="simEquipSelWrap">';
    h += '<div class="sim-sel-list" id="simEquipSelList" hidden>';
    /* 🆕 搜索框（用户 2026-10-06）：**固定在浮层顶部**，随浮层一起滚、不参与过滤。
       ⚠ 必须用 `position:sticky;top:0` 粘在列表容器里 —— 若放在容器外会被 max-height 裁掉；
         放在流内则随列表滚动，滚几屏就看不见了（等于没有）。
       ⚠ 放在 `<div class="sim-sel-group">`（本来就是 sticky）之后，z-index 更高以盖住分组标题。 */
    h += '<div class="sim-sel-search">' +
         '<input type="search" id="simEquipSearch" autocomplete="off" spellcheck="false"' +
         ' placeholder="' + esc(tx("searchEquip")) + '"' +
         ' oninput="simFilterEquip(this.value)"' +
         ' onclick="event.stopPropagation()">' +
         '<div class="sim-sel-count" id="simEquipCount"></div>' +
         '</div>';
    /* ⚠ 已去掉「请选择装备」这个占位选项（用户 2026-10-05）：
       头部已经明确提示未选择，占位项点了等于「清空选择」，反而让人困惑。
       每项挂 data-s（简体名）供 simFilterEquip 做中文匹配。 */
    for(k=0;k<order.length;k++){
      var t = order[k];
      h += '<div class="sim-sel-group" data-t="' + esc(t) + '">' + esc(typeLabel(t)) + '</div>';
      for(i=0;i<g[t].length;i++){
        var x = g[t][i];
        h += '<div class="sim-sel-opt' + (x.name === S.name ? " on" : "") +
             '" data-v="' + esc(x.name) + '" data-s="' + esc(x.name_cn || x.name) + '"' +
             ' data-t="' + esc(t) + '" onclick="simPick(this.dataset.v)">' +
             esc(dispName(x)) + '</div>';
      }
    }
    /* 无结果占位：由 simFilterEquip 显示/隐藏（默认 hidden，别一开浮层就顶一条） */
    h += '<div class="sim-sel-none" id="simEquipNone" hidden>' + esc(tx("noEquipMatch")) + '</div>';
    h += '</div></div>';
    return h;
  }
  /* 过滤装备（用户 2026-10-06）：**只改 class，不重建 DOM** ——
     重建会让输入框失焦、输入法中断、每次按键都重排 300+ 节点。
     ⚠ 匹配四语名（当前语言名 + 简中名 + 英文名）任一命中即可，中文输入也能搜。 */
  function simFilterEquip(q){
    var L = document.getElementById("simEquipSelList");
    if(!L) return;
    q = String(q == null ? "" : q).trim();
    var lc = q.toLowerCase();
    var opts = L.querySelectorAll(".sim-sel-opt");
    var i, o, shown = 0;
    for(i=0;i<opts.length;i++){
      o = opts[i];
      /* ⚠ 匹配三路：简中名（data-s）+ 当前语言显示名（textContent）+ 英文名（data-v）。
         这样中/英/日/韩任一语言下都能搜到同一件装备。 */
      var hay = (o.getAttribute("data-s") || "") + " " + o.textContent +
                " " + (o.getAttribute("data-v") || "");
      var hit = !lc || hay.toLowerCase().indexOf(lc) >= 0;
      o.style.display = hit ? "" : "none";
      if(hit) shown++;
    }
    /* 整组都没命中就藏掉分组标题（否则「武器」下面空一块） */
    var groups = L.querySelectorAll(".sim-sel-group");
    for(i=0;i<groups.length;i++){
      var g = groups[i];
      var t = g.getAttribute("data-t");
      var inGroup = L.querySelectorAll('.sim-sel-opt[data-t="' + (window.CSS && CSS.escape ? CSS.escape(t) : t) + '"]');
      var n = 0;
      for(var j=0;j<inGroup.length;j++) if(inGroup[j].style.display === "") n++;
      g.style.display = (q && n === 0) ? "none" : "";
    }
    var c = document.getElementById("simEquipCount");
    if(c) c.textContent = q ? (shown + " / " + opts.length) : "";
    var none = document.getElementById("simEquipNone");
    if(none) none.hidden = shown !== 0;
  }
  /* ⚠⚠ 必须挂到 window —— 搜索框用内联 `oninput="simFilterEquip(this.value)"` 调用。
     闭包里的 function 声明**不会**成为全局属性，内联属性解析不到（ReferenceError）。
     参见同文件 window.simPick / window.simSet 的同款做法。 */
  window.simFilterEquip = simFilterEquip;
  function lvOptions(cat, sel){
    var mx = ENH.maxEnhance, h = "", i;
    for(i=0;i<=mx;i++) h += '<option value="'+i+'"'+(i===sel?" selected":"")+'>+'+i+'</option>';
    return h;
  }
  /* ⚠ stateKey（写进 S 的属性名）与 txtKey（lang.json 文案 key）必须分开，
     曾经混用导致 simSet('swDbl') 写错字段，开关视觉上"点了没反应"。 */
  /* 🆕 修理按钮（挪到开关行圣水之后，用户 2026-10-06）。
     ⚠ 未损坏时 disabled 置灰：位置固定、玩家能预期，但不会误点。
     ⚠ 费用用 `repairCost()` 实时算（按装备等级档 + 稀有度），文案是「修理 −N石」。 */
  function repairBtnHtml(cat, broken){
    var cost = 0;

    return '<button class="sim-btn amber sim-repair' + (broken ? " on" : " dis") + '"' +

  function sw(stateKey, txtKey, on){
    var id = "sim" + stateKey.charAt(0).toUpperCase() + stateKey.slice(1);
    return '<label class="sim-sw"><input type="checkbox" id="'+id+'"'+(on?" checked":"")+
           ' onchange="simSet(\''+stateKey+'\',this.checked)"><i></i><span>'+esc(tx(txtKey))+'</span></label>';
  }
  /* 装备头的原始属性文字（未强化值）：攻击力 7~35 / 防御力 11 / 精准 8。
     ⚠ 属性分流必须按 `ENH.mainStatOf[it.type]`：护身符/箭袋在「防具」tab 但主属性是攻击力/精准。
        箭袋数据里**没有 attack 字段**，主属性是 precision。 */
  function equipRawStatTxt(it){
    var ms = (ENH && ENH.mainStatOf) ? (ENH.mainStatOf[it.type] || "") : "";
    /* ⚠ 属性名取 lang.json 的 `enhText` 命名空间（simText 里没有），
       用 ceTr(key, ns, fallback) —— tx() 不支持第二个命名空间参数，会取不到。 */
    if(ms === "armor"){
      var a0 = parseInt(it.armor, 10);
      if(isNaN(a0)) return "";
      return ceTr("defName", "enhText", "防御力") + " " + a0;
    }
    if(ms === "precision"){
      var p0 = parseInt(it.precision, 10);
      if(isNaN(p0)) return "";
      return ceTr("precName", "enhText", "精准") + " " + p0;
    }
    var at = String(it.attack == null ? "" : it.attack).trim();
    if(!at) return "";
    return ceTr("atkName", "enhText", "攻击力") + " " + at;
  }
  /* ---------- 副属性（装备头右侧） ----------
     ⚠⚠ 数据源 = **装备卡片同一套**：`all_equip.json` 的装备对象自带副属性字段
       （如 `str:"2~10"` / `hit:"0~12"` / `lightning_Resist:"0~11"`），值**已经是范围字符串**。
       用户 2026-10-06 明确要求「用装备卡片上写的就行」—— 不要另找数据源。
       （我先前绕去 option_reset.json 拼 min~max 是多此一举，见下方「为什么不用它」）

     副属性 = `statKeys` 去掉**主属性**（precision/attack/armor）后的其余字段。
     ⚠ 主属性走 `ENH.mainStatOf[it.type]`（护身符/箭袋的 armor/precision 也在「防具」tab 里，
       不能靠 type 判断），这里只排除那三个**固定 key**，与卡片逻辑一致。

     ⚠ 为什么不用 option_reset.json（留档，别再犯）：
       - 覆盖只有 **162/307**，而卡片字段覆盖 **290/307**（多 128 件）。
       - 精度更差：卡片写 `str:"2~10"`，option_reset 只能给 `0~10` ——
         因为它把「数值 0」也当成一个可能档位，min 被拉到 0，**和卡片显示的口径不一致**。
       - 382 个可比对条目里有 70 个数值对不上（都是这个「0 档位」造成的）。
     ⚠ 17 件（皮衣/皮革盔甲/实习魔法师袍/圆圆帽/库伊帽/面具/圣诞老人帽/老旧帽子…）确实无副属性字段
       → 显式写「暂无副属性数据」，留空白会被误读成「渲染失败」。 */
  var SIM_SUBATTR_KEYS = ["speed","block","hp","mana","hp_regen","mana_regen","hit","cri",
                         "str","dex","int","deadly","ice_resist","fire_resist","magic_resist",
                         "lightning_Resist","move","set2","set3"];
  function subAttrList(it){
    if(!it) return null;
    var out = [];
    for(var i=0;i<SIM_SUBATTR_KEYS.length;i++){
      var k = SIM_SUBATTR_KEYS[i];
      var v = it[k];
      /* ⚠ 判定与卡片 `renderCards` 完全一致：null / "" / 0 / "0" 都算「没有」 */
      if(v == null || v === "" || v === 0 || v === "0") continue;
      out.push({ key:k, name:ceTr(k, "attrName", k), val:statValueText(k, v) });
    }
    return out.length ? out : null;
  }
  function subAttrHtml(it){
    var list = subAttrList(it);
    if(!list) return '<div class="sim-subattr empty">' + esc(tx("noSubAttr")) + '</div>';
    var rows = "";
    for(var i=0;i<list.length;i++){
      rows += '<div class="sim-subattr-i">' +
              '<span class="sim-subattr-k">' + esc(list[i].name) + '</span>' +
              '<span class="sim-subattr-v">' + esc(list[i].val) + '</span>' +
              '</div>';

  }
  function render(){
    var b = document.getElementById("simBody");
    if(!b) return;
    /* ⚠⚠ 下拉列表是**浮层**：为躲 overflow 裁剪，`placeSelList` 会把它 appendChild 到 body。
       它因此**不在 simBody 里**，render() 重建 simBody.innerHTML 时回收不掉它。
       而 optHtml() 又会在新 HTML 里生成一个同名 #simEquipSelList ——
       于是页面里累积出多个同 id 元素，getElementById 命中的是最早那个（旧的、还开着）。
       表现：选完装备框不消失、点按钮也关不掉。
       修法：render 前先把 body 下的旧浮层**摘除**（不是设 hidden）。 */
    if(typeof window.simSelDrop === "function") window.simSelDrop();
    else {
      /* 兜底：window.simSelDrop 可能尚未赋值（openSim 首次就调render）-> 直接按 class 摘 */
      var olds = document.querySelectorAll("body > .sim-sel-list");
      for(var oi=0; oi<olds.length; oi++) olds[oi].parentNode.removeChild(olds[oi]);
    }
    var it = S.item, cat = S.cat;
    var h = "";
    /* 装备头：**整块可点**打开装备列表（用户 2026-10-05：点旁边的图标切换装备）。
       下拉列表本身移到头部里（见optHtml），不再单独一行。 */
    h += '<div class="sim-equip clickable"' +
         ' onclick="simEquipMenu(this)" title="' + esc(tx("changeEquip")) + '"' +
         '>' + (it ? iconHtml(it) : '<div class="sim-equip-icon"></div>') +
         '<div class="sim-equip-txt">' +
           '<div class="sim-equip-name">' + (it ? esc(dispName(it)) : esc(tx("pick"))) +
             (it ? '<span class="sim-swap">' + esc(tx("changeEquip")) + '</span>' : '') + '</div>' +
           (it ? '<div class="sim-equip-sub">Lv' + esc(it.level) + ' · ' + esc(typeLabel(it.type)) +
                ' · ' + esc(rarityLabel(it.rarity)) + ' · ' + esc(tx("scrollAuto")) + ' ' + esc(gradeOf(it)) + esc(tx("scrollSuffix")) + '</div>' : '') +
           /* ⚠ 装备名下方直接显示**原始属性数值**（用户 2026-10-05：「要显示装备现在的属性数值」）。
              用ceStatOf(名字, 0) 拿 lv=0 的 raw 值 —— 那是未强化前的基准攻击力/防御力/精准。 */
           (it ? (function(){
              var raw = equipRawStatTxt(it);
              return raw ? '<div class="sim-equip-stat">' + esc(raw) + '</div>' : '';
            })() : '') +
         '</div>' +
         /* ⚠ 副属性：放在装备头**右侧**（用户 2026-10-06）。
           `.sim-equip` 是 flex，图标 + 文本 + 副属性三栏；窄屏靠 CSS 换行到下一行。 */
         (it ? subAttrHtml(it) : '') +
         '</div>';
    /* ⚠ 装备列表浮层直接挂在装备头下方（不再有触发按钮，2026-10-06）。
       未选装备时装备头也可点，所以这里**不需要** picked 状态类。 */
    h += '<div class="sim-selhost" id="simEquipSelHost">' + optHtml(cat) + '</div>';
    /* ⚠ 未选装备时**不再显示「请选择装备…」提示**（用户 2026-10-05）：
       装备头已经是可点入口（带 hover 背景 + 「点击切换装备」提示），再挂一条提示纯属冗余。
       只渲染装备头 + 选择按钮，其余内容等选了装备再出。 */
    if(!it){ b.innerHTML = h; return; }

    /* 强化后数值：放在参数区**上方**，随起始强化度实时变化 */
    /* ⚠ 跟随**当前实际强化度**：跑过模拟/点过强化后用 e.cur（会随每次强化变），
       还没跑过时用起始值（现固定 0 = 未强化） */
    var curLv = (S.enh && S.enh.cur != null) ? S.enh.cur : S.from;
    var bvt = bonusValue(it, cat, curLv);
    if(bvt != null){
      h += '<div class="sim-bv"><b>' + esc(tx("bonusAt")) + ' +' + curLv + '</b>';
      /* 按**主属性**分流（护身符/箭袋也在防具 tab，但主属性不同） */
      var ms = ENH.mainStatOf[it.type] || "";
      var a0 = parseInt(it.armor, 10);
      var fa = finalAtk(it, bvt);
      if(ms === "armor" && !isNaN(a0)){
        h += '<span>' + esc(fmt("defAt", a0, bvt, bvt - a0)) + '</span>';
      } else if(fa){
        h += '<span>' + esc(tx("atkFinal")) + ' ' + esc(fmtAtk(fa)) +
             '<i>' + esc(tx("atkFrom")) + ' ' + fa.rawLo +
             (fa.rawHi !== fa.rawLo ? '~' + fa.rawHi : '') +
             '　' + esc(tx("atkAdd")) + ' +' + fa.add + '</i></span>';
      } else if(ms === "precision"){
        var p0 = parseInt(it.precision, 10);
        if(!isNaN(p0)) h += '<span>' + esc(fmt("precAt", p0, bvt, bvt - p0)) + '</span>';
        else h += '<span>' + esc(tx("bvOnly")) + ' +' + bvt + '</span>';
      } else {
        h += '<span>' + esc(tx("bvOnly")) + ' +' + bvt + '</span>';
      }
      h += '</div>';
    }

    /* 强化段 */
    h += '<div class="sim-sec sim-sec-enh">' + esc(tx("secE")) + '</div>';
    /* ⚠ 当前强化等级做成**显眼徽章**：玩家最关心的就是「我现在是 +几」，
       保护卷按钮的标签（+7 / +8）也是按它推出来的，之前只藏在日志/表格里很难看。 */
    var curLv = (S.enh && S.enh.cur != null) ? S.enh.cur : S.from;
    /* 下一级的实时成功率（把「失败叠加 +10%」显式展示出来）。
       ⚠ 先算出来，徽章里要显示它 —— 所以这段必须提到 sim-row 之前。 */
    var nowL = (S.enh && S.enh.cur != null ? Math.min(ENH.maxEnhance, S.enh.cur + 1) : S.to);
    var showNow = nowL > ENH.safeMax[cat];
    var pNowOn = showNow ? hasProtAt(cat, nowL - 1) : false;
    var bNow = showNow ? effBase(cat, nowL, S.dbl, pNowOn) : 0;
    var skNow = showNow
      ? (S.enh ? ((pNowOn ? (S.enh.stkP||{})[nowL] : (S.enh.stk||{})[nowL]) || 0) : (S.stack || 0))
      : 0;
    var pNow = showNow ? rateAt(cat, nowL, skNow, {dbl:S.dbl, prot:pNowOn}) : 0;
    /* 徽章 + 成功率合成一块：上面大号等级、下面一行「下一级 +8 成功率 10% → 12%」 */
    h += '<div class="sim-curbar' + (S.enh && S.enh.broken ? " bad" : "") + '">' +
         '<div class="sim-cur-top">' +
           '<span class="sim-cur-lb">' + esc(tx("curLv")) + '</span>' +
           '<b class="sim-cur-v">+' + curLv + '</b>' +
           '</div>' +
         (showNow
           ? '<div class="sim-cur-rate">' + esc(tx("nowRate")) + ' <b>+' + nowL + '</b>　' +
             bNow.toFixed(1) + '%' + (skNow ? ' <i>+' + (pNow - bNow).toFixed(1) + '%</i>' : '') +
             ' → <b class="ok">' + pNow.toFixed(1) + '%</b>' +
             (skNow ? '<span class="sim-stk">' + esc(fmt("stkN2", skNow)) + '</span>' : '') +
             (protLevel(cat, nowL)
               ? '<span class="sim-cur-prot">' + esc(tx("protOn")) +
                 (function(){var P=protLevel(cat, nowL); var sk=(S.enh&&S.enh.stkP)?(S.enh.stkP[nowL]||0):0;
                  var pp=Math.min(100, P.rate*(1+ENH.blessing.stepRatio*sk));
                  return sk? (' '+P.rate+'%→'+(Math.round(pp*10)/10).toFixed(1)+'%') : (' '+P.rate+'%');})() +
                 '</span>' : '') +
             '</div>'
           : '<div class="sim-cur-rate dim">' + esc(fmt("safeZone", ENH.safeMax[cat])) + '</div>') +
         '</div>';
    /* ⚠ 双倍活动 / 圣水 两个开关移到**徽章正下方**独立一行（用户 2026-10-05），
       跟操作按钮分开 —— 开关是「条件」，按钮是「动作」，混在一行容易看错。 */
    /* ⚠ 开关行：双倍 / 圣水 / **修理**（用户 2026-10-06 把修理挪到圣水后面）。
       ⚠ 修理按钮**始终渲染**（未损坏时 disabled 置灰）——
         若只在损坏时出现，开关行会突然多出一个按钮把布局挤一下，玩家找不到它跑哪去了。
       ⚠ 放不下会自动换行：`.sim-row` 本来就是 `flex-wrap:wrap`。 */
    var brokenNow = !!(S.enh && S.enh.broken);
    h += '<div class="sim-row sim-row-sw">' + sw("dbl","swDbl",S.dbl) + sw("holy","swHoly",S.holy) +
         repairBtnHtml(cat, brokenNow) + '</div>';
    /* 操作按钮行：一键强化 / 保护卷 / 强化1次（独占一行） */
    /* ⚠ 按钮顺序：一键强化 / **强化 1 次** / 保护卷（用户 2026-10-05）。
       保护卷挪到最后 —— 它是「特殊手段」，不该夹在两个常规操作中间。 */
    h += '<div class="sim-btns">' +
         '<button class="sim-btn pri" onclick="simQuick()">' + esc(tx("quick")) + ' +' + S.from + '→+' + ENH.safeMax[cat] + '</button>' +
         '<button class="sim-btn" onclick="simOnce()">' + esc(tx("once")) + '</button>' +
         protBtnHtml(cat) +
         '</div>';
    /* ⚠⚠ 参数行：**模拟强化目标 / 强化模拟 / 次数 / 清零**（2026-10-06 把「次数」框加回，
       置于「强化模拟」与「清零」之间；同日 label 由「批量强化目标」改「模拟强化目标」）。
       - 「模拟强化目标」label（同行走 S.from）。
       - 「次数」框 = `S.runs`（1~5000，留空按 1 次算），驱动 `simBatch` 重复跑 N 遍取平均；
         2026-10-05 曾整块删除，2026-10-06 恢复，`.sim-runs` CSS 重新生效。
         simResetBatch 也读 S.runs（上限 2000）。
       - 双倍/圣水开关已上移到徽章下方，这里不再重复。
       位置仍在**操作按钮行之后、KPI 统计框之前**（紧贴统计框上方）。 */
    h += '<div class="sim-row sim-row-params">' +
         '<span class="sim-lb">' + esc(tx("toLabel")) + '</span>' +
         '<select class="sim-ctl sim-num" id="simTo" onchange="simSet(\'to\',+this.value)">' +
         lvOptions(cat, S.to) + '</select>' +
         '<button class="sim-btn" onclick="simBatch()">' + esc(tx("batch")) + '</button>' +
         '<span class="sim-runs">' + esc(tx("runs")) + '<input class="sim-ctl sim-num" id="simRuns" type="number" min="1" max="5000" placeholder="' + esc(tx("runsPh")) + '" value="' + (S.runsRaw!=null?S.runsRaw:'') + '" onchange="simSet(\'runs\',this.value)" title="' + esc(tx("runsHint")) + '"></span>' +
         '<button class="sim-btn ghost" onclick="simClear()">' + esc(tx("clear")) + '</button>' +
         '</div>';

    /* ⚠ KPI 与目标表的数据源：**批量优先**（S.agg 是 N 遍平均值），没有才用单次（S.enh）。

    var e = S.agg || S.enh;
    if(e){
      /* ⚠⚠ 「未达标」判定（用户 2026-10-05）。
         **不许再靠 `cur === target` 判断** —— 旧代码把 `agg.cur` 写死成 S.to，

      var tgt = (e.target != null) ? e.target : S.to;
      var notReach = !!e.guardHit || (e.cur != null && tgt != null && e.cur < tgt);
      /* 「成功」格是**保护卷消耗**：上下两层分别显示 +N 保护卷 / +M 保护卷（各等级用量）。

      h += '<div class="sim-kpis">' +
        kpi(tx("kScroll"), e.scrolls, notReach ? "warn" : "") + kpiProt(cat, e) +
        kpi(tx("kFail"), e.fail, "bad") + kpi(tx("kHoly"), e.holy, "") +
        kpi(tx("kStone"), e.stone, "") + kpi(tx("kBroken"), e.repairs, "bad") + '</div>';
      /* ⚠ 未达标横幅：说清「实际到几级 / 目标几级 / 撞了护栏」，

      if(notReach){
        var gTxt = e.guardHit
          ? fmt("guardHit", fmtNum(ENH.guardMax), tgt)
          : (e.cur != null ? (tx("notReach") + "　+" + e.cur + " / +" + tgt) : tx("notReach"));
        h += '<div class="sim-warnbar">' + esc(gTxt) + '</div>';

      if(e.log.length){

        h += '<div class="sim-log">';
        if(e.log.length > LOG_CAP)
          h += '<div class="sim-log-more">' + esc(fmt("logMore", fmtNum(e.log.length), LOG_CAP)) + '</div>';
        for(var i=e.log.length-1; i>=Math.max(0,e.log.length-LOG_CAP); i--){
          var r = e.log[i];
          h += '<div class="sim-log-i ' + (r.ok?"ok":"fail") + '"><span class="sim-log-n">' + r.n +
               '</span><span class="sim-log-t">' + esc(r.ok?tx("ok"):tx("fail")) +
               '</span><span class="sim-log-d">+' + r.lv + '　' +
               (r.b != null && r.p > r.b ? r.b.toFixed(1) + '% → ' : '') + r.p.toFixed(1) + '%' +
               (r.note ? '　' + esc(r.note) : '') + '</span></div>';
        }
        h += '</div>';
      }
      /* ⚠ 只列**危险等级**（武器 +7 起 / 防具 +5 起）—— 安全段必定成功，无参考价值。
         「成功率」列 = 基础 → 叠加后的实际值，括号里是本级出现过的最大叠加层数。 */
      var lv, rows = "";
      for(lv = ENH.safeMax[cat] + 1; lv <= ENH.maxEnhance; lv++){
        if(!e.levelN[lv]) continue;
        var b0 = baseRate(cat, lv);
        /* ⚠ 两套独立记录：普通卷 stkMax/pMax、保护卷 stkPMax/pPMax。
           本级用过保护卷就显示保护卷那一套（基础率不同，混在一起看不出问题）。 */
        var mxP = (e.stkPMax && e.stkPMax[lv]) || 0;
        var mx  = (e.stkMax && e.stkMax[lv]) || 0;
        var useProtRow = mxP > 0;
        var hi  = useProtRow ? e.pPMax[lv] : ((e.pMax && e.pMax[lv]) || b0);
        if(!useProtRow && mx === 0 && mxP === 0) hi = b0;
        var bN = useProtRow
               ? (protLevel(cat, lv) ? protLevel(cat, lv).rate : b0)   /* 保护卷基础率 */
               : effBase(cat, lv, S.dbl, false);                       /* 普通卷基础率（含双倍） */
        var mxUse = useProtRow ? mxP : mx;

  /* 移到 body 下并按按钮位置定位（fixed），避免被滚动容器裁剪 */
  function placeSelList(btn, L){
    if(L.parentNode !== document.body) document.body.appendChild(L);
    var q = btn.getBoundingClientRect();
    var w = Math.max(q.width, 220);
    var left = Math.min(Math.max(8, q.left), window.innerWidth - w - 8);
    /* ⚠⚠ 可用高度 = 视口减去锚点下方再留 8px 边距；下方不够就翻到锚点上方（上方空间 = q.top - 8）。

          跟下方可用空间无关 —— 表现为「明明下方还有一大片空白，列表却只有 360px」。

    var LIST_MAX = 620;
    var below = window.innerHeight - q.bottom - 8;

    if(below >= Math.min(200, above) || below >= above){

      h = Math.min(LIST_MAX, above); top = Math.max(8, q.top - h - 3);

    L.style.top = top + "px";

      e.cur++; e.scrolls++; e.tries++; e.ok++;
      e.levelN[e.cur] = (e.levelN[e.cur]||0) + 1;
      e.stk[e.cur] = 0; e.stkP[e.cur] = 0;      /* 该等级成功 -> 两套层数各自清零（不是清空整表） */
      guard++;
    }
    /* ⚠⚠ 必须清掉批量聚合 `S.agg`（用户 2026-10-06 报的 bug）。
       render() 是 `var e = S.agg || S.enh;` —— **批量结果优先级更高**。
       点过「批量模拟」后 S.agg 一直挂着，此时再点「一键强化」，
       S.enh 明明已经更新（cur/scrolls/log 都对），界面却仍渲染旧的批量聚合：
       卷轴格停在批量值、日志还是批量那一遍的 —— 表现为「结果框不跟新」。
       ⚠ 只清 S.agg，**不要清 S.enh**（那是本次一键强化的结果，要显示）。 */
    simDropAgg();
    S.enh = e; render();
  };
  window.simOnce = function(){
    if(!S.item) return;
    var isNew = !S.enh;
    var e = S.enh || newEnhState(S.item, S.cat);
    if(isNew){
      /* ⚠ 新建 state 时 cur 必须跟随「起始强化度」，否则用户把 from 调到 +10
         点一次强化，实际还在从 +6（newEnhState 默认值）往上走，看着像数值不动。 */
      e.cur = S.from;
      /* ⚠⚠ 只在「界面已失败次数 > 0」时播种。
         seedStk() 会把 stk 整表重置成 n0 —— 若界面「已失败」是 0，它就把玩家
         已经攒下的祝福层数**清空**，表现为「一键强化后再点强化1次不叠加概率」。
         所以 n0 为 0 时必须保留既有 stk，不能让它当默认值覆盖。 */
      if((S.stack || 0) > 0) seedStk(e);
    }
    e.target = Math.max(S.to, e.cur + 1);
    if(e.cur >= e.target){ e.target = e.cur + 1; }
    if(!e.broken) stepEnhance(e, {dbl:S.dbl, holy:S.holy});
    /* ⚠⚠ 同 simQuick：必须清掉批量聚合，否则 render() 的 `S.agg || S.enh`
       会继续渲染上一次批量模拟的结果，「强化 1 次」的最新日志看不见。 */
    simDropAgg();
    S.enh = e; render();
  };
  /* ⚠⚠ 批量强化次数 = `S.runs`（2026-10-06 恢复次数输入框，玩家自填，默认 1，上限 10000）。
     下方取各遍平均值；上限 10000，避免极端情况下把主线程卡死。 */
  window.simBatch = function(){
    if(!S.item) return;
    /* ⚠⚠⚠ 高目标确认（用户 2026-10-05）。
       失败会归零 -> 每级都要重爬 -> 卷轴需求**指数级**增长，实测单轮耗时：
         +11 ≈ 19 万张 / 0.2 秒     +12 ≈ 90~260 万张 / 0.4~1 秒
         +13 ≈ 540 万张 / 4 秒       +14 → 撞 5000 万护栏 / **约 188 秒（页面完全假死）**
       所以 ≥ +14 必须先确认，否则玩家一点就以为页面崩了。
       ⚠ 阈值别下调：+13 只需 4 秒还能忍，+14 才是灾难。 */
    if(S.to >= 14){
      /* ⚠ 必须用 fmt() 不是 tx() —— tx() **不做 %s 替换**，会直接把「%s」显示给用户。 */
      if(!confirm(fmt("slowConfirm", S.to))) return;
    }
    var e = newEnhState(S.item, S.cat);
    e.target = S.to; e.cur = S.from; seedStk(e);
    /* ⚠ 次数读 S.runs（次数输入框已恢复，2026-10-06）：玩家填 1~5000，每遍独立模拟一次，下方取平均值。
       ⚠ CPU 耗时随 n 线性增长；n 过大会明显卡住（主线程阻塞、页面无响应），故 Math.min 上限 5000。 */
    var n = Math.min(5000, Math.max(1, S.runs || 1));
    /* ⚠ reached / guardHit：**这一轮真的跑到目标了吗**。
       旧代码 `agg.cur = S.to` 无条件写死 → 护栏一拦也照样显示「已达 +12」，
       玩家以为成功了，其实那一轮早在 100000 次就中断了（KPI 卷轴恒显 100000 就是这么来的）。 */
    var agg = {scrolls:0, ok:0, fail:0, stone:0, repairs:0, holy:0, prot:0, levelN:{},
               stkMax:{}, pMax:{}, stkPMax:{}, pPMax:{}, protBy:{}, log:[],
               reached:0, guardHit:0, actualCur:0};
    /* ⚠ 批量每轮是**独立一次模拟**，所以保护卷要「每轮重新备好」——
       不能共用同一份会被扣减的 S.protAt，否则第一轮用完后面 199 轮都没保护卷。 */
    var protBase = {};
    for(var pk in S.protAt){ if(S.protAt[pk] > 0) protBase[pk] = S.protAt[pk]; }
    for(var i=0;i<n;i++){
      e = newEnhState(S.item, S.cat);
      e.target = S.to; e.cur = S.from; seedStk(e);
      S.protAt = {}; for(var qk in protBase) S.protAt[qk] = protBase[qk];
      runEnhance(e, {dbl:S.dbl, holy:S.holy}, true);
      agg.scrolls += e.scrolls; agg.ok += e.ok; agg.fail += e.fail;
      agg.stone += e.stone; agg.repairs += e.repairs; agg.holy += e.holy; agg.prot += e.prot;
      for(var lv in e.levelN) agg.levelN[lv] = (agg.levelN[lv]||0) + e.levelN[lv];
      for(var mk in e.stkMax) agg.stkMax[mk] = Math.max(agg.stkMax[mk]||0, e.stkMax[mk]);
      for(var pkey in e.pMax) agg.pMax[pkey] = Math.max(agg.pMax[pkey]||0, e.pMax[pkey]);
      for(var mk2 in e.stkPMax) agg.stkPMax[mk2] = Math.max(agg.stkPMax[mk2]||0, e.stkPMax[mk2]);
      for(var pk2 in e.pPMax) agg.pPMax[pk2] = Math.max(agg.pPMax[pk2]||0, e.pPMax[pk2]);
      for(var pb in e.protBy) agg.protBy[pb] = (agg.protBy[pb]||0) + e.protBy[pb];
      /* ⚠ 如实统计：本轮是否真的到达目标、护栏是否被触发、结束时实际在几级 */
      if(e.cur >= e.target) agg.reached++;
      if(e.guardHit) agg.guardHit++;
      agg.actualCur += e.cur;
      if(i === n-1) agg.log = e.log;
    }
    /* 批量跑完把玩家自己那份保护卷余量还回去（批量是「试算」，不该消耗玩家的卷） */
    S.protAt = {}; for(var rk in protBase) S.protAt[rk] = protBase[rk];
    agg.scrolls = Math.round(agg.scrolls / n); agg.ok = Math.round(agg.ok / n);
    agg.fail = Math.round(agg.fail / n); agg.stone = Math.round(agg.stone / n);
    agg.repairs = Math.round(agg.repairs / n); agg.holy = Math.round(agg.holy / n);
    agg.actualCur = Math.round(agg.actualCur / n);
    for(var lv2 in agg.levelN) agg.levelN[lv2] = Math.round(agg.levelN[lv2] / n);
    /* ⚠⚠ `agg.cur = S.to` 是**说谎**：护栏触发时那一轮根本没到目标（见上）。
       现在 cur = 实际到达等级；达标率与「未达标」标记另存，UI 用来如实提示。 */
    agg.item = S.item; agg.cat = S.cat; agg.cur = agg.actualCur;
    agg.target = S.to; agg.tries = agg.ok + agg.fail;
    agg.guardHit = agg.guardHit > 0;
    /* ⚠⚠ 聚合结果**不能塞进 S.enh**（旧 bug：批量后所有按钮失效）。
       S.enh 是「单次模拟」的状态，必须保有 stk/stkP/stkMax/... 全部字段；
       而 agg 是**各遍平均值**的只读汇总，字段结构不同（无 stk/stkP、无 broken/target），
       塞进去会让 stepEnhance 读 `st.stkP[t]` 抛 TypeError → 强化/保护卷/一键全失效。
       现在挂到独立的 S.agg，只用于渲染 KPI 与目标表。 */
    S.agg = agg; render();
  };
  window.simRepair = function(){
    var e = S.enh;
    if(!e || !e.broken || !S.item) return;
    var c = repairCost(S.item, S.cat);
    var rl = restoreRoll(S.cat);
    e.stone += c; e.repairs++; e.broken = false; e.cur = rl;
    e.log.push({n:e.tries, lv:rl, p:0, ok:false, isRepair:true,
                note:fmt("repairBack", c, rl), after:rl});
    /* ⚠⚠ 同上：清掉批量聚合，否则 render() 的 `S.agg || S.enh` 会继续渲染
       上一次批量模拟的结果，修理这条新日志看不见。 */
    simDropAgg();
    render();
  };
  window.simWay = function(w){ S.rWay = w; render(); };
  window.simResetOnce = function(){
    if(!S.item) return;
    var rd = resetData(S.item); if(!rd) return;
    var roll = resetRoll(rd);
    S.rTimes = 0; S.rSum = null;
    S.rCounts = S.rCounts || {};
    roll.forEach(function(r){
      S.rCounts[r.key] = S.rCounts[r.key] || {};
      S.rCounts[r.key][r.val] = (S.rCounts[r.key][r.val]||0) + 1;
    });
    /* 二选一：只累计当前选中的那种 */
    if(S.rWay === "book") S.rBooks += resetCostBy(S.item, "book");
    else S.rStones += resetCostBy(S.item, "stone");
    S.rLast = roll; S.rOne = 1; render();
  };
  window.simResetBatch = function(){
    if(!S.item) return;
    var rd = resetData(S.item); if(!rd) return;
    var n = Math.min(2000, Math.max(1, S.runs || 1));
    S.rCounts = {}; S.rSum = {}; S.rLast = null;
    for(var i=0;i<n;i++){
      resetRoll(rd).forEach(function(r){
        S.rCounts[r.key] = S.rCounts[r.key] || {};
        S.rCounts[r.key][r.val] = (S.rCounts[r.key][r.val]||0) + 1;
        S.rSum[r.key] = (S.rSum[r.key]||0) + (+r.val || 0);
      });
    }
    S.rTimes = n;
    /* 二选一：只累计当前选中的那种 */
    if(S.rWay === "book") S.rBooks += resetCostBy(S.item, "book") * n;
    else S.rStones += resetCostBy(S.item, "stone") * n;
    render();
  };

  /* 切语言时重渲染 */
  function simChrome(){
    var e = document.getElementById("simEntryBtn");
    if(e) e.textContent = tx("open");
    var w = document.getElementById("simTabWeapon"), a = document.getElementById("simTabArmor");
    if(w){ w.textContent = tx("tabW"); w.className = "sim-tab" + (S.cat==="weapon" ? " active" : ""); }
    if(a){ a.textContent = tx("tabA"); a.className = "sim-tab" + (S.cat==="armor" ? " active" : ""); }
    var c = document.querySelector("#simModal .modal-close");
    if(c) c.textContent = tx("close");
  }
  window.simChrome = simChrome;
  if(typeof updateLangText === "function"){
    var _o = updateLangText;
    updateLangText = function(){
      var r = _o.apply(this, arguments);
      simChrome();
      if(document.getElementById("simModal").style.display === "flex") render();
      return r;
    };
  }
})();
</script>
</body>
