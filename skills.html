<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>技能图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",system-ui,sans-serif}
body{background:#f0f2f5;padding:12px}

.top-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;

  position:sticky;
  top:0;
  z-index:100;

  background:#f0f2f5;
  padding:6px 0;
}

.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}
.lang-btn,.page-btn,.type-btn{
  padding:8px;border:1px solid #ccc;background:#fff;border-radius:8px;white-space:nowrap;font-size:16px
}
.type-btn.active{ background:#718ACC;color:#fff;border-color:#718ACC }
.page-btn{margin:0 4px}

/* 职业分类栏 */
#classBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.pagination{text-align:center;margin:8px 0}

.equip-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
@media(min-width:768px) and (max-width:1023px){
  .equip-grid{ grid-template-columns:repeat(3,1fr);gap:14px; }
}
@media(min-width:1024px){
  .equip-grid{ grid-template-columns:repeat(4,1fr);gap:18px; }
}

.equip-card{
  background:#D9E3EC;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);overflow:hidden;
  display:flex;flex-direction:column;padding:4px;gap:4px;border:1px solid #94A6BE;
}
.equip-name{
  text-align:center;font-weight:bold;font-size:18px;
  padding:4px 4px;
  border-top:2px solid #b9cad6;border-bottom:2px solid #b9cad6;
  background:linear-gradient(100deg,#c1ceda,#E7F7FF,#c1ceda);
  border-radius:8px;
  line-height:1.2;
}
@media(min-width:1024px){ .equip-name{ font-size:20px;padding:6px 4px } }

.equip-info-row{display:flex;padding:4px;gap:4px;align-items:center}
.equip-icon-col{ width:30%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px }
.equip-text-col{width:70%;display:flex;flex-direction:column;gap:4px}

.hex-icon{ width:56px;height:56px;display:flex;align-items:center;justify-content:center; clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%); background:linear-gradient(145deg,#6085ac,#2f4666);position:relative;overflow:hidden; }
.hex-icon::before{ content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0.5),rgba(255,255,255,0) 40%); }
.hex-icon::after{ content:"";position:absolute;inset:0;box-shadow:inset 0 0 15px rgba(255,255,255,0.35),inset 0 0 25px rgba(255,255,255,0.15); }
.hex-icon .star{ position:absolute;width:8px;height:8px;z-index:1; }
.hex-icon .star::before{ content:"";position:absolute;width:100%;height:2px;top:50%;left:0;transform:translateY(-50%);background:linear-gradient(to right,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star::after{ content:"";position:absolute;width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star1{ top:18%;left:15%; }
.hex-icon .star2{ bottom:18%;right:15%; }
.hex-icon img{width:34px;height:34px;object-fit:contain}
@media(min-width:1024px){ .hex-icon{width:68px;height:68px} .hex-icon img{width:42px;height:42px} }

/* 技能卡：圆形图标框（与技能图标同尺寸，去掉星星） */
.skill-card .hex-icon{ width:44px;height:44px;border-radius:50%;clip-path:none; }
.skill-card .hex-icon .star{ display:none; }
.skill-card .hex-icon img{ width:44px;height:44px; }
@media(min-width:1024px){
  .skill-card .hex-icon{ width:56px;height:56px; }
  .skill-card .hex-icon img{ width:56px;height:56px; }
}

.tag-rarity{ padding:3px 6px;border-radius:8px;color:#D6E5DC;font-size:13px;width:fit-content }
.skill-type.active{ background:#328300 }
.skill-type.passive{ background:#0068A9 }

/* 技能卡：信息行顶部对齐（无等级占位） */
.skill-card .equip-info-row{ align-items:flex-start }
/* 需求等级（金黄，不换行；窄屏缩小字号防溢出） */
.skill-learn{ font-size:13px;font-weight:bold;color:#C9A227;line-height:1.2;white-space:nowrap }
@media(max-width:420px){ .skill-learn{ font-size:12px } }
/* 第二行：主动/被动 + 水晶消耗 */
.skill-row2{ display:flex;align-items:center;gap:6px;flex-wrap:wrap }
.skill-row2 .skill-crystal{ margin-left:auto }
.skill-crystal{ display:inline-flex;align-items:center;gap:3px;font-size:13px;color:#3D4E68 }
.skill-crystal img{ width:12px;height:20px;object-fit:contain }

/* 技能效果框（全宽） */
.skill-effect{
  background:#EEF3F9;border-radius:8px;padding:6px 8px;margin-top:4px;
  font-size:15px;color:#333;line-height:1.5;text-align:left;min-height:38px;
  white-space:pre-line;
}
/* 备注行（寒气/闪电等，金黄） */
.skill-notes{ color:#C9A227;margin-top:2px }

/* 属性框：各级加成（全绿 + 斑马线） */
.equip-stats{ background:#C6D4E4;padding:6px 8px;border-radius:8px;margin-top:4px }
.skill-level-row{ display:flex;align-items:center;gap:6px;font-size:15px;line-height:1.6;text-align:left;padding:2px 8px;margin:0 -8px;border-radius:4px }
@media(min-width:1024px){ .skill-effect{ font-size:17px } .skill-level-row{ font-size:17px } }
.skill-level-row:nth-child(even){ background:#BCCBDE }
.skill-lv{ font-weight:bold;color:#2E7D32;flex:0 0 auto }
.skill-bonus{ color:#2E7D32;flex:1 }

/* 卡片底部操作行 */
.card-actions{ display:flex;gap:6px;margin-top:auto }
.card-actions .btn-source{ flex:1;width:auto;margin:0;padding:7px 2px;font-size:14px }
.btn-source{ width:60%;margin:0 auto;padding:8px;margin-top:auto;background:#718ACC;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;display:block }
.btn-source.disabled{ background:#9AA7BC;cursor:default }
@media(min-width:1024px){ .card-actions .btn-source{padding:10px 6px;font-size:16px} }

.modal-backdrop{ position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999 }
.modal-content{ background:#fff;width:80%;max-width:380px;padding:20px;border-radius:16px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.3) }
.modal-title{font-size:18px;font-weight:bold;margin-bottom:12px;color:#333}
/* 弹窗标题文字色：与对应按钮色协调（同色系加深，白底清晰易读、不刺眼） */
#modalTitle{ color:#355E9C }                                   /* 获取途径：蓝 */
#rateModalTitle,#probModalTitle{ color:#2C7267 }                /* 获得概率：青绿 */
#relicModalTitle{ color:#4E7A3C }                               /* 文物概率：深绿 */
.modal-desc{font-size:15px;color:#3D4E68;line-height:1.6;margin-bottom:16px;min-height:60px;}
.modal-close{padding:7px 16px;background:#5c6bc0;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

/* 获取途径弹窗：内容超高时内部滚动 */
.modal-content.source-modal{ max-height:60%;display:flex;flex-direction:column }
.modal-content.source-modal .modal-title{ flex-shrink:0 }
.modal-content.source-modal .modal-desc{ flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain }
.modal-content.source-modal .modal-close{ align-self:center;flex-shrink:0 }

/* 获取途径：行内格式「名称：怪物/怪物」+ 斑马纹 */
.modal-desc .source-row{
  display:block;padding:6px 8px;margin:0;border-radius:0;
  background:none;cursor:default;text-align:center;   /* 获取途径正文居中 */
}
.modal-desc .source-row:nth-child(even){ background:#f7f9fc }
.source-name{ font-weight:bold;color:#3D4E68 }
.source-src{ color:#666 }
.src-monster{ color:#3774AE;cursor:pointer;text-decoration:underline }
.src-item{ color:#3774AE;cursor:pointer;text-decoration:underline }
.src-sep{ color:#999;margin:0 3px }
.src-text{ color:#666 }
/* 语言下拉框：原生箭头无法调整位置，改为自定义箭头并往左收一些 */

/* 语言切换：自定义点击下拉（PC/手机一致，替代原生 select） */
.lang-dd{position:relative;display:inline-block;vertical-align:middle}
.lang-dd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:104px;padding:8px 12px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:15px;line-height:1;color:#3D4E68;white-space:nowrap;cursor:pointer;font-family:inherit}
.lang-dd-btn:hover{border-color:#94A6BE;background:#F7FAFD}
.lang-dd.open .lang-dd-btn{border-color:#94A6BE;background:#F7FAFD}
.lang-dd-caret{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid #4D5A75;transition:transform .15s}
.lang-dd.open .lang-dd-caret{transform:rotate(180deg)}
.lang-dd-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:100%;background:#fff;border:1px solid #B9C4D4;border-radius:8px;box-shadow:0 8px 22px rgba(34,44,62,.18);padding:4px;z-index:300}
.lang-dd.open .lang-dd-menu{display:block}
.lang-dd-item{padding:8px 14px;border-radius:6px;font-size:15px;line-height:1.2;color:#3D4E68;white-space:nowrap;text-align:center;cursor:pointer}
.lang-dd-item:hover{background:#EAF1F8}
.lang-dd-item.active{background:#EDF0F4;font-weight:600}
</style>
</head>

<body>
<div class="top-bar">
  <input class="search-box" placeholder="搜索技能名/效果..." id="searchBox">
  <span class="lang-dd" id="langSelect"></span>
</div>
<button class="type-btn" onclick="location.href='index.html'" data-nav="monster">怪物图鉴</button>
<button class="type-btn" onclick="location.href='equip.html'" data-nav="equip">装备图鉴</button>
<button class="type-btn" onclick="location.href='items.html'" data-nav="item">物品图鉴</button>
<button class="type-btn active" onclick="location.href='skills.html'" data-nav="skill">技能图鉴</button>
<button class="type-btn" onclick="location.href='gem.html'" data-nav="gem">宝石图鉴</button>
<button class="type-btn" onclick="location.href='pet.html'" data-nav="pet">宠物图鉴</button>
<button class="type-btn" onclick="location.href='costume.html'" data-nav="costume">时装图鉴</button>
<button class="type-btn" onclick="location.href='collection.html'" data-nav="collection">图鉴任务</button>
<div class="top-bar" id="classBar">
  <button class="type-btn active" data-class="all">全部</button>
  <button class="type-btn" data-class="warrior">战士</button>
  <button class="type-btn" data-class="ranger">游侠</button>
  <button class="type-btn" data-class="magician">法师</button>
  <button class="type-btn" data-class="breaker">武术家</button>
</div>
<div class="pagination" id="topPagination">
  <button class="page-btn" id="firstTop">首页</button>
  <button class="page-btn" id="prevTop">上一页</button>
  <span class="page-jump" id="pageJumpTop"><span id="pageInfo">第 1 页</span><input class="page-jump-input" id="pageInputTop" type="number" min="1" step="1" inputmode="numeric"></span>
  <button class="page-btn" id="nextTop">下一页</button>
  <button class="page-btn" id="lastTop">尾页</button>
</div>
<div class="equip-grid" id="skillGrid">加载中...</div>
<div class="pagination" id="bottomPagination">
  <button class="page-btn" id="firstBot">首页</button>
  <button class="page-btn" id="prevBot">上一页</button>
  <span class="page-jump" id="pageJumpBot"><span id="pageInfoBot">第 1 页</span><input class="page-jump-input" id="pageInputBot" type="number" min="1" step="1" inputmode="numeric"></span>
  <button class="page-btn" id="nextBot">下一页</button>
  <button class="page-btn" id="lastBot">尾页</button>
</div>
<div class="modal-backdrop" id="modal">
  <div class="modal-content source-modal">
    <div class="modal-title" id="modalTitle">获取途径</div>
    <div class="modal-desc" id="modalText"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
/* ===== 语言工具（内联，不依赖额外 js 文件；语言对照数据在 lang.json） ===== */
var TWOM_LANG_OPTIONS=[["en","English"],["zh","中文"],["ja","日本語"],["ko","한국어"]];
var TWOM_UI2CODE={en:"en",zh:"cn",ja:"ja",ko:"kr"};
var TWOM_CODE2UI={en:"en",cn:"zh",ja:"ja",kr:"ko"};
var TWOM_NAV={},TWOM_TXTJA={};
function twomReadLang(){var v="";try{v=localStorage.getItem("twom-lang")||"";}catch(e){}return ({en:"en",cn:"cn",zh:"cn",ja:"ja",kr:"kr",ko:"kr"})[v]||"cn";}
function twomWriteLang(c){try{localStorage.setItem("twom-lang",TWOM_CODE2UI[c]||"zh");}catch(e){}}
function twomLocale(c){return c==="cn"?"zh-Hans":c==="ja"?"ja":c==="kr"?"ko":"en";}
function twomFillLangSelect(sel,lang,onPick){
  if(!sel) return;
  var cur = TWOM_CODE2UI[lang] || "zh";
  var curLabel = "中文";
  for(var i=0;i<TWOM_LANG_OPTIONS.length;i++){ if(TWOM_LANG_OPTIONS[i][0]===cur) curLabel=TWOM_LANG_OPTIONS[i][1]; }
  if(sel.classList) sel.classList.add("lang-dd");
  sel.innerHTML = '<button type="button" class="lang-dd-btn" aria-haspopup="listbox" aria-expanded="false">'
    + '<span class="lang-dd-cur">' + curLabel + '</span><span class="lang-dd-caret"></span></button>'
    + '<div class="lang-dd-menu" role="listbox">'
    + TWOM_LANG_OPTIONS.map(function(o){ return '<div class="lang-dd-item' + (o[0]===cur?' active':'') + '" role="option" data-code="' + o[0] + '">' + o[1] + '</div>'; }).join("")
    + '</div>';
  if(!sel.querySelector) return;   /* 无 DOM 环境（用例桩）跳过交互绑定 */
  var btn = sel.querySelector(".lang-dd-btn");
  var menu = sel.querySelector(".lang-dd-menu");
  if(!btn || !menu) return;
  var items = menu.querySelectorAll(".lang-dd-item");
  btn.onclick = function(ev){ if(ev&&ev.stopPropagation) ev.stopPropagation(); var on = sel.classList.toggle("open"); btn.setAttribute("aria-expanded", on?"true":"false"); };
  for(var j=0;j<items.length;j++){ (function(it){
    it.onclick = function(ev){
      if(ev&&ev.stopPropagation) ev.stopPropagation();
      for(var k=0;k<items.length;k++) items[k].classList.remove("active");
      it.classList.add("active");
      var curEl = sel.querySelector(".lang-dd-cur"); if(curEl) curEl.innerText = it.innerText;
      sel.classList.remove("open"); btn.setAttribute("aria-expanded","false");
      if(typeof onPick === "function") onPick(it.getAttribute("data-code"));
    };
  })(items[j]); }
  if(!twomFillLangSelect._outsideBound){
    twomFillLangSelect._outsideBound = 1;
    document.addEventListener("click", function(){
      var open = document.querySelectorAll(".lang-dd.open");
      for(var k=0;k<open.length;k++){ open[k].classList.remove("open"); var b=open[k].querySelector(".lang-dd-btn"); if(b) b.setAttribute("aria-expanded","false"); }
    });
  }
}
function twomApplyLangData(L){TWOM_NAV=(L&&L.nav)||{};TWOM_TXTJA=(L&&L.txtJa)||{};NPC_TEXT=(L&&L.npcText)||NPC_TEXT;twomUpdateNav();
  var S=(L&&L.skillsLang)||{};Object.assign(langConfig,S.langConfig||{});Object.assign(classLang,S.className||{});
}
function twomUpdateNav(lang){lang=lang||(typeof currentLang!=="undefined"?currentLang:"cn");document.querySelectorAll("[data-nav]").forEach(function(b){var o=TWOM_NAV[b.dataset.nav];if(o)b.innerText=o[lang]||o.cn||o.en;});}
function twomTxt(cn,lang){return lang==="ja"?(TWOM_TXTJA[cn]||cn):cn;}

/* ===== NPC_LOCALIZE_PATCH：NPC 名跟随语言 =====
   把文案里出现的官方 NPC 名（lang.json.npcText）换成当前语言的官方名。
   注意只吃 npcText 这个**子集**：官方 NPC 表里还有一批与物品/称号/怪物名撞车的词
   （Knight / Magic Stone / Forest / Pie / Guard …），整表替换会把 `Fallen Magic Stone`（物品）、
   `Jewel Knight`（称号）里的词一起换掉。子集由 work/scripts/build_npc_text.py 生成。 */
let NPC_TEXT = {};          /* ← lang.json 的 npcText */
let _npcRes = null;
function npcLocalize(text){
  const s = String(text == null ? '' : text);
  const ks = Object.keys(NPC_TEXT);
  if(!s || !ks.length) return s;
  if(!_npcRes){
    const sorted = ks.slice().sort(function(a, b){ return b.length - a.length; });
    _npcRes = new RegExp('\\b(' + sorted.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')\\b', 'g');
  }
  return s.replace(_npcRes, function(m){
    const v = NPC_TEXT[m] || {};
    return v[currentLang] || v.cn || v.en || m;
  });
}
function twomUi(L,k,lang,vars){var o=((L&&L.ui)||{})[k];var s=o?(o[lang]||o.cn||o.en||k):k;return String(s).replace(/\{(\w+)\}/g,function(_,n){return (vars&&vars[n]!=null)?vars[n]:"";});}
</script>
<script>
let currentLang = twomReadLang();
const langConfig = {};   /* ← lang.json 的 skillsLang.langConfig（页面不再自带文案） */;

const classLang = {};   /* ← lang.json 的 skillsLang.className（页面不再自带文案） */;
const classOrder = ["warrior","ranger","magician","breaker"];

// 导航按钮（改用公共库）
function updateNavLang(){ twomUpdateNav(currentLang); }

let page = 1;
let allSkills = [];
let filteredSkills = [];
let dropMap = {};
let nameMap = {};
let bookMonsters = {};
let itemCnIndex = {};
let currentClass = "all";

function getPerPage(){
  if(window.innerWidth >= 1024) return 20;
  if(window.innerWidth >= 768) return 15;
  return 12;
}

function tr(key, type){
  const o = langConfig[type]?.[key];
  return o?.[currentLang] || twomTxt(o?.cn, currentLang) || o?.cn || key;
}

function skillName(s){
  if(currentLang === "en") return s.en || s.cn || s.key;
  if(currentLang === "ja") return s.ja || s.en || s.cn || s.key;
  if(currentLang === "kr") return s.kr || s.en || s.cn || s.key;
  return s.cn || s.en || s.key;
}

// 中英双语字段取值（当前语言 → 中文 → 英文）
function pick(v){
  if(v == null) return "";
  if(typeof v === "string") return v.trim();
  return String(v[currentLang] || v.cn || v.en || "").trim();
}

function monsterDisplayName(en){
  const m = nameMap[en] || {};
  return m[currentLang] || m.cn || en;
}

// 来源文案中的怪物名 -> 可点击（faith/illust/billiard/sephia/whale）
const EXTRA_MONSTERS = [
  ["faith", "Faith"], ["illust", "Illust"], ["billiard", "Billiard"], ["sephia", "Sephia"], ["whale", "Platanista"]
];
function linkifySourceText(text){
  let out = text;
  EXTRA_MONSTERS.forEach(([alias, en])=>{
    const re = new RegExp("\\b" + alias + "\\b", "gi");
    const disp = monsterDisplayName(en);
    const cn = (nameMap[en] && nameMap[en].cn) || en;
    out = out.replace(re, `<span class="src-monster" onclick="goMonster('${disp.replace(/'/g,"\\'")}')">${disp}</span>`);
  });
  // 括号内兑换/合成材料 -> 物品图鉴（如 乌波水晶鳞片、名誉项链x60、百发百中1/2/3p）
  out = out.replace(/（([^）]+)）/g, (full, inner)=>{
    const parts = expandSkillMaterials(inner);
    if(!parts.some(p=>p.en)) return full;
    const html = parts.map(p=>{
      if(p.sep) return p.sep;
      const name = p.en
        ? `<span class="src-item" onclick="goItem('${itemDisplayName(p.en).replace(/'/g,"\\'")}')">${itemDisplayName(p.en)}</span>`
        : p.base;
      return name + p.suffix;
    }).join("");
    return "（" + html + "）";
  });
  return out.replace(/\n/g, " ");
}

// 括号内材料：「名称1/2/3p」展开；普通内容按换行或 / 拆分并保留原数量
function expandSkillMaterials(text){
  const s = String(text);
  const m = s.match(/^(.+?)(\d+)\/(\d+)\/(\d+)(p?)$/);
  if(m){
    return [m[1] + m[2] + m[5], m[1] + m[3] + m[5], m[1] + m[4] + m[5]]
      .map((n, i)=>({ base: n, suffix: "", sep: i ? "/" : "", en: itemCnIndex[n] || null }));
  }
  const out = [];
  s.split(/([\n/+＋])/).forEach(tk=>{
    if(tk === "/"){ out.push({ sep: "/" }); return; }
    if(tk === "\n" || tk === "+" || tk === "＋"){ out.push({ sep: " + " }); return; }
    if(!tk) return;
    const q = tk.match(/^(.*?)(\s*[xX×]\s*\d+)\s*$/);
    const base = (q ? q[1] : tk).trim();
    const suffix = q ? q[2] : "";
    out.push({ base: base, suffix: suffix, sep: "", en: itemCnIndex[base] || null });
  });
  return out;
}

function itemDisplayName(en){
  const m = dropMap[en] || {};
  if(currentLang === "en") return m.en || en;
  if(currentLang === "ja") return m.ja || m.en || en;
  if(currentLang === "kr") return m.kr || m.en || en;
  return m.cn || en;
}

/* 跳转助手：把「英文键或任意语言的名字」解析成当前语言的显示名，找不到就原样返回 */
function locKeyOf(map, v){
  const s = String(v == null ? '' : v).trim();
  if(!s || !map) return null;
  if(map[s]) return s;
  const low = s.toLowerCase();
  const ks = Object.keys(map);
  for(let i = 0; i < ks.length; i++){
    const o = map[ks[i]] || {};
    const cand = [ks[i], o.cn, o.en, o.ja, o.kr];
    for(let j = 0; j < cand.length; j++){
      if(String(cand[j] || '').toLowerCase() === low) return ks[i];
    }
  }
  return null;
}

/* 跳转统一传「当前语言的名称」 */
function goItem(name){
  const k = locKeyOf(dropMap, name);
  location.href = `items.html?item=${encodeURIComponent(k ? itemDisplayName(k) : name)}`;
}

// 排序：职业（战士→游侠→法师→武术家）→ 学习等级升序 → 名称
function sortSkills(){
  const coll = new Intl.Collator(twomLocale(currentLang));
  const classRank = (c)=>{
    const i = classOrder.indexOf(c);
    return i === -1 ? 99 : i;
  };
  allSkills.sort((a,b)=>{
    const ca = classRank(a.class), cb = classRank(b.class);
    if(ca !== cb) return ca - cb;
    const la = parseInt(a.learnLevel, 10), lb = parseInt(b.learnLevel, 10);
    const va = isNaN(la) ? Infinity : la;
    const vb = isNaN(lb) ? Infinity : lb;
    if(va !== vb) return va - vb;
    return coll.compare(skillName(a), skillName(b)) || a.key.localeCompare(b.key);
  });
}

function updateLangText(){
  document.getElementById('searchBox').placeholder = langConfig.searchPlaceholder[currentLang];
  document.getElementById('prevTop').innerText = document.getElementById('prevBot').innerText = tr('prev','btnText');
  document.getElementById('nextTop').innerText = document.getElementById('nextBot').innerText = tr('next','btnText');
  document.getElementById('modalTitle').innerText = tr('modalTitle','btnText');
  document.querySelector('.modal-close').innerText = tr('close','btnText');
  updateClassButtonsLang();
  updateNavLang();
}

function updateClassButtonsLang(){
  document.querySelectorAll('#classBar .type-btn').forEach(btn=>{
    const c = btn.dataset.class;
    if(classLang[c]) btn.innerText = classLang[c][currentLang];
  });
}

function updatePageInfo(){
  const total = Math.ceil(filteredSkills.length / getPerPage());
  const s = langConfig.pageText[currentLang].replace("{now}",page).replace("{total}",total||1);
  document.getElementById('pageInfo').innerText = document.getElementById('pageInfoBot').innerText = s;
}

function toggleLang(){
  currentLang = currentLang==="cn" ? "en" : currentLang==="en" ? "kr" : "cn";
  try{ localStorage.setItem("twom-lang", currentLang); }catch(e){}
  updateLangText();
  sortSkills();
  filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim(), true);
}

function doSearch(){ filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim()); }

function searchable(s){
  const lv = (s.learnLevel === "" || s.learnLevel == null) ? "" : String(s.learnLevel);
  return [s.key, s.cn||"", s.en||"", s.ja||"", s.kr||"", lv, lv ? lv+"级" : "", lv ? "lv"+lv : ""].join(" ").toLowerCase();
}

function filterAndRender(keyword="", keepPage){
  let list = allSkills;
  if(currentClass !== "all") list = list.filter(x=>x.class === currentClass);
  if(keyword){
    list = list.filter(x=>searchable(x).includes(keyword));
  }
  filteredSkills = list;
  if(keepPage){
    const total = Math.ceil(filteredSkills.length / getPerPage());
    if(page > total) page = Math.max(1, total);
  } else {
    page = 1;
  }
  renderCards();
}

function setClass(c){
  currentClass = c;
  document.querySelectorAll('#classBar .type-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.class === c);
  });
  // 点分类按钮 = 重置搜索框（残留关键词会把新分类的结果筛空）
  const box = document.getElementById('searchBox');
  if(box) box.value = "";
  doSearch();
}

function goPrev(){ if(page>1){page--;renderCards();} }
function goNext(){
  const total = Math.ceil(filteredSkills.length/getPerPage());
  if(page<total){ page++; renderCards(); window.scrollTo(0,0); }
}

// 渲染卡片
function renderCards(){
  const grid = document.getElementById("skillGrid");
  grid.innerHTML = "";
  updatePageInfo();
  const perPage = getPerPage();
  const pageSkills = filteredSkills.slice((page-1)*perPage, page*perPage);
  if(!pageSkills.length){
    grid.innerHTML = `<div style='grid-column:1/-1;text-align:center;padding:20px'>${tr('noData','btnText')}</div>`;
    return;
  }
  pageSkills.forEach(s=>{
    const name = skillName(s);
    const typeText = (s.type === "active" || s.type === "passive") ? tr(s.type,'skillType') : "";
    const typeTag = typeText ? `<div class="tag-rarity skill-type ${s.type}">${typeText}</div>` : "";
    const learnHtml = (s.learnLevel !== "" && s.learnLevel != null)
      ? `<div class="skill-learn">${tr('reqLv','skillText')}${s.learnLevel}</div>` : "";
    /* 水晶消耗：仅在「正数」或「All」时显示；0 / 空 / 无消耗（如森林之眼）不显示 */
    const cNum = Number(s.crystal);
    const showCrystal = (s.crystal === "All") || (s.crystal !== "" && s.crystal != null && !isNaN(cNum) && cNum > 0);
    const crystalHtml = showCrystal
      ? `<span class="skill-crystal"><img src="skill_icons/Rage Crystal.png" alt="">${s.crystal === "All" ? tr('crystalAll','skillText') : s.crystal}</span>` : "";
    const row2 = (typeTag || crystalHtml) ? `<div class="skill-row2">${typeTag}${crystalHtml}</div>` : "";
    const effectText = pick(s.effect) || "—";
    const noteLines = (s.notes && (s.notes[currentLang] || s.notes.cn || s.notes.en)) || [];
    const notesHtml = noteLines.length ? `<div class="skill-notes">${noteLines.map(n=>`<div>${n}</div>`).join("")}</div>` : "";
    const levels = Object.keys(s.levels || {}).sort((a,b)=>Number(a)-Number(b));
    const levelsHtml = levels.length
      ? levels.map(lv=>{
          const bonus = pick((s.levels||{})[lv]) || "—";
          return `<div class="skill-level-row"><span class="skill-lv">Lv${lv}.</span><span class="skill-bonus">${bonus}</span></div>`;
        }).join("")
      : `<div class="skill-level-row"><span class="skill-bonus">—</span></div>`;
    const hasSource = Object.keys(s.books || {}).length > 0;
    const sourceBtn = hasSource
      ? `<button class="btn-source" onclick="openSourceModal('${s.key.replace(/'/g,"\\'")}')">${tr('source','btnText')}</button>`
      : `<button class="btn-source disabled" disabled>${tr('source','btnText')}</button>`;

    const card = document.createElement("div");
    card.className = "equip-card skill-card";
    card.dataset.key = s.key;
    card.dataset.cn = s.cn || "";
    card.dataset.en = s.en || "";
    card.innerHTML = `
      <div class="equip-name" style="color:#3D4E68">${name}</div>
      <div class="equip-info-row">
        <div class="equip-icon-col">
          <div class="hex-icon"><div class="star star1"></div><div class="star star2"></div><img loading="lazy" src="skill_icons/${s.en || s.key}.png" onerror="this.style.display='none'"></div>
        </div>
        <div class="equip-text-col">
          ${learnHtml}
          ${row2}
        </div>
      </div>
      <div class="skill-effect">${effectText}${notesHtml}</div>
      <div class="equip-stats">${levelsHtml}</div>
      <div class="card-actions">${sourceBtn}</div>
    `;
    grid.appendChild(card);
  });
}

// 获取途径弹窗（横向行：技能书名称+等级 | 来源，怪物可点击）
function openSourceModal(key){
  const s = allSkills.find(x=>x.key === key);
  if(!s) return;
  const bookKeys = Object.keys(s.books || {}).sort((a,b)=>Number(a)-Number(b));
  let rows = bookKeys.map(lv=>{
    const bookEn = s.books[lv];
    const bm = dropMap[bookEn] || {};
    const bookName = bm[currentLang] || bm.en || bm.cn || bookEn;
    const monsters = bookMonsters[bookEn] || [];
    const extraRaw = (s.extraSources && s.extraSources[lv]) ? s.extraSources[lv] : "";
    let extra = "";
    if(typeof extraRaw === "string") extra = extraRaw;
    else if(extraRaw) extra = pick(extraRaw);   // 四语跟随（ja/kr 缺失时回退 cn/en）
    let parts = monsters.map(mn=>{
      const disp = monsterDisplayName(mn);
      const cn = (nameMap[mn] && nameMap[mn].cn) || mn;
      return `<span class="src-monster" onclick="goMonster('${disp.replace(/'/g,"\\'")}')">${disp}</span>`;
    });
    if(extra) parts.push(`<span class="src-text">${linkifySourceText(npcLocalize(extra))}</span>`);
    const srcHtml = parts.length ? parts.join('<span class="src-sep">/</span>') : `<span class="src-text">—</span>`;
    const colon = currentLang === "cn" ? "：" : ": ";
    return `<div class="source-row"><span class="source-name">${bookName}</span><span class="source-src">${colon}${srcHtml}</span></div>`;
  }).join("");
  if(!rows){
    rows = `<div class="source-row"><span class="source-name">—</span><span class="source-src"><span class="src-text">—</span></span></div>`;
  }
  document.getElementById("modalTitle").innerText = tr('modalTitle','btnText') + " · " + skillName(s);
  document.getElementById("modalText").innerHTML = rows;
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalText").scrollTop = 0;
  lockPageScroll(true);
}
function goMonster(name){
  const k = locKeyOf(nameMap, name);
  location.href = `index.html?monster=${encodeURIComponent(k ? monsterDisplayName(k) : name)}`;
}
function closeModal(){
  document.getElementById("modal").style.display = "none";
  lockPageScroll(false);
}

// 弹窗打开时锁定页面滚动（含滚动条宽度补偿）
let pageScrollLocked = false;
function lockPageScroll(lock){
  if(lock === pageScrollLocked) return;
  pageScrollLocked = lock;
  if(lock){
    const sw = window.innerWidth - document.documentElement.clientWidth;
    const pr = parseFloat(getComputedStyle(document.body).paddingRight) || 0;
    document.body.style.overflow = "hidden";
    if(sw > 0) document.body.style.paddingRight = (pr + sw) + "px";
  } else {
    document.body.style.overflow = "";
    document.body.style.paddingRight = "";
  }
}

// 定位技能（接收参数 skill）
function jumpToSkillFromUrl(){
  const params = new URLSearchParams(location.search);
  const key = decodeURIComponent(params.get("skill") || "").toLowerCase().trim();
  if(!key) return;

  currentClass = "all";
  document.querySelectorAll('#classBar .type-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.class === "all");
  });

  const index = allSkills.findIndex(s=>{
    /* 强跳转：只认完全同名，不再子串模糊匹配 */
    const names = [s.key, s.cn, s.en, s.ja, s.kr].filter(Boolean).map(v=>String(v).toLowerCase().trim());
    return names.indexOf(key) >= 0;
  });

  if(index === -1){
    page = 1;
    renderCards();
    return;
  }

  page = Math.floor(index / getPerPage()) + 1;
  renderCards();

  setTimeout(() => {
    const cards = document.querySelectorAll(".skill-card");
    for(const card of cards){
      const stored = [card.dataset.key, card.dataset.cn, card.dataset.en].join(" ").toLowerCase().trim();
      if(stored.includes(key)){
        card.scrollIntoView({ behavior:"smooth", block:"center" });
        card.style.boxShadow = "0 0 20px gold";
        setTimeout(() => { card.style.boxShadow = ""; }, 2000);
        break;
      }
    }
  }, 300);
}

async function loadData(){
  let skillData = {}, lang = {}, drops = {};
  try {
    const [r1, r2, r3] = await Promise.all([
      fetch("skill_data.json"),
      fetch("lang.json"),
      fetch("monster_drops.json")
    ]);
    skillData = await r1.json();
    lang = await r2.json();
    drops = await r3.json();
  } catch(e) {
    console.log("load fail", e);
  }
  dropMap = lang.dropMap || {};
  nameMap = lang.nameMap || {};
  // 语言对照（lang.json：nav / ui / 技能 ja 名等）
  twomApplyLangData(lang);
  const sk = lang.skills || {};
  Object.keys(skillData).forEach(function(k){
    const s = skillData[k]; const x = sk[k] || (s.en && sk[s.en]);
    if(!x) return;
    if(x.ja && !s.ja) s.ja = x.ja;
    if(x.kr && !s.kr) s.kr = x.kr;
  });
  
  // 物品中文名索引（获取途径括号里的兑换/合成材料）
  itemCnIndex = {};
  for(const en in dropMap){
    const cn = ((dropMap[en] && dropMap[en].cn) || "").trim();
    if(cn.length < 2 || en === "-") continue;
    if(!itemCnIndex[cn]) itemCnIndex[cn] = en;
  }

  // 技能书 -> 掉落怪物
  Object.keys(drops).forEach(monster=>{
    const list = (drops[monster] && drops[monster].掉落物) || [];
    list.forEach(it=>{
      if(!bookMonsters[it]) bookMonsters[it] = [];
      bookMonsters[it].push(monster);
    });
  });

  allSkills = Object.keys(skillData).map(k=>({ key:k, ...skillData[k] }));
  sortSkills();
  filteredSkills = [...allSkills];
  document.getElementById('searchBox').value = "";

  updateLangText();

  if(location.search.includes('skill=')){
    jumpToSkillFromUrl();
  } else {
    renderCards();
  }
}

twomFillLangSelect(document.getElementById('langSelect'), currentLang, function(code){
  currentLang = TWOM_UI2CODE[code]; twomWriteLang(currentLang);
  updateLangText(); sortSkills(); filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim(), true);
});
document.getElementById('searchBox').addEventListener('input', doSearch);
document.getElementById('prevTop').onclick = goPrev;
document.getElementById('nextTop').onclick = goNext;
document.getElementById('prevBot').onclick = goPrev;
document.getElementById('nextBot').onclick = goNext;

/* 职业按钮 */
document.querySelectorAll('#classBar .type-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ setClass(btn.dataset.class); });
});

let resizeTimer;
let lastPerPage = getPerPage();

window.addEventListener('resize', () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {

    const perPage = getPerPage();
    if (perPage === lastPerPage) return;
    lastPerPage = perPage;
    renderCards();

  }, 150);

});
loadData();
</script>
<style>
/* ===== PAGE_NAV_PATCH：分页「首页/尾页 + 点击页码输入」 ===== */
/* PAGE_NAV_COMPACT_V5：桌面按钮仍为原尺寸(16px)，手机端只微收 1~2px，保证两位数页码仍在一排 */
.page-jump{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.page-jump:hover > span{text-decoration:underline}
.page-jump-input{display:none;width:66px;padding:6px 4px;border:1px solid #ccc;border-radius:8px;font-size:16px;text-align:center;font-family:inherit;-moz-appearance:textfield;appearance:textfield}
.page-jump-input::-webkit-outer-spin-button,.page-jump-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.page-jump.editing > span{display:none}
.page-btn:disabled{opacity:.45}
/* 分页栏改弹性单行：只为消除 HTML 空白造成的换行，不改按钮尺寸（尺寸仍用页面原有 .page-btn 规则）。
   gap:4px 是补回原先元素间空白所占的宽度，让桌面观感与改动前一致。 */

</style>
<script>
/* ===== PAGE_NAV_PATCH：首页 / 尾页 / 点击「第 x/y 页」输入页码（6 个图鉴页共用） =====
   在各页原有脚本之后运行，复用其 page / filteredXxx / getPerPage / renderCards 或 render / updatePageInfo。 */
(function(){
  var JUMP_LABEL = {
    cn:{first:"首页",last:"尾页",tip:"点击可输入页码"},
    en:{first:"First",last:"Last",tip:"Click to enter a page number"},
    ja:{first:"最初へ",last:"最後へ",tip:"クリックしてページ番号を入力"},
    kr:{first:"처음",last:"마지막",tip:"클릭하여 페이지 번호 입력"}
  };
  function langOf(){ return (typeof currentLang !== "undefined" && currentLang) ? currentLang : "cn"; }
  function lbl(){ return JUMP_LABEL[langOf()] || JUMP_LABEL.cn; }
  function listOf(){
    if(typeof filtered !== "undefined" && filtered) return filtered;
    if(typeof filteredItems !== "undefined" && filteredItems) return filteredItems;
    if(typeof filteredSkills !== "undefined" && filteredSkills) return filteredSkills;
    return [];
  }
  function totalPages(){ return Math.max(1, Math.ceil(listOf().length / getPerPage())); }
  function draw(){
    if(typeof renderCards === "function") return renderCards();
    if(typeof render === "function") return render();
  }
  function syncInfo(){ if(typeof updatePageInfo === "function") updatePageInfo(); }
  function goTo(n){
    var t = totalPages(), v = Math.min(Math.max(1, parseInt(n, 10) || 1), t);
    if(v === page){ syncInfo(); return; }
    page = v; draw(); syncInfo();
  }
  function refresh(){
    var t = totalPages(), L = lbl();
    [["Top","firstTop","lastTop"],["Bot","firstBot","lastBot"]].forEach(function(a){
      var f = document.getElementById(a[1]), l = document.getElementById(a[2]);
      if(f){ f.innerText = L.first; f.disabled = page <= 1; }
      if(l){ l.innerText = L.last;  l.disabled = page >= t; }
      var jw = document.getElementById("pageJump" + a[0]), inp = document.getElementById("pageInput" + a[0]);
      if(jw) jw.title = L.tip;
      if(inp){ inp.max = t; inp.title = L.tip; if(!jw || !jw.classList.contains("editing")) inp.value = page; }
    });
  }
  function cancelEdit(jw, inp){ jw.classList.remove("editing"); inp.value = page; inp.blur(); syncInfo(); }
  function commit(jw, inp){
    if(!jw.classList.contains("editing")) return;
    var v = parseInt(inp.value, 10);
    jw.classList.remove("editing");
    if(!isNaN(v)) goTo(v); else syncInfo();
  }
  function bindJump(sfx){
    var jw = document.getElementById("pageJump" + sfx), inp = document.getElementById("pageInput" + sfx);
    if(!jw || !inp) return;
    jw.onclick = function(ev){
      if(ev && ev.target === inp) return;
      if(jw.classList.contains("editing")) return;
      jw.classList.add("editing");
      inp.value = page;
      inp.focus(); try{ inp.select(); }catch(e){}
    };
    inp.onkeydown = function(e){
      var k = e.key || "";
      if(k === "Enter" || e.keyCode === 13){ e.preventDefault(); commit(jw, inp); inp.blur(); }
      else if(k === "Escape" || e.keyCode === 27){ e.preventDefault(); cancelEdit(jw, inp); }
    };
    inp.onblur = function(){ commit(jw, inp); };
  }
  function bindBtn(id, fn){
    var b = document.getElementById(id);
    if(!b) return;
    b.onclick = function(){ if(b.disabled) return; fn(); };
  }
  ["Top","Bot"].forEach(function(sfx){
    bindJump(sfx);
    bindBtn("first" + sfx, function(){ if(page > 1){ page = 1; draw(); syncInfo(); window.scrollTo(0,0); } });
    bindBtn("last" + sfx,  function(){ var t = totalPages(); if(page < t){ page = t; draw(); syncInfo(); window.scrollTo(0,0); } });
  });
  // 包一层 updatePageInfo：每次刷新（含切语言）都同步按钮文案 / 输入框上下限
  if(typeof updatePageInfo === "function"){
    var _orig = updatePageInfo;
    updatePageInfo = function(){ var r = _orig.apply(this, arguments); refresh(); return r; };
  }
  refresh();
})();
</script>
