<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>装备图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",system-ui,sans-serif}
body{background:#f0f2f5;padding:12px}

.top-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;

  position:sticky;
  top:0;
  z-index:100;

  background:#f0f2f5;
  padding:6px 0;
}

/* 搜索框自动撑满 */
.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

/* 翻译按钮固定不压缩 */
.lang-btn{
  flex-shrink:0;
}

/* 部位分类栏 */
#typeBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

/* 职业分类栏 */
#jobBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}
.lang-btn,.page-btn,.type-btn{
  padding:8px;border:1px solid #ccc;background:#fff;border-radius:8px;white-space:nowrap;font-size:16px
}
.type-btn.active{ background:#718ACC;color:#fff;border-color:#718ACC }
.page-btn{margin:0 4px}

.pagination{text-align:center;margin:8px 0}

.equip-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* 平板 */
@media(min-width:768px) and (max-width:1023px){
  .equip-grid{
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
}

/* PC */
@media(min-width:1024px){
  .equip-grid{
    grid-template-columns:repeat(4,1fr);
    gap:18px;
  }
}

.equip-card{
  background:#D9E3EC;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);overflow:hidden;
  display:flex;flex-direction:column;padding:4px;gap:4px;border: 1px solid #94A6BE;
}
.equip-name{
  text-align:center;font-weight:bold;font-size:18px;
  padding:4px 4px;
  border-top: 2px solid #b9cad6; border-bottom: 2px solid #b9cad6;
  background: linear-gradient(100deg, #c1ceda, #E7F7FF, #c1ceda);
  border-radius: 8px 8px 8px 8px;
  line-height:1.2;
}
@media(min-width:1024px){ .equip-name{ font-size:20px; padding:6px 4px; } }

.equip-info-row{display:flex;padding:4px;gap:4px;align-items:center}
.equip-icon-col{ width:30%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px }
.equip-text-col{width:70%;display:flex;flex-direction:column;gap:4px}

.hex-icon{ width:50px;height:50px;display:flex;align-items:center;justify-content:center; clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%); background:linear-gradient(145deg,#6085ac,#2f4666);position:relative;overflow:hidden; }
.hex-icon::before{ content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0.5),rgba(255,255,255,0) 40%); }
.hex-icon::after{ content:"";position:absolute;inset:0;box-shadow:inset 0 0 15px rgba(255,255,255,0.35),inset 0 0 25px rgba(255,255,255,0.15); }
.hex-icon .star{ position:absolute;width:8px;height:8px;z-index:1; }
.hex-icon .star::before{ content:"";position:absolute;width:100%;height:2px;top:50%;left:0;transform:translateY(-50%);background:linear-gradient(to right,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star::after{ content:"";position:absolute;width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star1{ top:18%;left:15%; }
.hex-icon .star2{ bottom:18%;right:15%; }
.hex-icon img{width:30px;height:30px;object-fit:contain}
@media(min-width:1024px){ .hex-icon{width:60px;height:60px} .hex-icon img{width:38px;height:38px} }

.tag-rarity{ padding:3px 6px;border-radius:8px;color:#D6E5DC;font-size:13px;width:fit-content }
.item-level{ font-size:17px;font-weight:bold;color:#3D67D4;text-align:center;line-height:1;margin-top:5px }
@media(min-width:1024px){.item-level{font-size:19px}}
.tag-job{ background:#D9E3EC;border-radius:6px;width:fit-content;padding:3px;display:flex;align-items:center;gap:1px;flex-wrap:wrap }
.equip-stats{ background:#C6D4E4;padding:8px 4px;border-radius:8px;margin-top:4px }
.stat-item{ font-size:15px;font-weight:bold;text-align:left;padding:2px 0 }
@media(min-width:1024px){.stat-item{font-size:17px}}
.btn-source{ width:60%;margin:0 auto;padding:8px;margin-top:auto;background:#718ACC;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;display:block }
.btn-source.disabled{ background:#9AA7BC;cursor:default }
@media(min-width:1024px){.btn-source{padding:10px;font-size:16px}}

/* 卡片底部操作行 */
.card-actions{ display:flex;gap:6px;margin-top:auto }
.card-actions .btn-source{ flex:1;width:auto;margin:0;padding:7px 2px;font-size:14px }
.btn-reset{ flex:1;padding:7px 2px;background:#4E9A8C;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px }
@media(min-width:1024px){ .card-actions .btn-source,.btn-reset{padding:10px 6px;font-size:16px} }

/* 重置概率弹窗（自适应大小，最大 80% × 60%） */
.modal-content.reset-modal{ width:fit-content;max-width:80%;height:auto;max-height:60%;display:flex;flex-direction:column;text-align:left }
.modal-content.reset-modal .modal-title{ flex-shrink:0 }
.modal-content.reset-modal .modal-close{ align-self:center;flex-shrink:0 }
.reset-body{ flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:4px 0 12px;padding-right:4px }
.reset-stats{ display:flex;flex-wrap:wrap;justify-content:center;gap:10px }
@media(min-width:768px){ .reset-stats{ flex-wrap:nowrap } }
.reset-stat{ flex:0 1 auto;width:240px;max-width:100%;background:#f5f7fa;border-radius:10px;padding:8px }
.reset-stat-name{ text-align:center;font-weight:bold;font-size:17px;color:#3D4E68;padding:2px 4px 0 }
.reset-stat-name::after{ content:"";display:block;width:32px;height:3px;background:#718ACC;border-radius:2px;margin:6px auto 8px }
.reset-table{ width:100%;border-collapse:collapse;font-size:14px;background:#fff }
.reset-table th{ background:#e0e7f3;color:#3D4E68;padding:5px 8px;font-weight:bold;text-align:center }
.reset-table td{ padding:4px 8px;border-top:1px solid #eef2f7;text-align:center }
.reset-table tbody tr:nth-child(even) td{ background:#f7f9fc }
.reset-table td.reset-val{ font-weight:bold;color:#3D4E68 }

.modal-backdrop{ position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999 }
.modal-content{ background:#fff;width:80%;max-width:380px;padding:20px;border-radius:16px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.3) }
.modal-title{font-size:18px;font-weight:bold;margin-bottom:12px;color:#333}
.modal-desc{font-size:15px;color:#3D4E68;line-height:1.6;margin-bottom:16px;min-height:60px;}
.modal-desc div{ padding:8px; border-radius:8px; cursor:pointer; margin:4px 0; background:#f5f7fa; }
.modal-desc div:hover{ background:#e0e7ff; }
.item-link{ color:#3774AE;text-decoration:underline;cursor:pointer }
.modal-close{padding:7px 16px;background:#5c6bc0;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

/* 获取途径弹窗：内容超高时内部滚动 */
.modal-content.source-modal{ max-height:60%;display:flex;flex-direction:column }
.modal-content.source-modal .modal-title{ flex-shrink:0 }
.modal-content.source-modal .modal-desc{ flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain }
.modal-content.source-modal .modal-close{ align-self:center;flex-shrink:0 }
</style>
</head>

<body>

function updateJobButtonsLang() {

  document.querySelectorAll('#jobBar .type-btn').forEach(btn => {

      btn.innerText = jobLangMap[job][currentLang];

}
function updateTypeButtonsLang() {

  document.querySelectorAll('#typeBar .type-btn').forEach(btn => {

    if(typeLangMap[type]) {
      btn.innerText = typeLangMap[type][currentLang];
    }

}
const langConfig = {
  searchPlaceholder:{cn:"搜索名称/属性...",en:"Search name/attr...",kr:"이름/속성 검색..."},

    noAttr:{cn:"无属性",en:"No attr",kr:"속성 없음"},
    reset:{cn:"重置概率",en:"Reset Rate",kr:"확률 초기화"},

  },
  attrName:{

    speed:{cn:"攻速",en:"SPEED",kr:""}, block:{cn:"阻挡",en:"block",kr:""},
    hp:{cn:"体力",en:"HP",kr:""}, mana:{cn:"魔力",en:"MANA",kr:""},
    hp_regen:{cn:"体力回复",en:"HP Regen",kr:""}, mana_regen:{cn:"魔力回复",en:"MANA Regen",kr:""},
    str:{cn:"力量",en:"STR",kr:""}, dex:{cn:"敏捷",en:"DEX",kr:""}, precision:{cn:"精密",en:"Precision",kr:""}, int:{cn:"智力",en:"INT",kr:""},

    ice_resist:{cn:"冰抗",en:"Ice Res",kr:""}, fire_resist:{cn:"火抗",en:"Fire Res",kr:""},
    lightning_Resist:{cn:"雷抗",en:"light Res",kr:""},magic_resist:{cn:"属性抗性",en:"Magic Res",kr:""},
    set2:{cn:"2件套",en:"2SET",kr:""}, set3:{cn:"3件套",en:"3SET",kr:""}
  },
  rarity:{ "一般":{cn:"一般",en:"Normal",kr:"일반"}, "高级":{cn:"高级",en:"Advanced",kr:"고급"}, "稀有":{cn:"稀有",en:"Rare",kr:"희귀"}, "英雄":{cn:"英雄",en:"Heroic",kr:"영웅"}, "传说":{cn:"传说",en:"Legendary",kr:"전설"} },

};

let allItems = [];
let filteredItems = [];

let cnToEnMap = {};

function getPerPage(){

  // PC
  if(window.innerWidth >= 1024){
    return 20;
  }

  // 平板
  if(window.innerWidth >= 768){
    return 15;
  }

  // 手机
  return 12;
}

  "mana_regen",

];

  "3力量 5%速": "3力量+5%速", "3敏捷 5%速": "3敏捷+5%速", "3智力 5%速": "3智力+5%速",
  "体力5 命中2": "体力5+命中2", "体力5 智力2": "体力5+智力2"
};
const SET_VALUE_EN = {
  "3力量+5%速": "3STR+5%Move", "3敏捷+5%速": "3DEX+5%Move", "3智力+5%速": "3INT+5%Move",
  "3力量 5%速": "3STR+5%Move", "3敏捷 5%速": "3DEX+5%Move", "3智力 5%速": "3INT+5%Move",
  "体力5 命中2": "HP5+Hit2", "体力5 智力2": "HP5+INT2"
};
function statValueText(k, v){
  const s = String(v).replace(/ to /g,"~");
  if(k === "set2" || k === "set3"){
    if(currentLang === "cn") return SET_VALUE_CN[s] || s;
    if(SET_VALUE_EN[s]) return SET_VALUE_EN[s];
    return s.replace(/体力/g,"HP").replace(/魔力/g,"MANA").replace(/力量/g,"STR")
            .replace(/敏捷/g,"DEX").replace(/智力/g,"INT").replace(/命中/g,"Hit")
            .replace(/暴击/g,"Cri").replace(/移动速度/g,"Move").replace(/移速/g,"Move").replace(/速/g,"Move");
  }
  return s;
}

  "稀有":{color:"#3774AE",bg:"#0068A9"}, "英雄":{color:"#733A9D",bg:"#69329B"},
  "传说":{color:"#E7696C",bg:"#E60000"}
};

// 导航按钮三语
const navLang = {
  monster: {cn:"怪物图鉴", en:"Monsters", kr:"몬스터 도감"},
  equip:   {cn:"装备图鉴", en:"Equipment", kr:"장비 도감"},

function updateNavLang(){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    const k = btn.dataset.nav;
    if(navLang[k]) btn.innerText = navLang[k][currentLang];
  });
}

function tr(key, type){
  const o = langConfig[type]?.[key];
  return o?.[currentLang] || o?.cn || key;
}

function updateLangText(){
  document.getElementById('searchBox').placeholder = langConfig.searchPlaceholder[currentLang];
  document.getElementById('prevTop').innerText = document.getElementById('prevBot').innerText = tr('prev','btnText');
  document.getElementById('nextTop').innerText = document.getElementById('nextBot').innerText = tr('next','btnText');
  document.getElementById('langBtn').innerText = {cn:"中文/EN/한국어",en:"CN/English/한국어",kr:"중국어/EN/한국어"}[currentLang];
  document.getElementById('modalTitle').innerText = tr('modalTitle','btnText');
  document.querySelector('.modal-close').innerText = tr('close','btnText');
  document.getElementById('resetModalClose').innerText = tr('close','btnText');
  updateNavLang();
}

function updatePageInfo(){
  const total = Math.ceil(filteredItems.length / getPerPage());
  const s = langConfig.pageText[currentLang].replace("{now}",page).replace("{total}",total||1);
  document.getElementById('pageInfo').innerText = document.getElementById('pageInfoBot').innerText = s;
}

function toggleLang(){
  currentLang = currentLang==="cn" ? "en" : currentLang==="en" ? "kr" : "cn";
  updateLangText();
  updateTypeButtonsLang();
  updateJobButtonsLang();
  renderCards();
}

function doSearch(){ filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim()); }

function filterAndRender(keyword=""){
  let list = allItems;
  if(currentType !== "all") list = list.filter(x=>x.type === currentType);

  if(currentJob !== "all"){

  list = list.filter(item => {

    let jobs = [];

    if(Array.isArray(item.job)){
      jobs = item.job;
    }
    else if(typeof item.job === "string"){
      jobs = item.job.split(",").map(x=>x.trim().toLowerCase());
    }

    return jobs.includes(currentJob);

  });

}

  if(keyword){
    list = list.filter(item=>{
      const name = (item.name_cn||item.name||"").toLowerCase();
      const nameEn = (item.name||"").toLowerCase();
      const nameKr = (item.name_kr||"").toLowerCase();
      let attrStr = "";

statKeys.forEach(k => {

  if(item[k] == null || item[k] === "") return;

  const value = String(item[k]).replace(/ to /g,"~");
  const valueAlt = statValueText(k, item[k]);

  // 属性翻译
  const cn = langConfig.attrName[k]?.cn || "";
  const en = langConfig.attrName[k]?.en || "";
  const kr = langConfig.attrName[k]?.kr || "";

 let alias = "";

if(k === "move") alias = "移速 speed movement";
if(k === "cri") alias = "暴率 crit critical";
if(k === "hp") alias = "血量 生命";
if(k === "mana") alias = "蓝量 魔力";
if(k === "attack") alias = "攻击 攻";
if(k === "armor") alias = "防御 防";
if(k === "hp_regen") alias = "回血 回复";
if(k === "mana_regen") alias = "回蓝";
if(k === "deadly") alias = "致命 致死";
if(k === "block") alias = "格挡";
if(k === "fire_resist") alias = "火";
if(k === "precision") alias = "精准";

  attrStr += `
    ${k}
    ${cn}
    ${en}
    ${kr}
    ${alias}
    ${value}
    ${valueAlt}
  `;

});
      const all = [name,nameEn,nameKr, String(item.level||""), attrStr].join(" ").toLowerCase();
      return all.includes(keyword);
    });
  }
  filteredItems = list;
  page = 1;
  renderCards();
}

function goPrev(){ if(page>1){page--;renderCards();} }
function goNext(){
  const total = Math.ceil(filteredItems.length/getPerPage());
  if(page<total){ page++; renderCards(); window.scrollTo(0,0); }
}

async function loadMyJson(){
  let items = [];
  for(const f of equipFiles){
    try {
      const res = await fetch(f.path);
      items.push(...await res.json());
    } catch(e) {
      console.log("load fail",f.path,e);
    }
  }

  // 加载重置概率数据
  try {
    const res = await fetch("equipment_data/option_reset.json");
    resetMap = await res.json();
  } catch(e) {
    console.log("load reset fail", e);
    resetMap = {};
  }

  // 加载语言数据（获取途径弹窗怪物名/材料名本地化）
  try {
    const res = await fetch("lang.json");
    const lang = await res.json();
    nameMap = lang.nameMap || {};
    dropMap = lang.dropMap || {};
  } catch(e) {
    console.log("load lang fail", e);
    nameMap = {};
    dropMap = {};
  }
  cnToEnMap = {};
  for(const en in nameMap){
    const v = nameMap[en];
    if(v && v.cn) cnToEnMap[v.cn] = en;
  }

  // 获取途径文案中的物品/装备名 -> 可点击（物品跳物品图鉴、装备跳装备图鉴）
  aliasIndex = {};
  equipIndex = {};
  for(const en in dropMap){
    const v = dropMap[en];
    const cn = ((v && v.cn) || "").trim();
    if(cn.length < 2 || !v.en || en === "-") continue;
    aliasIndex[cn] = { alias: cn, kind: "item", en: en };
  }
  items.forEach(item=>{
    if(item.hide) return;
    const cn = (item.name_cn || "").trim();
    if(cn.length < 2) return;
    aliasIndex[cn] = { alias: cn, kind: "equip", en: item.name };
    equipIndex[item.name] = item;
  });
  // 自动补充去掉「的/之」的写法（如「森林守护者印章」→「森林守护者的印章」）
  Object.keys(aliasIndex).forEach(cn=>{
    if(!/[的之]/.test(cn)) return;
    const short = cn.replace(/[的之]/g, "");
    if(short.length < 2 || aliasIndex[short]) return;
    aliasIndex[short] = { alias: short, kind: aliasIndex[cn].kind, en: aliasIndex[cn].en };
  });
  aliasList = Object.values(aliasIndex).sort((a, b)=>b.alias.length - a.alias.length);
  aliasPattern = new RegExp(aliasList.map(x=>x.alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  
  // 过滤掉隐藏装备
  allItems = items.filter(item => !item.hide);
  // 初始显示全部可见装备
  filteredItems = [...allItems];
  
  // 清除可能的搜索和分类状态
  currentType = "all";
  document.querySelectorAll('.type-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.type === "all"));
  document.getElementById('searchBox').value = "";

  // 先更新界面文字（不渲染）
  updateLangText();
  updateTypeButtonsLang();
  updateJobButtonsLang();

  // 根据是否有定位参数决定如何渲染（只渲染一次）
  if(location.search.includes('equip=')){
    jumpToEquipFromUrl();
  } else {
    renderCards();
  }
}

// 渲染卡片
function renderCards(){
  const grid = document.getElementById("equipGrid");
  grid.innerHTML = "";
  updatePageInfo();
  const perPage = getPerPage();
 const pageItems = filteredItems.slice((page-1)*perPage, page*perPage);
  if(!pageItems.length){
    grid.innerHTML = `<div style='grid-column:1/-1;text-align:center;padding:20px'>${tr('noData','btnText')}</div>`;
    return;
  }
  pageItems.forEach(item=>{
    if (item.hide === true) return;
    const name =
  currentLang === "cn"
    ? (item.name_cn || item.name)
    : currentLang === "kr"
    ? (item.name_kr || item.name)
    : item.name;
    const rarityKey = item.rarity || "高级";
    const rarity = tr(rarityKey,'rarity');
    const rc = rarityConfig[rarityKey] || rarityConfig["高级"];
    const jobIconMap = { "warrior":"job/warrior.png","magician":"job/magician.png","ranger":"job/ranger.png","breaker":"job/breaker.png"};
    let jobIconsHtml = "";
    let jobs = Array.isArray(item.job) ? item.job : (typeof item.job=="string"&&item.job.includes(",") ? item.job.split(",").map(x=>x.trim()) : item.job ? [item.job] : []);
    if(!jobs.length) jobs = ["all"];
    jobs.forEach(j=>{

  j = j.toLowerCase();

  const src = jobIconMap[j] || "job/all.png";

  jobIconsHtml += `
    <img
      src="${src}"
      style="width:20px;height:20px;object-fit:contain;margin:2px"
      alt="${tr(j,'job')}"
    >
  `;

});

    const icon = item.icon || "default.png";
    let statsHtml = "";
    statKeys.forEach(k=>{
      let v = item[k];
      if(v==null || v==="" || v===0 || v==="0") return;
      statsHtml += `<div class="stat-item">${tr(k,'attrName')}: ${statValueText(k, v)}</div>`;
    });
    if(!statsHtml) statsHtml = `<div class="stat-item">${tr('noAttr','btnText')}</div>`;

    const desc = String(item.desc || "")
  .replace(/'/g,"\\'")
  .replace(/"/g,'\\"');

    const hasSource = String(item.desc || "").trim() !== "";
    const sourceBtn = hasSource
      ? `<button class="btn-source" onclick="openModal('${desc}')">${tr('source','btnText')}</button>`
      : `<button class="btn-source disabled" disabled>${tr('source','btnText')}</button>`;

    const nameCnKey = (item.name_cn || "").trim();
    const resetBtn = resetMap[nameCnKey]
      ? `<button class="btn-reset" onclick="openResetModal('${nameCnKey.replace(/'/g,"\\'")}')">${tr('reset','btnText')}</button>`
      : "";
    
    const card = document.createElement("div");
    card.className = "equip-card";
    card.dataset.name = item.name || "";
    card.dataset.nameCn = item.name_cn || "";
    card.dataset.nameEn = item.name || "";
    card.dataset.nameKr = item.name_kr || "";
    card.innerHTML = `
      <div class="equip-name" style="color:${rc.color}">${name}</div>
      <div class="equip-info-row">
        <div class="equip-icon-col">
          <div class="hex-icon"><div class="star star1"></div><div class="star star2"></div><img loading="lazy" src="equip_icons/${icon}" onerror="this.src='equip_icons/default.png'"></div>
          <div class="item-level">Lv ${item.level||1}</div>
        </div>
        <div class="equip-text-col">
          <div class="tag-rarity" style="background:${rc.bg}">${rarity}</div>
          <div class="tag-job">${jobIconsHtml}</div>
        </div>
      </div>
      <div class="equip-stats">${statsHtml}</div>
      <div class="card-actions">
        ${sourceBtn}
        ${resetBtn}
      </div>
    `;
    grid.appendChild(card);
  });
}

// 定位装备（接收参数 equip）
function jumpToEquipFromUrl(){
  const params = new URLSearchParams(location.search);
  const equipName = decodeURIComponent(params.get("equip") || "").toLowerCase().trim();
  if(!equipName) return;

  // 在全部可见装备中查找
  const index = allItems.findIndex(item => {
    const names = [item.name, item.name_cn, item.name, item.name_kr].join(" ").toLowerCase();
    return names.includes(equipName);
  });

  if(index === -1){
    // 没找到 → 显示第一页
    page = 1;
    renderCards();
    return;
  }

  // 计算目标所在页码
  page = Math.floor(index / getPerPage()) + 1;
  // 只渲染一次
  renderCards();

  // 渲染完成后定位高亮
  setTimeout(() => {
    const cards = document.querySelectorAll(".equip-card");
    for(const card of cards){
      const stored = [
  card.dataset.name,
  card.dataset.nameCn,
  card.dataset.nameKr
]
.join(" ")
.toLowerCase()
.trim();
      if(stored.includes(equipName)){
        card.scrollIntoView({ behavior:"smooth", block:"center" });
        card.style.boxShadow = "0 0 20px gold";
        setTimeout(() => { card.style.boxShadow = ""; }, 2000);
        break;
      }
    }
  }, 300);
}

// 弹窗打开时锁定页面滚动（含滚动条宽度补偿，防止页面横向跳动）
let pageScrollLocked = false;
function lockPageScroll(lock){
  if(lock === pageScrollLocked) return;
  pageScrollLocked = lock;
  if(lock){
    const sw = window.innerWidth - document.documentElement.clientWidth;
    const pr = parseFloat(getComputedStyle(document.body).paddingRight) || 0;
    document.body.style.overflow = "hidden";
    if(sw > 0) document.body.style.paddingRight = (pr + sw) + "px";
  } else {
    document.body.style.overflow = "";
    document.body.style.paddingRight = "";
  }
}

function openModal(d){

  // 空内容不弹窗
  if (!d || d.trim() === '') return;

  const modal = document.getElementById("modalText");

  // 逗号分隔为一行一个来源；连写的「地下城宝物46/48/50」拆成多行
  const lines = [];
  d.split(/[\n,]/).forEach(x=>{
    const t = x.trim();
    if(!t) return;
    if(/^地下城宝物\s*\d+(?:\s*\/\s*\d+)+$/.test(t)){
      t.split(/\s*\/\s*/).forEach(part=>{
        lines.push("地下城宝物" + part.replace(/[^\d]/g, ""));
      });
    } else {
      splitOutsideBrackets(t).forEach(part=>lines.push(part));
    }
  });

  modal.innerHTML = lines.map(t => {

    // 掉落/获取提示前缀（跟随语言）
    if (t.indexOf("怪物掉落") === 0 || t.indexOf("获取途径") === 0) {

      let prefix = t;
      if (currentLang === "en") {
        prefix = t.indexOf("怪物掉落") === 0 ? "Monster drops (clickable):" : "Source (clickable):";
      }

      return `
        <div style="
          cursor:default;
          background:#f3f3f3;
        ">
          ${prefix}
        </div>
      `;
    }

    // 怪物（可点击，名称跟随语言）
    if (t.startsWith("@")) {

      const monster = t.slice(1);
      const en = cnToEnMap[monster];
      const disp = en ? ((nameMap[en] && (nameMap[en][currentLang] || nameMap[en].en)) || monster) : monster;

      return `
        <div onclick="goMonster('${monster.replace(/'/g,"\\'")}')">
          ${disp}
        </div>
      `;
    }

    const text = t.startsWith("#") ? t.slice(1) : t;
    const hit = rowAlias(text);
    const html = stripBrackets(linkifyEquipText(text));

    // 整行就是一个物品/装备：一行一个跳转
    if (hit && (html.match(/class="item-link"/g) || []).length === 1) {
      const en = hit.en.replace(/'/g,"\\'");
      const call = hit.kind === "equip" ? `goEquip('${en}')` : `goItem('${en}')`;
      const row = html.replace(/<span class="item-link" onclick="[^"]*">/, '<span class="item-link">');
      return `<div onclick="${call}">${row}</div>`;
    }

    // 其余文本：行内物品名可点击
    return `
      <div style="
        cursor:default;
        background:#f3f3f3;
      ">
        ${html}
      </div>
    `;

  }).join("");

  document.getElementById("modal").style.display = "flex";
  lockPageScroll(true);
}

// 整行名称 -> 别名（去掉【】与数量后缀后精确匹配）
function rowAlias(t){
  let core = String(t).replace(/[【】]/g, "").trim();
  core = core.replace(/\s*[xX×]\s*[\d,~\-/]+\s*.*$/, "").trim();
  return aliasIndex[core] || null;
}

// 只在【】外按 / 拆行（括号内的斜杠保留，如卡牌 10/J/Q/K/A）
function splitOutsideBrackets(t){
  const parts = [];
  let depth = 0, cur = "";
  for(const ch of String(t)){
    if(ch === "【") depth++;
    else if(ch === "】") depth = Math.max(0, depth - 1);
    if(ch === "/" && depth === 0){ parts.push(cur); cur = ""; }
    else cur += ch;
  }
  parts.push(cur);
  return parts.map(x=>x.trim()).filter(Boolean);
}

// 显示层去掉【】，】后留空格（不处理 HTML 标签内部）
function stripBrackets(html){
  return html.replace(/<[^>]*>|[【】]/g, m=>{
    if(m === "【") return "";
    if(m === "】") return " ";
    return m;
  }).replace(/[ \t]{2,}/g, " ").replace(/[ \t]+$/g, "");
}

// 文案显示名（跟随当前语言）
function aliasDisplayName(hit){
  if(hit.kind === "equip"){
    const eq = equipIndex[hit.en];
    if(!eq) return hit.en;
    if(currentLang === "en") return eq.name;
    if(currentLang === "kr") return eq.name_kr || eq.name;
    return eq.name_cn || eq.name;
  }
  const v = dropMap[hit.en] || {};
  if(currentLang === "en") return v.en || hit.en;
  if(currentLang === "kr") return v.kr || v.en || hit.en;
  return v.cn || hit.en;
}

// 获取途径文案里的物品/装备名 -> 可点击（括号内须整体同名，避免误链）
function linkifyEquipText(text){
  if(!aliasPattern) return text;
  return text.replace(aliasPattern, (m, offset, whole)=>{
    const hit = aliasIndex[m];
    if(!hit) return m;
    const open = whole.lastIndexOf("【", offset);
    const close = whole.lastIndexOf("】", offset);
    if(open > close){
      const end = whole.indexOf("】", offset + m.length);
      const inner = whole.slice(open + 1, end === -1 ? whole.length : end).trim();
      if(inner !== m) return m;
    }
    const en = hit.en.replace(/'/g,"\\'");
    const call = hit.kind === "equip" ? `goEquip('${en}')` : `goItem('${en}')`;
    return `<span class="item-link" onclick="${call}">${aliasDisplayName(hit)}</span>`;
  });
}

function goItem(name){
  location.href = `items.html?item=${encodeURIComponent(name)}`;
}
function goEquip(name){
  location.href = `equip.html?equip=${encodeURIComponent(name)}`;
}

function goMonster(name){
  // 后退回来时避免重复定位
  if (location.search.includes('equip=')) {
    const url = new URL(location);
    url.searchParams.delete('equip');
    history.replaceState(history.state, '', url);
  }
  location.href = `index.html?monster=${encodeURIComponent(name)}`;
}

// 重置概率弹窗
function openResetModal(nameCn){
  const data = resetMap[nameCn];
  if(!data) return;

  const item = allItems.find(x => (x.name_cn || "").trim() === nameCn);
  let titleName = nameCn;
  if(item){
    titleName = currentLang === "cn"
      ? (item.name_cn || item.name)
      : currentLang === "kr"
      ? (item.name_kr || item.name)
      : item.name;
  }
  document.getElementById("resetModalTitle").innerText = tr('resetTitle','btnText') + " · " + titleName;

  document.getElementById("resetModalBody").innerHTML = `<div class="reset-stats">` + data.stats.map(st => {
    const sname = langConfig.attrName[st.key] ? tr(st.key,'attrName') : st.name;
    const rows = st.rows.map(r => `<tr><td class="reset-val">${r[0]}</td><td>${r[1]}%</td></tr>`).join("");
    return `<div class="reset-stat">
      <div class="reset-stat-name">${sname}</div>
      <table class="reset-table">
        <thead><tr><th>${tr('resetValue','btnText')}</th><th>${tr('resetRate','btnText')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join("") + `</div>`;

  document.getElementById("resetModal").style.display = "flex";
  document.getElementById("resetModalBody").scrollTop = 0;
  lockPageScroll(true);
}
function closeResetModal(){ document.getElementById("resetModal").style.display="none"; lockPageScroll(false); }
