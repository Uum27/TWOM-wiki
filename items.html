<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物品图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",system-ui,sans-serif}
body{background:#f0f2f5;padding:12px}

.top-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;

  position:sticky;
  top:0;
  z-index:100;

  background:#f0f2f5;
  padding:6px 0;
}

.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}
.lang-btn,.page-btn,.type-btn{
  padding:8px;border:1px solid #ccc;background:#fff;border-radius:8px;white-space:nowrap;font-size:16px
}
.type-btn.active{ background:#718ACC;color:#fff;border-color:#718ACC }
.page-btn{margin:0 4px}

/* 分类栏 */
#catBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.pagination{text-align:center;margin:8px 0}

.equip-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* 平板 */
@media(min-width:768px) and (max-width:1023px){
  .equip-grid{
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
}

/* PC */
@media(min-width:1024px){
  .equip-grid{
    grid-template-columns:repeat(4,1fr);
    gap:18px;
  }
}

.equip-card{
  background:#D9E3EC;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);overflow:hidden;
  display:flex;flex-direction:column;padding:4px;gap:4px;border:1px solid #94A6BE;
}
.equip-name{
  text-align:center;font-weight:bold;font-size:18px;
  padding:4px 4px;
  border-top:2px solid #b9cad6;border-bottom:2px solid #b9cad6;
  background:linear-gradient(100deg,#c1ceda,#E7F7FF,#c1ceda);
  border-radius:8px;
  line-height:1.2;
}
@media(min-width:1024px){ .equip-name{ font-size:20px;padding:6px 4px } }

.equip-info-row{display:flex;padding:4px;gap:4px;align-items:center}
.equip-icon-col{ width:30%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px }
.equip-text-col{width:70%;display:flex;flex-direction:column;gap:4px}

.hex-icon{ width:56px;height:56px;display:flex;align-items:center;justify-content:center; clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%); background:linear-gradient(145deg,#6085ac,#2f4666);position:relative;overflow:hidden; }
.hex-icon::before{ content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0.5),rgba(255,255,255,0) 40%); }
.hex-icon::after{ content:"";position:absolute;inset:0;box-shadow:inset 0 0 15px rgba(255,255,255,0.35),inset 0 0 25px rgba(255,255,255,0.15); }
.hex-icon .star{ position:absolute;width:8px;height:8px;z-index:1; }
.hex-icon .star::before{ content:"";position:absolute;width:100%;height:2px;top:50%;left:0;transform:translateY(-50%);background:linear-gradient(to right,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star::after{ content:"";position:absolute;width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star1{ top:18%;left:15%; }
.hex-icon .star2{ bottom:18%;right:15%; }
.hex-icon img{width:34px;height:34px;object-fit:contain}
@media(min-width:1024px){ .hex-icon{width:68px;height:68px} .hex-icon img{width:42px;height:42px} }

.tag-rarity{ padding:3px 6px;border-radius:8px;color:#D6E5DC;font-size:13px;width:fit-content }
.item-card .tag-rarity{ position:relative;left:6px;top:-3px }   /* 物品图鉴：标签右移6px、上移3px */
.item-level{ min-height:20px }          /* 等级位留空 */
.item-card .job-slot{ min-height:24px } /* 职业位留空 */

.equip-stats{ background:#C6D4E4;padding:8px 4px;border-radius:8px;margin-top:4px }
.item-card .item-stats{ min-height:40px;max-height:200px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch } /* 说明超长时内部滚动 */
.item-note{ font-size:13px;color:#3D4E68;line-height:1.6;text-align:left;padding:0 4px }
.item-link{ color:#3774AE;text-decoration:underline;cursor:pointer }

/* 卡片底部操作行 */
.card-actions{ display:flex;gap:6px;margin-top:auto }
.card-actions .btn-source{ flex:1;width:auto;margin:0;padding:7px 2px;font-size:14px }
.btn-source{ width:60%;margin:0 auto;padding:8px;margin-top:auto;background:#718ACC;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;display:block }
.btn-source.disabled{ background:#9AA7BC;cursor:default }
.card-actions .btn-rate{ flex:1;width:auto;margin:0;padding:7px 2px;font-size:14px }
.btn-rate{ background:#4E9A8C;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer }
@media(min-width:1024px){ .card-actions .btn-source{padding:10px 6px;font-size:16px} .card-actions .btn-rate{padding:10px 6px;font-size:16px} }

.modal-backdrop{ position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999 }
.modal-content{ background:#fff;width:80%;max-width:380px;padding:20px;border-radius:16px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.3) }
.modal-title{font-size:18px;font-weight:bold;margin-bottom:12px;color:#333}
.modal-desc{font-size:15px;color:#3D4E68;line-height:1.6;margin-bottom:16px;min-height:60px;}
.modal-desc div{ padding:8px; border-radius:8px; cursor:pointer; margin:4px 0; background:#f5f7fa; }
.modal-desc div:hover{ background:#e0e7ff; }
.modal-close{padding:7px 16px;background:#5c6bc0;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

/* 获取途径弹窗：内容超高时内部滚动 */
.modal-content.source-modal{ max-height:60%;display:flex;flex-direction:column }
.modal-content.source-modal .modal-title{ flex-shrink:0 }
.modal-content.source-modal .modal-desc{ flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain }
.modal-content.source-modal .modal-close{ align-self:center;flex-shrink:0 }

/* 里艾尔的战鼓：获得概率弹窗 */
.modal-content.rate-modal{ width:fit-content;max-width:80%;height:auto;max-height:60%;display:flex;flex-direction:column;text-align:left }
.modal-content.rate-modal .modal-title{ flex-shrink:0;text-align:center }
.modal-content.rate-modal .modal-close{ align-self:center;flex-shrink:0 }
.rate-body{ flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:4px 0 12px }
.rate-table{ width:100%;border-collapse:collapse;font-size:14px;background:#fff }
.rate-table th{ background:#e0e7f3;color:#3D4E68;padding:5px 12px;font-weight:bold;text-align:center }
.rate-table td{ padding:5px 12px;border-top:1px solid #eef2f7;text-align:center }
.rate-table tbody tr:nth-child(even) td{ background:#f7f9fc }
.rate-table td.rate-val{ font-weight:bold;color:#3D4E68 }
</style>
</head>

<body>
<div class="top-bar">
  <input class="search-box" placeholder="搜索物品名..." id="searchBox">
  <button class="lang-btn" id="langBtn">中文/EN/한국어</button>
</div>
<button class="type-btn" onclick="location.href='index.html'" data-nav="monster">怪物图鉴</button>
<button class="type-btn" onclick="location.href='equip.html'" data-nav="equip">装备图鉴</button>

</div>
<div class="pagination" id="topPagination">

  <span id="pageInfo">第 1 页</span>
  <button class="page-btn" id="nextTop">下一页</button>
</div>
<div class="equip-grid" id="itemGrid">加载中...</div>
<div class="pagination" id="bottomPagination">

  <span id="pageInfoBot">第 1 页</span>
  <button class="page-btn" id="nextBot">下一页</button>
</div>
<div class="modal-backdrop" id="modal">
  <div class="modal-content source-modal">
    <div class="modal-title" id="modalTitle">获取途径</div>
    <div class="modal-desc" id="modalText"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>
<div class="modal-backdrop" id="rateModal">
  <div class="modal-content rate-modal">
    <div class="modal-title" id="rateModalTitle">获得概率</div>
    <div class="rate-body" id="rateModalBody"></div>
    <button class="modal-close" id="rateModalClose" onclick="closeRateModal()">关闭</button>
  </div>
</div>

  const m = dropMap[en] || {};
  if(currentLang === "en") return m.en || en;
  if(currentLang === "kr") return m.kr || m.en || en;
  return m.cn || en;
}

// 装备名称（当前语言 → 中文 → 英文）
function equipNameOf(en){
  const m = equipNameMap[en] || {};
  if(currentLang === "en") return m.en || en;
  return m.cn || m.en || en;
}

// 宝箱内容条目：数量 + 链接（物品→物品图鉴、装备→装备图鉴）
function chestEntryHtml(raw){
  if(/^Gold\b/.test(raw)){
    const rest = String(raw).replace(/^Gold\s*/, "").replace(/^\s*\(/, "").replace(/\)\s*$/, "").trim();
    const qDisp = currentLang === "en" ? rest.replace(/或/g, "or") : rest;
    return `<span class="item-link" onclick="goItem('Gold')">${itemNameOf("Gold")}</span> (${qDisp})`;
  }
  let base = raw, suffix = "";
  let m = String(raw).match(/^(.*?)\s*\(([\d\s\-,~]+)\)\s*$/);
  if(m){
    base = m[1].trim();
    suffix = " x" + m[2].replace(/\s+/g, "");
  } else {
    m = String(raw).match(/^(.*?)\s+x(\d+)\s*$/i);
    if(m){ base = m[1].trim(); suffix = " x" + m[2]; }
  }
  if(equipNameMap[base]){
    return `<span class="item-link" onclick="goEquip('${base.replace(/'/g,"\\'")}')">${equipNameOf(base)}</span>${suffix}`;
  }
  if(dropMap[base]){
    return `<span class="item-link" onclick="goItem('${base.replace(/'/g,"\\'")}')">${itemNameOf(base)}</span>${suffix}`;
  }
  // 非数量括号（如 (Soulbound)、(B Class)）：去掉括号再解析，括号内容保留显示
  m = String(raw).match(/^(.*?)\s*(\([^()]*\))\s*$/);
  if(m){
    const b2 = m[1].trim();
    if(equipNameMap[b2]) return `<span class="item-link" onclick="goEquip('${b2.replace(/'/g,"\\'")}')">${equipNameOf(b2)}</span> ${m[2]}`;
    if(dropMap[b2]) return `<span class="item-link" onclick="goItem('${b2.replace(/'/g,"\\'")}')">${itemNameOf(b2)}</span> ${m[2]}`;
  }
  return raw;
}

// 宝物箱来源（副本完成 / 击杀Boss后退出）
function chestSourceLine(name, isEn){
  const dg = CHEST_DUNGEONS[name];
  if(!dg) return "";
  if(dg.type === "zone"){
    const z = dg.zone;
    const label = (DUNGEON_LABEL[z] && DUNGEON_LABEL[z][currentLang]) || z;
    return `<span class="item-link" onclick="goZone('${z}')">${label}</span>${isEn ? " completion" : "完成获得"}`;
  }
  const mn = dg.monster;
  const cn = (nameMap[mn] && nameMap[mn].cn) || mn;
  const disp = monsterDisplayName(mn);
  return `${isEn ? "Defeat " : "击杀 "}<span class="item-link" onclick="goMonster('${cn.replace(/'/g,"\\'")}')">${disp}</span>${isEn ? " then exit the dungeon" : " 后退出副本获得"}`;
}
function chestNoteHead(name, isEn){
  const line = chestSourceLine(name, isEn);
  return line ? line + (isEn ? "; " : "；") : "";
}

// 符文/箱子说明（含跳转）
function itemNoteBase(name){
  const isEn = currentLang === "en";
  if(name === "Box Flowing with Mana"){
    const links = BOX_RUNES.map(r =>
      `<span class="item-link" onclick="goItem('${r.replace(/'/g,"\\'")}')">${itemNameOf(r)}</span>`
    ).join("<br>");
    return `<div class="item-note">${isEn ? "Randomly contains:" : "开启随机获得："}<br>${links}</div>`;
  }
  // 宝箱开启内容（每个内容单独一行）
  const chestList = chestContents[name];
  if(chestList){
    const parts = chestList.map(chestEntryHtml).join("<br>");
    const head = chestNoteHead(name, isEn);
    const label = isEn ? "Opening yields:" : "开启获得：";
    const brk = head && TREASURE_42_50.includes(name) ? "<br>" : "";
    return `<div class="item-note">${head}${brk}${label}<br>${parts}</div>`;
  }
  const ainfo = ADRA_MATERIALS[name];
  if(ainfo){
    const links = ainfo.equips.map(en=>
      `<span class="item-link" onclick="goEquip('${en.replace(/'/g,"\\'")}')">${equipNameOf(en)}</span>`
    ).join("<br>");
    const prefix = ainfo.extra ? (isEn ? ainfo.extra + "; " : ainfo.extra + "；") : "";
    return `<div class="item-note">${prefix}${isEn ? "Used for Adra exchange:" : "用于阿德拉处兑换："}<br>${links}</div>`;
  }
  const info = RUNE_EXCHANGE[name];
  if(!info) return "";
  const skillLink = `<span class="item-link" onclick="goSkill('${info.book.replace(/'/g,"\\'")}')">${itemNameOf(info.book)}</span>`;
  const exchange = isEn ? `${info.where} x3 exchange: ` : `${info.where}x3兑换：`;
  if(info.fromBox){
    const boxLink = `<span class="item-link" onclick="goItem('Box Flowing with Mana')">${itemNameOf("Box Flowing with Mana")}</span>`;
    return `<div class="item-note">${isEn ? "Randomly obtained from " : "由"}${boxLink}${isEn ? "; " : "随机开出；"}${exchange}${skillLink}</div>`;
  }
  return `<div class="item-note">${exchange}${skillLink}</div>`;
}

// 卡片说明：在原有说明后追加「可兑换技能」「可制作装备」
function itemNote(name){
  let html = itemNoteBase(name);
  const isEn = currentLang === "en";
  const exs = skillExMap[name];
  if(exs && exs.length){
    const bySrc = {};
    exs.forEach(x=>{ const k = isEn ? x.srcEn : x.srcCn; (bySrc[k] = bySrc[k] || []).push(x.book); });
    Object.keys(bySrc).forEach(src=>{
      const links = [...new Set(bySrc[src])].map(book=>
        `<span class="item-link" onclick="goSkill('${book.replace(/'/g,"\\'")}')">${itemNameOf(book)}</span>`
      ).join("<br>");
      html += `<div class="item-note">${src}：<br>${links}</div>`;
    });
  }
  const eqs = craftMap[name];
  if(eqs && eqs.length){
    const links = eqs.map(en=>
      `<span class="item-link" onclick="goEquip('${en.replace(/'/g,"\\'")}')">${equipNameOf(en)}</span>`
    ).join("<br>");
    html += `<div class="item-note">${isEn ? "Craftable equipment:" : "可制作装备："}<br>${links}</div>`;
  }
  return html;
}

// 「名称1/2/3p」展开；普通内容按换行或 / 拆分并去掉 x数量
function expandExchangeNames(text){
  const m = String(text).match(/^(.+?)(\d+)\/(\d+)\/(\d+)(p?)$/);
  if(m) return [m[1] + m[2] + m[5], m[1] + m[3] + m[5], m[1] + m[4] + m[5]];
  return String(text).split(/[\n/+＋]/).map(x=>x.replace(/\s*x\s*\d+\s*$/i, "").trim()).filter(Boolean);
}

// 解析装备文案里的制作材料（【组合书X】制作 / NPC 制作段之后的【...】）
function parseRecipeMaterials(desc){
  const segs = String(desc || "").split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  let mode = "none";
  segs.forEach(s=>{
    if(s.startsWith("@")) return;
    if(s.indexOf("怪物掉落") === 0 || s.indexOf("获取途径") === 0){ mode = "drop"; return; }
    if(s.indexOf("箱子开启") >= 0){ mode = "chest"; return; }
    if(s.startsWith("#")){ mode = "note"; return; }
    if(s.indexOf("制作") >= 0 || s.indexOf("NPC") >= 0){ mode = "craft"; return; }
    if(mode !== "craft") return;
    (s.match(/【([^】]+)】/g) || []).forEach(b=>{
      const n = b.slice(1, -1).trim();
      if(n && !n.startsWith("组合书")) out.push(n);
    });
  });
  return out;
}

let allItems = [];
let filteredItems = [];
let dropMap = {};
let nameMap = {};
let dcType = {};
let currentCat = "all";
let equipNameMap = {};
let craftMap = {};
let skillExMap = {};

function getPerPage(){
  if(window.innerWidth >= 1024) return 20;
  if(window.innerWidth >= 768) return 15;
  return 12;
}

function tr(key, type){
  const o = langConfig[type]?.[key];
  return o?.[currentLang] || o?.cn || key;
}

function itemDisplayName(en){
  const m = dropMap[en] || {};
  if(currentLang === "en") return m.en || en;
  if(currentLang === "kr") return m.kr || m.en || en;
  return m.cn || en;
}

function monsterDisplayName(en){
  const m = nameMap[en] || {};
  return m[currentLang] || m.cn || en;
}

// 按当前语言名称排序（中文拼音，英文/韩文按英文名）
// 箱子类排序：地下城宝箱20→40、地下城宝物20→50、其余按指定顺序（表外按名称兜底）
const CHEST_SORT_ORDER = [
  "Swamp Treasure", "Maze Treasure", "Snowfield Altar Treasure",
  "Box Flowing with Mana", "Random Enchant Scroll Box",
  "Lucky Box", "High Lucky Box", "Riel's War Drum",
  "Wingfril's Treasure", "Strange Treasure", "Ancient Treasure", "Old Box", "Small Treasure Box"
];
function chestSortKey(name){
  let m = name.match(/^Dungeon Chest (\d+)$/);
  if(m) return [0, parseInt(m[1], 10)];
  m = name.match(/^Dungeon Treasure (\d+)$/);
  if(m) return [1, parseInt(m[1], 10)];
  const idx = CHEST_SORT_ORDER.indexOf(name);
  return [2, idx === -1 ? 999 : idx];
}
// 卡片高度估算：按说明行数（封顶 10 行 ≈ 200px 说明框）
function itemCardWeight(name){
  let lines = 0;
  if(name === "Box Flowing with Mana") lines = 1 + BOX_RUNES.length;
  else if(chestContents[name]) lines = 2 + chestContents[name].length;
  else if(ADRA_MATERIALS[name]) lines = 1 + ADRA_MATERIALS[name].equips.length;
  else if(RUNE_EXCHANGE[name]) lines = 1;
  if(skillExMap[name]) lines += 1 + skillExMap[name].length;
  if(craftMap[name]) lines += 1 + craftMap[name].length;
  return Math.min(lines, 10);
}
// 分类排序（与分类栏一致：箱子→符文→消耗品→其他）
const CAT_RANK = { chest: 0, rune: 1, consume: 2, other: 3 };
function sortItems(){
  const coll = new Intl.Collator(currentLang === "cn" ? "zh-Hans" : "en");
  allItems.sort((a,b)=>
    itemCardWeight(a.name) - itemCardWeight(b.name)
    || (CAT_RANK[a.cat] ?? 9) - (CAT_RANK[b.cat] ?? 9)
    || coll.compare(itemDisplayName(a.name), itemDisplayName(b.name))
    || a.name.localeCompare(b.name)
  );
}
// 箱子分类专用排序（类别内全部是箱子，排序一致）
function sortChestList(list){
  const coll = new Intl.Collator(currentLang === "cn" ? "zh-Hans" : "en");
  return list.slice().sort((a,b)=>{
    const ka = chestSortKey(a.name), kb = chestSortKey(b.name);
    if(ka[0] !== kb[0]) return ka[0] - kb[0];
    if(ka[1] !== kb[1]) return ka[1] - kb[1];
    return coll.compare(itemDisplayName(a.name), itemDisplayName(b.name)) || a.name.localeCompare(b.name);
  });
}

function updateLangText(){
  document.getElementById('searchBox').placeholder = langConfig.searchPlaceholder[currentLang];
  document.getElementById('prevTop').innerText = document.getElementById('prevBot').innerText = tr('prev','btnText');
  document.getElementById('nextTop').innerText = document.getElementById('nextBot').innerText = tr('next','btnText');
  document.getElementById('langBtn').innerText = {cn:"中文/EN/한국어",en:"CN/English/한국어",kr:"중국어/EN/한국어"}[currentLang];
  document.getElementById('modalTitle').innerText = tr('modalTitle','btnText');
  document.querySelector('.modal-close').innerText = tr('close','btnText');
  document.getElementById('rateModalClose').innerText = tr('close','btnText');
  updateCatButtonsLang();
  updateNavLang();
}

function updateCatButtonsLang(){
  document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
    const c = btn.dataset.cat;
    if(catLang[c]) btn.innerText = catLang[c][currentLang];
  });
}

function updatePageInfo(){
  const total = Math.ceil(filteredItems.length / getPerPage());
  const s = langConfig.pageText[currentLang].replace("{now}",page).replace("{total}",total||1);
  document.getElementById('pageInfo').innerText = document.getElementById('pageInfoBot').innerText = s;
}

function toggleLang(){
  currentLang = currentLang==="cn" ? "en" : currentLang==="en" ? "kr" : "cn";
  updateLangText();
  sortItems();
  filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim(), true);
}

function doSearch(){ filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim()); }

function filterAndRender(keyword="", keepPage){
  let list = allItems;
  if(currentCat !== "all") list = list.filter(x=>x.cat === currentCat || (DUAL_CATS[x.name]||[]).includes(currentCat));
  if(keyword){
    list = list.filter(x=>{
      const m = dropMap[x.name] || {};
      const all = [x.name, m.cn||"", m.en||"", m.kr||""].join(" ").toLowerCase();
      return all.includes(keyword);
    });
  }
  // 箱子分类：按掉落等级排序（宝箱20→40、宝物20→50、其他按名称）
  filteredItems = currentCat === "chest" ? sortChestList(list) : list;
  if(keepPage){
    const total = Math.ceil(filteredItems.length / getPerPage());
    if(page > total) page = Math.max(1, total);
  } else {
    page = 1;
  }
  renderCards();
}

function setCat(cat){
  currentCat = cat;
  document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  doSearch();
}

function goPrev(){ if(page>1){page--;renderCards();} }
function goNext(){
  const total = Math.ceil(filteredItems.length/getPerPage());
  if(page<total){ page++; renderCards(); window.scrollTo(0,0); }
}

// 渲染卡片
function renderCards(){
  const grid = document.getElementById("itemGrid");
  grid.innerHTML = "";
  updatePageInfo();
  const perPage = getPerPage();
  const pageItems = filteredItems.slice((page-1)*perPage, page*perPage);
  if(!pageItems.length){
    grid.innerHTML = `<div style='grid-column:1/-1;text-align:center;padding:20px'>${tr('noData','btnText')}</div>`;
    return;
  }
  pageItems.forEach(item=>{
    const m = dropMap[item.name] || {};
    const name = itemDisplayName(item.name);
    const rc = rarityConfig["一般"];
    const rarity = tr("一般","rarity");
    const hasSource = item.monsters.length > 0 || BOX_RUNES.includes(item.name) || EXTRA_ITEMS.includes(item.name) || TREASURE_ITEMS.includes(item.name) || !!SUPPLEMENT_SOURCES[item.name] || !!CORE_SOURCES[item.name] || !!OPEN_FROM[item.name];
    const sourceBtn = hasSource
      ? `<button class="btn-source" onclick="openSourceModal('${item.name.replace(/'/g,"\\'")}')">${tr('source','btnText')}</button>`
      : `<button class="btn-source disabled" disabled>${tr('source','btnText')}</button>`;
    const rateBtn = item.name === "Riel's War Drum"
      ? `<button class="btn-rate" onclick="openRateModal()">${tr('rate','btnText')}</button>`
      : "";

    const noteHtml = itemNote(item.name);
    const card = document.createElement("div");
    card.className = "equip-card item-card";
    card.dataset.name = item.name;
    card.dataset.nameCn = m.cn || "";
    card.dataset.nameKr = m.kr || "";
    card.innerHTML = `
      <div class="equip-name" style="color:${rc.color}">${name}</div>
      <div class="equip-info-row">
        <div class="equip-icon-col">
          <div class="hex-icon"><div class="star star1"></div><div class="star star2"></div><img loading="lazy" src="drop_icons/${item.name}.png" onerror="this.style.display='none'"></div>
          <div class="item-level"></div>
        </div>
        <div class="equip-text-col">
          <div class="tag-rarity" style="background:${rc.bg}">${rarity}</div>
          <div class="job-slot"></div>
        </div>
      </div>
      <div class="equip-stats item-stats">${noteHtml}</div>
      <div class="card-actions">${sourceBtn}${rateBtn}</div>
    `;
    grid.appendChild(card);
  });
}

// 获取途径弹窗（掉落怪物，可点击回怪物图鉴）
function openSourceModal(nameEn){
  const item = allItems.find(x => x.name === nameEn);
  if(!item) return;
  // 战鼓开启物品（附魔卷轴另显示 SHOP 宠物活动 PT 抽取）
  const of = OPEN_FROM[nameEn];
  if(of && !item.monsters.length){
    const isEn = currentLang === "en";
    const drum = `<span class="item-link" onclick="goItem('Riel\\'s War Drum')">${itemNameOf("Riel's War Drum")}</span>`;
    const rows = [isEn ? `Obtained by opening ${drum}` : `由 ${drum} 开启获得`];
    if(of.pt) rows.push(isEn ? "Obtained from SHOP Pet Event PT Draw" : "SHOP 宠物活动 PT 抽取获得");
    document.getElementById("modalText").innerHTML = rows.map(x=>`<div>${x}</div>`).join("");
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 精髓：分解装备获得（显示在怪物列表上方）
  const coreSrc = CORE_SOURCES[nameEn];
  if(coreSrc){
    const isEn = currentLang === "en";
    const line = `<div style="cursor:default;background:#f3f3f3;">${isEn ? coreSrc.en : coreSrc.cn}</div>`;
    const list = item.monsters.slice().sort((a,b)=>{
      const x = monsterDisplayName(a), y = monsterDisplayName(b);
      return currentLang === "cn" ? x.localeCompare(y, "zh-Hans") : x.localeCompare(y);
    });
    document.getElementById("modalText").innerHTML = line + list.map(mn=>{
      const disp = monsterDisplayName(mn);
      const cn = (nameMap[mn] && nameMap[mn].cn) || mn;
      return `<div onclick="goMonster('${cn.replace(/'/g,"\\'")}')">${disp}</div>`;
    }).join("");
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 箱子开出的符文：来源显示为「充满魔力的箱子」（可点击）
  if(BOX_RUNES.includes(nameEn) && !item.monsters.length){
    document.getElementById("modalText").innerHTML =
      `<div onclick="goItem('Box Flowing with Mana')">${itemNameOf("Box Flowing with Mana")}</div>`;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 地下城宝物：只显示来源（副本完成 / 击杀Boss后退出）
  if(TREASURE_ITEMS.includes(nameEn) && !item.monsters.length){
    const line = chestSourceLine(nameEn, currentLang === "en");
    document.getElementById("modalText").innerHTML = line ? `<div>${line}</div>` : "";
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 精炼魔力：兑换来源（污染魔力可点击）
  if(nameEn === "Refined Mana" && !item.monsters.length){
    document.getElementById("modalText").innerHTML =
      `<div><span class="item-link" onclick="goItem('Corrupted Mana')">${itemNameOf("Corrupted Mana")}</span> x1 + 3000金 兑换</div>`;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 补充物品：兑换 / 分解装备 / 魔力之息概率合成
  const sup = SUPPLEMENT_SOURCES[nameEn];
  if(sup && !item.monsters.length){
    const isEn = currentLang === "en";
    let html;
    if(sup.link){
      const link = `<span class="item-link" onclick="goItem('${sup.link.replace(/'/g,"\\'")}')">${itemNameOf(sup.link)}</span>`;
      html = sup.qty
        ? (isEn ? `Trade ${link} x${sup.qty} to ${sup.en}` : `用 ${link} x${sup.qty} ${sup.cn}`)
        : (isEn ? `Chance to craft from ${link}` : `由「${link}」概率合成获得`);
    } else {
      html = isEn ? sup.en : sup.cn;
    }
    document.getElementById("modalText").innerHTML = `<div>${html}</div>`;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  if(!item.monsters.length) return;
  const list = item.monsters.slice().sort((a,b)=>{
    const x = monsterDisplayName(a), y = monsterDisplayName(b);
    return currentLang === "cn" ? x.localeCompare(y, "zh-Hans") : x.localeCompare(y);
  });
  // 宝物来源（如湿地宝物 ← 地下城宝物46/48）
  let extra = "";
  const from = CHEST_FROM[nameEn];
  if(from){
    const links = from.map(t=>
      `<span class="item-link" onclick="goItem('${t.replace(/'/g,"\\'")}')">${itemNameOf(t)}</span>`
    ).join(" / ");
    extra = currentLang === "en" ? `<div>Obtained by opening ${links}</div>` : `<div>由 ${links} 开启获得</div>`;
  }
  document.getElementById("modalText").innerHTML = extra + list.map(mn=>{
    const disp = monsterDisplayName(mn);
    const cn = (nameMap[mn] && nameMap[mn].cn) || mn;
    return `<div onclick="goMonster('${cn.replace(/'/g,"\\'")}')">${disp}</div>`;
  }).join("");
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalText").scrollTop = 0;
  lockPageScroll(true);
}

// 里艾尔的战鼓：获得概率弹窗
function openRateModal(){
  document.getElementById("rateModalTitle").innerText =
    `${tr('rateTitle','btnText')} · ${itemDisplayName("Riel's War Drum")}`;
  const rows = DRUM_RATES.map(r=>{
    const link = `<span class="item-link" onclick="goItem('${r.en.replace(/'/g,"\\'")}')">${itemDisplayName(r.en)}</span>`;
    return `<tr><td>${link}</td><td class="rate-val">${r.rate}</td></tr>`;
  }).join("");
  document.getElementById("rateModalBody").innerHTML =
    `<table class="rate-table"><thead><tr><th>${tr('rateItem','btnText')}</th><th>${tr('rateValue','btnText')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById("rateModal").style.display = "flex";
  document.getElementById("rateModalBody").scrollTop = 0;
  lockPageScroll(true);
}
function closeRateModal(){
  document.getElementById("rateModal").style.display = "none";
  lockPageScroll(false);
}

// 弹窗打开时锁定页面滚动（含滚动条宽度补偿，防止页面横向跳动）
let pageScrollLocked = false;
function lockPageScroll(lock){
  if(lock === pageScrollLocked) return;
  pageScrollLocked = lock;
  if(lock){
    const sw = window.innerWidth - document.documentElement.clientWidth;
    const pr = parseFloat(getComputedStyle(document.body).paddingRight) || 0;
    document.body.style.overflow = "hidden";
    if(sw > 0) document.body.style.paddingRight = (pr + sw) + "px";
  } else {
    document.body.style.overflow = "";
    document.body.style.paddingRight = "";
  }
}

// 定位物品（接收参数 item）
function jumpToItemFromUrl(){
  const params = new URLSearchParams(location.search);
  const key = decodeURIComponent(params.get("item") || "").toLowerCase().trim();
  if(!key) return;

  // 定位前重置分类，避免目标被筛掉
  currentCat = "all";
  document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat === "all");
  });

  const index = allItems.findIndex(item=>{
    const m = dropMap[item.name] || {};
    const names = [item.name, m.cn, m.en, m.kr].join(" ").toLowerCase();
    return names.includes(key);
  });

  if(index === -1){
    page = 1;
    renderCards();
    return;
  }

  page = Math.floor(index / getPerPage()) + 1;
  renderCards();

  setTimeout(() => {
    const cards = document.querySelectorAll(".item-card");
    for(const card of cards){
      const stored = [card.dataset.name, card.dataset.nameCn, card.dataset.nameKr].join(" ").toLowerCase().trim();
      if(stored.includes(key)){
        card.scrollIntoView({ behavior:"smooth", block:"center" });
        card.style.boxShadow = "0 0 20px gold";
        setTimeout(() => { card.style.boxShadow = ""; }, 2000);
        break;
      }
    }
  }, 300);
}

async function loadData(){
  let drops = {}, lang = {}, dc = [], equipData = [], chestData = {}, skillData = {};
  try {
    const [r1, r2, r3, r4, r5, r6] = await Promise.all([
      fetch("monster_drops.json"),
      fetch("lang.json"),
      fetch("dropColors.json"),
      fetch("equipment_data/all_equip.json"),
      fetch("chest_data.json"),
      fetch("skill_data.json")
    ]);
    drops = await r1.json();
    lang = await r2.json();
    dc = await r3.json();
    equipData = await r4.json();
    chestData = await r5.json();
    skillData = await r6.json();
  } catch(e) {
    console.log("load fail", e);
  }
  chestContents = chestData.contents || {};
  dropMap = lang.dropMap || {};
  nameMap = lang.nameMap || {};
  dcType = {};
  dc.forEach(x=>{ if(x.en) dcType[x.en] = x.type || ""; });
  equipNameMap = {};
  equipData.forEach(e=>{ equipNameMap[e.name] = { cn: (e.name_cn || "").trim(), en: e.name }; });

  // 物品 -> 可制作装备（解析装备文案中的制作材料）
  craftMap = {};
  const matCnToEn = {};
  for(const en in dropMap){
    const cn = ((dropMap[en] && dropMap[en].cn) || "").trim();
    if(!cn) continue;
    if(!matCnToEn[cn]) matCnToEn[cn] = en;
    const short = cn.replace(/[的之]/g, "");
    if(short && !matCnToEn[short]) matCnToEn[short] = en;
  }
  equipData.forEach(e=>{
    if(e.hide) return;
    parseRecipeMaterials(e.desc).forEach(cn=>{
      const en = matCnToEn[cn];
      if(!en) return;
      if(!craftMap[en]) craftMap[en] = [];
      if(!craftMap[en].includes(e.name)) craftMap[en].push(e.name);
    });
  });

  // 物品 -> 可兑换技能（解析技能 extraSources 括号里的材料）
  skillExMap = {};
  const skillItemCn = {};
  for(const en in dropMap){
    const cn = ((dropMap[en] && dropMap[en].cn) || "").trim();
    if(!cn) continue;
    if(!skillItemCn[cn]) skillItemCn[cn] = en;
  }
  Object.keys(skillData).forEach(key=>{
    const s = skillData[key];
    Object.keys(s.extraSources || {}).forEach(lv=>{
      const o = s.extraSources[lv] || {};
      const cn = o.cn || "";
      const m = cn.match(/（([^）]+)）/);
      if(!m) return;
      const book = (s.books || {})[lv] || "";
      if(!book) return;
      const srcCn = (cn.slice(0, m.index) + cn.slice(m.index + m[0].length)).trim();
      const srcEn = (o.en || "").replace(/\s*\([^)]*\)\s*$/, "").trim();
      expandExchangeNames(m[1]).forEach(nm=>{
        const itemEn = skillItemCn[nm];
        if(!itemEn) return;
        (skillExMap[itemEn] = skillExMap[itemEn] || []).push({ book: book, srcCn: srcCn, srcEn: srcEn });
      });
    });
  });

  // 反向映射：物品 -> 掉落怪物（排除装备与技能）
  const map = {};
  Object.keys(drops).forEach(monster=>{
    const list = (drops[monster] && drops[monster].掉落物) || [];
    list.forEach(raw=>{
      const it = String(raw).replace(/\s+x\d+$/i, "");
      if(dcType[it] === "equip" || dcType[it] === "skill" || EXTRA_EQUIP.has(it)) return;
      if(!map[it]) map[it] = { name: it, monsters: [], cat: CONSUMABLES.has(it) ? "consume" : "other" };
      map[it].monsters.push(monster);
    });
  });
  // 特殊物品：不在怪物掉落表中（如恒河豚箱子开出的符文、精炼魔力）
  BOX_RUNES.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  EXTRA_ITEMS.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  SUPPLEMENT_ITEMS.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  TREASURE_ITEMS.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  // 宝箱内容涉及、但不在掉落表中的物品（如 第2精髓/幸运箱/返回卷轴/赛乐亚之泪）
  Object.keys(chestContents).forEach(k=>{
    chestContents[k].forEach(raw=>{
      if(/^Gold\b/.test(raw)) return;
      let base = String(raw);
      let m = base.match(/^(.*?)\s*\(([\d\s\-,~]+)\)\s*$/);
      if(m){ base = m[1].trim(); }
      else {
        m = base.match(/^(.*?)\s+x(\d+)\s*$/i);
        if(m){ base = m[1].trim(); }
        else {
          m = base.match(/^(.*?)\s*(\([^()]*\))\s*$/);
          if(m) base = m[1].trim();
        }
      }
      if(equipNameMap[base]) return;
      if(!dropMap[base]) return;
      if(!map[base]) map[base] = { name: base, monsters: [], cat: "other" };
    });
  });
  // 分类归一（箱子/符文优先）
  Object.keys(map).forEach(k=>{ map[k].cat = itemCat(k); });
  allItems = Object.keys(map).map(k=>map[k]);
  // 按当前语言名称排序
  sortItems();
  filteredItems = [...allItems];
  document.getElementById('searchBox').value = "";

  updateLangText();

  if(location.search.includes('item=')){
    jumpToItemFromUrl();
  } else {
    renderCards();
  }
}

document.getElementById('langBtn').onclick = toggleLang;
document.getElementById('searchBox').addEventListener('input', doSearch);
document.getElementById('prevTop').onclick = goPrev;
document.getElementById('nextTop').onclick = goNext;
document.getElementById('prevBot').onclick = goPrev;
document.getElementById('nextBot').onclick = goNext;

/* 分类按钮 */
document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ setCat(btn.dataset.cat); });
});

let resizeTimer;
let lastPerPage = getPerPage();

window.addEventListener('resize', () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {

    const perPage = getPerPage();
    if (perPage === lastPerPage) return;
    lastPerPage = perPage;
    renderCards();

  }, 150);

});
loadData();
</script>
