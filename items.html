<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物品图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",system-ui,sans-serif}
body{background:#f0f2f5;padding:12px}

.top-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;

  position:sticky;
  top:0;
  z-index:100;

  background:#f0f2f5;
  padding:6px 0;
}

.search-box{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}
.lang-btn,.page-btn,.type-btn{
  padding:8px;border:1px solid #ccc;background:#fff;border-radius:8px;white-space:nowrap;font-size:16px
}
.type-btn.active{ background:#718ACC;color:#fff;border-color:#718ACC }
/* ===== NAV_CAT_SPLIT：顶部页面标签([data-nav]) 与页内分类按钮 视觉分层 —— 阶段1 顶栏 =====
   顶栏 = 大号药丸 tab（白底 + 蓝灰边 + 悬停黄），8 个一组、页面级切换。
   margin-bottom:6px：顶栏按钮是 body 裸按钮，换行后上下两行原本 vGap=0 紧贴。
   ⚠ 必须放在 .type-btn.active 那一行之后：[data-nav](0,2,0) 与它同优先级、靠后者胜。

   ⚠⚠ 尺寸按「387px（iPhone 14/15 的 CSS 宽度）每行能放 4 个」反推：
     387 - 15(竖滚动条) - 24(body padding 12*2) = 348px 可用宽（最严的 6 页）；
     index/equip 的 body padding 实为 8px（equip 有两条 body 规则，后者覆盖前者），
     可用 356px，更宽松。
     4 个按钮 + 3 个 2px 间距 = 4*82 + 6 = 334px <= 348 -> **余量 14px**，
     即使遇到竖滚动条宽度差异也不会掉到 3 个。
     按钮 = min-width:80px + 2px 边框 = 82px；中文 4 个汉字(64px) + 2*8px padding
     + 2px 边框 = 82px，**正好放下且不溢出**。
   ⚠ padding 用 8px（不是 12px）：12px 时按钮需 90px，4 个要 372px > 348px 放不下。
   ⚠ margin-right:2px 制造 2px 间距（inline 流默认无间距，8 个按钮会贴在一起）。
   ⚠ 非中文语言文字更长 -> 按内容自适应撑宽（min-width 只作下限），
     每行变 3 个且**文字完整显示**（不加 max-width/overflow:hidden/text-overflow）。
 */
.type-btn{cursor:pointer}
.type-btn[data-nav]{min-width:80px;padding:8px 8px;margin:0 2px 6px 0;box-sizing:border-box;
border-radius:999px;background:#fff;border-color:#94A6BE;color:#3D4E68;font-weight:500;
white-space:nowrap;text-align:center}
.type-btn[data-nav]:hover{background:#FFE58A;border-color:#E8C33A;color:#22334A}
.type-btn.active[data-nav]{background:#718ACC;border-color:#3774AE;color:#fff}
/* ===== NAV_CAT_SPLIT：页内分类按钮（小号方角 chip）—— 阶段2 分类栏 =====
   :not([data-nav]) = 排除顶部标签；:not(.active) = **active 态一律沿用页面原有规则**
     （含 pet 的 [data-cat=large] #3774AE / [data-cat=small] #518B38 / 排序按钮青绿 #4E9A8C），
     本段只改「未选中」的几何与配色。
   分类栏容器（body 直接子元素）补 margin-top，与顶栏拉开呼吸（10px -> 12px 见注释③）。 */
.type-btn:not([data-nav]):not(.active):not([id="sortBtn"]){padding:5px 12px;font-size:14px;border-radius:6px;background:#fff;border-color:#C9D4E0;color:#4D5A75}
.type-btn:not([data-nav]):not(.active):not([id="sortBtn"]):hover{background:#F7FAFD;border-color:#94A6BE}
body > #catBar,body > #classBar,body > #jobBar,body > #typeBar,body > #bookBar,body > #zonePanel{margin-top:12px}


.page-btn{margin:0 4px}

/* 分类栏 */
#catBar.top-bar{
  position:static;
  background:transparent;
  margin-bottom:1px;

  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.pagination{text-align:center;margin:8px 0}

.equip-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* 平板 */
@media(min-width:768px) and (max-width:1023px){
  .equip-grid{
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
}

/* PC */
@media(min-width:1024px){
  .equip-grid{
    grid-template-columns:repeat(4,1fr);
    gap:18px;
  }
}

.equip-card{
  background:#D9E3EC;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);overflow:hidden;
  display:flex;flex-direction:column;padding:4px;gap:4px;border:1px solid #94A6BE;
}
.equip-name{
  text-align:center;font-weight:bold;font-size:18px;
  padding:4px 4px;
  border-top:2px solid #b9cad6;border-bottom:2px solid #b9cad6;
  background:linear-gradient(100deg,#c1ceda,#E7F7FF,#c1ceda);
  border-radius:8px;
  line-height:1.2;
}
@media(min-width:1024px){ .equip-name{ font-size:20px;padding:6px 4px } }

.equip-info-row{display:flex;padding:4px;gap:4px;align-items:center}
.equip-icon-col{ width:30%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px }
.equip-text-col{width:70%;display:flex;flex-direction:column;gap:4px}

.hex-icon{ width:56px;height:56px;display:flex;align-items:center;justify-content:center; clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%); background:linear-gradient(145deg,#6085ac,#2f4666);position:relative;overflow:hidden; }
.hex-icon::before{ content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0.5),rgba(255,255,255,0) 40%); }
.hex-icon::after{ content:"";position:absolute;inset:0;box-shadow:inset 0 0 15px rgba(255,255,255,0.35),inset 0 0 25px rgba(255,255,255,0.15); }
.hex-icon .star{ position:absolute;width:8px;height:8px;z-index:1; }
.hex-icon .star::before{ content:"";position:absolute;width:100%;height:2px;top:50%;left:0;transform:translateY(-50%);background:linear-gradient(to right,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star::after{ content:"";position:absolute;width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.95),transparent); }
.hex-icon .star1{ top:18%;left:15%; }
.hex-icon .star2{ bottom:18%;right:15%; }
.hex-icon img{width:34px;height:34px;object-fit:contain}
@media(min-width:1024px){ .hex-icon{width:68px;height:68px} .hex-icon img{width:42px;height:42px} }

.tag-rarity{ padding:3px 6px;border-radius:8px;color:#D6E5DC;font-size:13px;width:fit-content }
.item-card .tag-rarity{ position:relative;left:10px;top:-3px }   /* 物品图鉴：标签再右移4px（6→10）、上移3px */
.item-level{ min-height:20px }          /* 等级位留空 */
.item-card .job-slot{ min-height:24px } /* 职业位留空 */

.equip-stats{ background:#C6D4E4;padding:8px 4px;border-radius:8px;margin-top:4px }
.item-card .item-stats{ min-height:40px;max-height:200px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch } /* 说明超长时内部滚动 */
.item-note{ font-size:15px;color:#3D4E68;line-height:1.6;text-align:left;padding:0 4px }
@media(min-width:1024px){ .item-note{ font-size:17px } }
.item-link{ color:#3774AE;text-decoration:underline;cursor:pointer }

/* 卡片底部操作行 */
.card-actions{ display:flex;gap:6px;margin-top:auto }
.card-actions .btn-source{ flex:1;width:auto;margin:0;padding:7px 2px;font-size:14px }
.btn-source{ width:60%;margin:0 auto;padding:8px;margin-top:auto;background:#718ACC;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;display:block }
.btn-source.disabled{ background:#9AA7BC;cursor:default }
.card-actions .btn-rate{ flex:1;width:auto;margin:0;padding:7px 2px;font-size:14px }
.btn-rate{ background:#4E9A8C;color:#F8EFF3;border:none;border-radius:10px;font-weight:bold;cursor:pointer }
@media(min-width:1024px){ .card-actions .btn-source{padding:10px 6px;font-size:16px} .card-actions .btn-rate{padding:10px 6px;font-size:16px} }

.modal-backdrop{ position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999 }
.modal-content{ background:#fff;width:80%;max-width:380px;padding:20px;border-radius:16px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.3) }
.modal-title{font-size:18px;font-weight:bold;margin-bottom:12px;color:#333}
/* 弹窗标题文字色：与对应按钮色协调（同色系加深，白底清晰易读、不刺眼） */
#modalTitle{ color:#355E9C }                                   /* 获取途径：蓝 */
#rateModalTitle,#probModalTitle{ color:#2C7267 }                /* 获得概率：青绿 */
#relicModalTitle{ color:#4E7A3C }                               /* 文物概率：深绿 */
.modal-desc{font-size:15px;color:#3D4E68;line-height:1.6;margin-bottom:16px;min-height:60px;}
.modal-desc div{ padding:8px; border-radius:8px; cursor:pointer; margin:4px 0; background:#f5f7fa; text-align:center; }   /* 获取途径正文居中 */
.modal-desc div:hover{ background:#e0e7ff; }
.modal-close{padding:7px 16px;background:#5c6bc0;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

/* 获取途径弹窗：内容超高时内部滚动 */
.modal-content.source-modal{ max-height:60%;display:flex;flex-direction:column }
.modal-content.source-modal .modal-title{ flex-shrink:0 }
.modal-content.source-modal .modal-desc{ flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain }
.modal-content.source-modal .modal-close{ align-self:center;flex-shrink:0 }

/* 里艾尔的战鼓：获得概率弹窗 */
.modal-content.rate-modal{ width:fit-content;max-width:80%;height:auto;max-height:60%;display:flex;flex-direction:column;text-align:left }
.modal-content.rate-modal .modal-title{ flex-shrink:0;text-align:center }
.modal-content.rate-modal .modal-close{ align-self:center;flex-shrink:0 }
.rate-body{ flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:4px 0 12px }
.rate-table{ width:100%;border-collapse:collapse;font-size:14px;background:#fff }
.rate-table th{ background:#e0e7f3;color:#3D4E68;padding:5px 12px;font-weight:bold;text-align:center }
.rate-table td{ padding:5px 12px;border-top:1px solid #eef2f7;text-align:center }
.rate-table tbody tr:nth-child(even) td{ background:#f7f9fc }
.rate-table td.rate-val{ font-weight:bold;color:#3D4E68 }
.rate-table td.rate-name{ text-align:left }
/* 语言下拉框：原生箭头无法调整位置，改为自定义箭头并往左收一些 */

/* 语言切换：自定义点击下拉（PC/手机一致，替代原生 select） */
.lang-dd{position:relative;display:inline-block;vertical-align:middle}
.lang-dd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:104px;padding:8px 12px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:15px;line-height:1;color:#3D4E68;white-space:nowrap;cursor:pointer;font-family:inherit}
.lang-dd-btn:hover{border-color:#94A6BE;background:#F7FAFD}
.lang-dd.open .lang-dd-btn{border-color:#94A6BE;background:#F7FAFD}
.lang-dd-caret{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid #4D5A75;transition:transform .15s}
.lang-dd.open .lang-dd-caret{transform:rotate(180deg)}
.lang-dd-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:100%;background:#fff;border:1px solid #B9C4D4;border-radius:8px;box-shadow:0 8px 22px rgba(34,44,62,.18);padding:4px;z-index:300}
.lang-dd.open .lang-dd-menu{display:block}
.lang-dd-item{padding:8px 14px;border-radius:6px;font-size:15px;line-height:1.2;color:#3D4E68;white-space:nowrap;text-align:center;cursor:pointer}
.lang-dd-item:hover{background:#EAF1F8}
.lang-dd-item.active{background:#EDF0F4;font-weight:600}
</style>
</head>

<body>
<div class="top-bar">
  <input class="search-box" placeholder="搜索物品名..." id="searchBox">
  <span class="lang-dd" id="langSelect"></span>
</div>
<button class="type-btn" onclick="location.href='index.html'" data-nav="monster">怪物图鉴</button>
<button class="type-btn" onclick="location.href='equip.html'" data-nav="equip">装备图鉴</button>
<button class="type-btn active" onclick="location.href='items.html'" data-nav="item">物品图鉴</button>
<button class="type-btn" onclick="location.href='skills.html'" data-nav="skill">技能图鉴</button>
<button class="type-btn" onclick="location.href='gem.html'" data-nav="gem">宝石图鉴</button>
<button class="type-btn" onclick="location.href='pet.html'" data-nav="pet">宠物图鉴</button>
<button class="type-btn" onclick="location.href='costume.html'" data-nav="costume">时装图鉴</button>
<button class="type-btn" onclick="location.href='collection.html'" data-nav="collection">图鉴任务</button>
<div class="top-bar" id="catBar">
  <button class="type-btn active" data-cat="all">全部</button>
  <button class="type-btn" data-cat="chest">箱子</button>
  <button class="type-btn" data-cat="rune">符文</button>
  <button class="type-btn" data-cat="consume">消耗品</button>
  <button class="type-btn" data-cat="other">其他</button>
</div>
<div class="pagination" id="topPagination">
  <button class="page-btn" id="firstTop">首页</button>
  <button class="page-btn" id="prevTop">上一页</button>
  <span class="page-jump" id="pageJumpTop"><span id="pageInfo">第 1 页</span><input class="page-jump-input" id="pageInputTop" type="number" min="1" step="1" inputmode="numeric"></span>
  <button class="page-btn" id="nextTop">下一页</button>
  <button class="page-btn" id="lastTop">尾页</button>
</div>
<div class="equip-grid" id="itemGrid">加载中...</div>
<div class="pagination" id="bottomPagination">
  <button class="page-btn" id="firstBot">首页</button>
  <button class="page-btn" id="prevBot">上一页</button>
  <span class="page-jump" id="pageJumpBot"><span id="pageInfoBot">第 1 页</span><input class="page-jump-input" id="pageInputBot" type="number" min="1" step="1" inputmode="numeric"></span>
  <button class="page-btn" id="nextBot">下一页</button>
  <button class="page-btn" id="lastBot">尾页</button>
</div>
<div class="modal-backdrop" id="modal">
  <div class="modal-content source-modal">
    <div class="modal-title" id="modalTitle">获取途径</div>
    <div class="modal-desc" id="modalText"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>
<div class="modal-backdrop" id="rateModal">
  <div class="modal-content rate-modal">
    <div class="modal-title" id="rateModalTitle">获得概率</div>
    <div class="rate-body" id="rateModalBody"></div>
    <button class="modal-close" id="rateModalClose" onclick="closeRateModal()">关闭</button>
  </div>
</div>

<script>
/* ===== 语言工具（内联，不依赖额外 js 文件；语言对照数据在 lang.json） ===== */
var TWOM_LANG_OPTIONS=[["en","English"],["zh","中文"],["ja","日本語"],["ko","한국어"]];
var TWOM_UI2CODE={en:"en",zh:"cn",ja:"ja",ko:"kr"};
var TWOM_CODE2UI={en:"en",cn:"zh",ja:"ja",kr:"ko"};
var TWOM_NAV={},TWOM_TXTJA={};
function twomReadLang(){var v="";try{v=localStorage.getItem("twom-lang")||"";}catch(e){}return ({en:"en",cn:"cn",zh:"cn",ja:"ja",kr:"kr",ko:"kr"})[v]||"cn";}
function twomWriteLang(c){try{localStorage.setItem("twom-lang",TWOM_CODE2UI[c]||"zh");}catch(e){}}
function twomLocale(c){return c==="cn"?"zh-Hans":c==="ja"?"ja":c==="kr"?"ko":"en";}
function twomFillLangSelect(sel,lang,onPick){
  if(!sel) return;
  var cur = TWOM_CODE2UI[lang] || "zh";
  var curLabel = "中文";
  for(var i=0;i<TWOM_LANG_OPTIONS.length;i++){ if(TWOM_LANG_OPTIONS[i][0]===cur) curLabel=TWOM_LANG_OPTIONS[i][1]; }
  if(sel.classList) sel.classList.add("lang-dd");
  sel.innerHTML = '<button type="button" class="lang-dd-btn" aria-haspopup="listbox" aria-expanded="false">'
    + '<span class="lang-dd-cur">' + curLabel + '</span><span class="lang-dd-caret"></span></button>'
    + '<div class="lang-dd-menu" role="listbox">'
    + TWOM_LANG_OPTIONS.map(function(o){ return '<div class="lang-dd-item' + (o[0]===cur?' active':'') + '" role="option" data-code="' + o[0] + '">' + o[1] + '</div>'; }).join("")
    + '</div>';
  if(!sel.querySelector) return;   /* 无 DOM 环境（用例桩）跳过交互绑定 */
  var btn = sel.querySelector(".lang-dd-btn");
  var menu = sel.querySelector(".lang-dd-menu");
  if(!btn || !menu) return;
  var items = menu.querySelectorAll(".lang-dd-item");
  btn.onclick = function(ev){ if(ev&&ev.stopPropagation) ev.stopPropagation(); var on = sel.classList.toggle("open"); btn.setAttribute("aria-expanded", on?"true":"false"); };
  for(var j=0;j<items.length;j++){ (function(it){
    it.onclick = function(ev){
      if(ev&&ev.stopPropagation) ev.stopPropagation();
      for(var k=0;k<items.length;k++) items[k].classList.remove("active");
      it.classList.add("active");
      var curEl = sel.querySelector(".lang-dd-cur"); if(curEl) curEl.innerText = it.innerText;
      sel.classList.remove("open"); btn.setAttribute("aria-expanded","false");
      if(typeof onPick === "function") onPick(it.getAttribute("data-code"));
    };
  })(items[j]); }
  if(!twomFillLangSelect._outsideBound){
    twomFillLangSelect._outsideBound = 1;
    document.addEventListener("click", function(){
      var open = document.querySelectorAll(".lang-dd.open");
      for(var k=0;k<open.length;k++){ open[k].classList.remove("open"); var b=open[k].querySelector(".lang-dd-btn"); if(b) b.setAttribute("aria-expanded","false"); }
    });
  }
}
function twomApplyLangData(L){TWOM_NAV=(L&&L.nav)||{};TWOM_TXTJA=(L&&L.txtJa)||{};rarityConfig=(L&&L.rarityColor)||rarityConfig;twomUpdateNav();
  var I=(L&&L.itemsLang)||{};Object.assign(langConfig,I.langConfig||{});Object.assign(catLang,I.catName||{});
  Object.assign(DUNGEON_LABEL,I.dungeonLabel||{});Object.assign(RUNE_WHERE_LANG,I.runeWhere||{});
  Object.assign(ADRA_EXTRA_LANG,I.adraExtra||{});Object.assign(CORE_SOURCES,I.coreSources||{});
  Object.assign(SUPPLEMENT_SOURCES,I.supplementSources||{});
}
function twomUpdateNav(lang){lang=lang||(typeof currentLang!=="undefined"?currentLang:"cn");document.querySelectorAll("[data-nav]").forEach(function(b){var o=TWOM_NAV[b.dataset.nav];if(o)b.innerText=o[lang]||o.cn||o.en;});}
function twomTxt(cn,lang){return lang==="ja"?(TWOM_TXTJA[cn]||cn):cn;}
function twomUi(L,k,lang,vars){var o=((L&&L.ui)||{})[k];var s=o?(o[lang]||o.cn||o.en||k):k;return String(s).replace(/\{(\w+)\}/g,function(_,n){return (vars&&vars[n]!=null)?vars[n]:"";});}
</script>
<script>
let currentLang = twomReadLang();
const langConfig = {};   /* ← lang.json 的 itemsLang.langConfig（页面不再自带文案） */;
/* 稀有度配色统一在 lang.json 的 rarityColor；本页只用「一般」一档 */
let rarityConfig = {};
// 语言对照数据（来自 lang.json）
let LANGDATA = null;
function ui(k, vars){ return twomUi(LANGDATA, k, currentLang, vars); }
function pickLang(o){ if(!o) return ""; if(o[currentLang]) return o[currentLang]; if(currentLang === "en") return o.en || o.cn || ""; return o.cn || o.en || ""; }
function sepClause(){ return (currentLang === "en" || currentLang === "kr") ? "; " : "；"; }

// 导航按钮（语言对照来自 lang.json）
function updateNavLang(){ twomUpdateNav(currentLang); }

// 分类筛选
const catLang = {};   /* ← lang.json 的 itemsLang.catName（页面不再自带文案） */;

// 箱子类 / 符文类
const CHEST_ITEMS = new Set([
  "Dungeon Chest 20", "Dungeon Chest 25", "Dungeon Chest 30", "Dungeon Chest 35", "Dungeon Chest 40",
  "Dungeon Treasure 20", "Dungeon Treasure 25", "Dungeon Treasure 30", "Dungeon Treasure 35", "Dungeon Treasure 40",
  "Dungeon Treasure 42", "Dungeon Treasure 44", "Dungeon Treasure 46", "Dungeon Treasure 48", "Dungeon Treasure 50",
  "Small Treasure Box", "Old Box", "Box Flowing with Mana", "Random Enchant Scroll Box",
  "Lucky Box", "High Lucky Box",
  "Swamp Treasure", "Maze Treasure", "Snowfield Altar Treasure",
  "Ancient Treasure", "Strange Treasure", "Wingfril's Treasure"

// 宝箱内容条目：数量 + 链接（物品→物品图鉴、装备→装备图鉴）
function chestEntryHtml(raw){
  if(/^Gold\b/.test(raw)){
    const rest = String(raw).replace(/^Gold\s*/, "").replace(/^\s*\(/, "").replace(/\)\s*$/, "").trim();
    const qDisp = rest.replace(/或/g, ui('goldJoin'));
    return `<span class="item-link" onclick="goItem('Gold')">${itemNameOf("Gold")}</span> (${qDisp})`;
  }
  let base = raw, suffix = "";
  let m = String(raw).match(/^(.*?)\s*\(([\d\s\-,~]+)\)\s*$/);
  if(m){
    base = m[1].trim();
    suffix = " x" + m[2].replace(/\s+/g, "");
  } else {
    m = String(raw).match(/^(.*?)\s+x(\d+)\s*$/i);
    if(m){ base = m[1].trim(); suffix = " x" + m[2]; }
  }
  if(equipNameMap[base]){
    return `<span class="item-link" onclick="goEquip('${base.replace(/'/g,"\\'")}')">${equipNameOf(base)}</span>${suffix}`;
  }
  if(dropMap[base]){
    return `<span class="item-link" onclick="goItem('${base.replace(/'/g,"\\'")}')">${itemNameOf(base)}</span>${suffix}`;
  }
  // 非数量括号（如 (Soulbound)、(B Class)）：去掉括号再解析，括号内容保留显示
  m = String(raw).match(/^(.*?)\s*(\([^()]*\))\s*$/);
  if(m){
    const b2 = m[1].trim();
    if(equipNameMap[b2]) return `<span class="item-link" onclick="goEquip('${b2.replace(/'/g,"\\'")}')">${equipNameOf(b2)}</span> ${m[2]}`;
    if(dropMap[b2]) return `<span class="item-link" onclick="goItem('${b2.replace(/'/g,"\\'")}')">${itemNameOf(b2)}</span> ${m[2]}`;
  }
  return raw;
}

function expandExchangeNames(text){
  const m = String(text).match(/^(.+?)(\d+)\/(\d+)\/(\d+)(p?)$/);
  if(m) return [m[1] + m[2] + m[5], m[1] + m[3] + m[5], m[1] + m[4] + m[5]];
  return String(text).split(/[\n/+＋]/).map(x=>x.replace(/\s*x\s*\d+\s*$/i, "").trim()).filter(Boolean);
}

// 解析装备文案里的制作材料（排除怪物/宝箱/出处段，其余【...】视为材料）
function parseRecipeMaterials(desc){
  const segs = String(desc || "").split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  let stop = false;
  segs.forEach(s=>{
    if(s.startsWith("#") || s.indexOf("箱子开启") >= 0){ stop = true; return; }
    if(stop || s.startsWith("@")) return;
    if(s.indexOf("怪物掉落") === 0 || s.indexOf("获取途径") === 0) return;
    (s.match(/【([^】]+)】/g) || []).forEach(b=>{
      const n = b.slice(1, -1).trim();
      if(n && !n.startsWith("组合书")) out.push(n);
    });
  });
  return out;
}

/* 跳转助手：把「英文键或任意语言的名字」解析成当前语言的显示名，找不到就原样返回 */
function locKeyOf(map, v){
  const s = String(v == null ? '' : v).trim();
  if(!s || !map) return null;
  if(map[s]) return s;
  const low = s.toLowerCase();
  const ks = Object.keys(map);
  for(let i = 0; i < ks.length; i++){
    const o = map[ks[i]] || {};
    const cand = [ks[i], o.cn, o.en, o.ja, o.kr];
    for(let j = 0; j < cand.length; j++){
      if(String(cand[j] || '').toLowerCase() === low) return ks[i];
    }
  }
  return null;
}

const CHEST_SORT_ORDER = [
  "Swamp Treasure", "Maze Treasure", "Snowfield Altar Treasure",
  "Box Flowing with Mana", "Random Enchant Scroll Box",
  "Lucky Box", "High Lucky Box", "Riel's War Drum",

function chestSortKey(name){
  let m = name.match(/^Dungeon Chest (\d+)$/);
  if(m) return [0, parseInt(m[1], 10)];
  m = name.match(/^Dungeon Treasure (\d+)$/);
  if(m) return [1, parseInt(m[1], 10)];
  const idx = CHEST_SORT_ORDER.indexOf(name);
  return [2, idx === -1 ? 999 : idx];
}
// 卡片高度估算：按说明行数（封顶 10 行 ≈ 200px 说明框）
function itemCardWeight(name){
  let lines = 0;
  if(name === "Box Flowing with Mana") lines = 1 + BOX_RUNES.length;
  else if(chestContents[name]) lines = 1 + chestContents[name].length;
  else if(ADRA_MATERIALS[name]) lines = 1 + ADRA_MATERIALS[name].equips.length;
  else if(RUNE_EXCHANGE[name]) lines = 1;
  if(skillExMap[name]) lines += 1 + skillExMap[name].length;
  if(craftMap[name]) lines += 1 + craftMap[name].length;
  return Math.min(lines, 8);
}
// 分类排序（与分类栏一致：箱子→符文→消耗品→其他）
const CAT_RANK = { chest: 0, rune: 1, consume: 2, other: 3 };
// 有可制作装备 / 可兑换（技能、阿德拉、符文）的卡片靠前
function hasCraftExchange(name){
  return !!((craftMap[name] && craftMap[name].length) || (skillExMap[name] && skillExMap[name].length) || ADRA_MATERIALS[name] || RUNE_EXCHANGE[name]);
}
function sortItems(){
  const coll = new Intl.Collator(twomLocale(currentLang));
  allItems.sort((a,b)=>
    (hasCraftExchange(a.name) ? 0 : 1) - (hasCraftExchange(b.name) ? 0 : 1)
    || (itemCardWeight(a.name) > 0 ? 0 : 1) - (itemCardWeight(b.name) > 0 ? 0 : 1)
    || itemCardWeight(a.name) - itemCardWeight(b.name)
    || (CAT_RANK[a.cat] ?? 9) - (CAT_RANK[b.cat] ?? 9)
    || coll.compare(itemDisplayName(a.name), itemDisplayName(b.name))
    || a.name.localeCompare(b.name)
  );
}
// 箱子分类专用排序（类别内全部是箱子，排序一致）
function sortChestList(list){
  const coll = new Intl.Collator(twomLocale(currentLang));
  return list.slice().sort((a,b)=>{
    const ka = chestSortKey(a.name), kb = chestSortKey(b.name);
    if(ka[0] !== kb[0]) return ka[0] - kb[0];
    if(ka[1] !== kb[1]) return ka[1] - kb[1];
    return coll.compare(itemDisplayName(a.name), itemDisplayName(b.name)) || a.name.localeCompare(b.name);
  });
}

  document.getElementById('prevTop').innerText = document.getElementById('prevBot').innerText = tr('prev','btnText');
  document.getElementById('nextTop').innerText = document.getElementById('nextBot').innerText = tr('next','btnText');
  document.getElementById('modalTitle').innerText = tr('modalTitle','btnText');
  document.querySelector('.modal-close').innerText = tr('close','btnText');
  document.getElementById('rateModalClose').innerText = tr('close','btnText');
  updateCatButtonsLang();
  updateNavLang();
}

function updateCatButtonsLang(){
  document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
    const c = btn.dataset.cat;
    if(catLang[c]) btn.innerText = catLang[c][currentLang];
  });
}

function updatePageInfo(){
  const total = Math.ceil(filteredItems.length / getPerPage());
  const s = langConfig.pageText[currentLang].replace("{now}",page).replace("{total}",total||1);
  document.getElementById('pageInfo').innerText = document.getElementById('pageInfoBot').innerText = s;
}

function toggleLang(){
  currentLang = currentLang==="cn" ? "en" : currentLang==="en" ? "kr" : "cn";
  try{ localStorage.setItem("twom-lang", currentLang); }catch(e){}
  updateLangText();
  sortItems();
  filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim(), true);
}

function doSearch(){ filterAndRender(document.getElementById('searchBox').value.toLowerCase().trim()); }

function filterAndRender(keyword="", keepPage){
  let list = allItems;
  if(currentCat !== "all") list = list.filter(x=>x.cat === currentCat || (DUAL_CATS[x.name]||[]).includes(currentCat));
  if(keyword){
    list = list.filter(x=>{
      const m = dropMap[x.name] || {};
      const all = [x.name, m.cn||"", m.en||"", m.ja||"", m.kr||""].join(" ").toLowerCase();
      return all.includes(keyword);
    });
  }
  // 箱子分类：按掉落等级排序（宝箱20→40、宝物20→50、其他按名称）
  filteredItems = currentCat === "chest" ? sortChestList(list) : list;
  if(keepPage){
    const total = Math.ceil(filteredItems.length / getPerPage());
    if(page > total) page = Math.max(1, total);
  } else {
    page = 1;
  }
  renderCards();
}

function setCat(cat){
  currentCat = cat;
  document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  // 点「全部 / 分类」= 重置搜索框（否则残留关键词会把新分类的结果筛空）
  document.getElementById('searchBox').value = "";
  filterAndRender("", false);
}

function goPrev(){ if(page>1){page--;renderCards();} }
function goNext(){
  const total = Math.ceil(filteredItems.length/getPerPage());
  if(page<total){ page++; renderCards(); window.scrollTo(0,0); }
}

// 渲染卡片
function renderCards(){
  const grid = document.getElementById("itemGrid");
  grid.innerHTML = "";
  updatePageInfo();
  const perPage = getPerPage();
  const pageItems = filteredItems.slice((page-1)*perPage, page*perPage);
  if(!pageItems.length){
    grid.innerHTML = `<div style='grid-column:1/-1;text-align:center;padding:20px'>${tr('noData','btnText')}</div>`;
    return;
  }
  pageItems.forEach(item=>{
    const m = dropMap[item.name] || {};
    const name = itemDisplayName(item.name);
    const rc = rarityConfig["一般"] || { color:"#4D5A75", bg:"#474F6E" };
    const rarity = tr("一般","rarity");
    const hasSource = item.monsters.length > 0 || BOX_RUNES.includes(item.name) || EXTRA_ITEMS.includes(item.name) || TREASURE_ITEMS.includes(item.name) || !!SUPPLEMENT_SOURCES[item.name] || !!CORE_SOURCES[item.name] || !!OPEN_FROM[item.name] || luckyBoxFrom(item.name).length > 0;
    const sourceBtn = hasSource
      ? `<button class="btn-source" onclick="openSourceModal('${item.name.replace(/'/g,"\\'")}')">${tr('source','btnText')}</button>`
      : `<button class="btn-source disabled" disabled>${tr('source','btnText')}</button>`;
    const rateBtn = (item.name === "Riel's War Drum")
      ? `<button class="btn-rate" onclick="openRateModal()">${tr('rate','btnText')}</button>`
      : (chestProbs[item.name] ? `<button class="btn-rate" onclick="openRateModal('${item.name.replace(/'/g,"\\'")}')">${tr('rate','btnText')}</button>` : "");

    const noteHtml = itemNote(item.name);
    const card = document.createElement("div");
    card.className = "equip-card item-card";
    card.dataset.name = item.name;
    card.dataset.nameCn = m.cn || "";
    card.dataset.nameJa = m.ja || "";
    card.dataset.nameKr = m.kr || "";
    card.innerHTML = `
      <div class="equip-name" style="color:${rc.color}">${name}</div>
      <div class="equip-info-row">
        <div class="equip-icon-col">
          <div class="hex-icon"><div class="star star1"></div><div class="star star2"></div><img loading="lazy" src="drop_icons/${item.name}.png" onerror="this.style.display='none'"></div>
          <div class="item-level"></div>
        </div>
        <div class="equip-text-col">
          <div class="tag-rarity" style="background:${rc.bg}">${rarity}</div>
          <div class="job-slot"></div>
        </div>
      </div>
      <div class="equip-stats item-stats">${noteHtml}</div>
      <div class="card-actions">${sourceBtn}${rateBtn}</div>
    `;
    grid.appendChild(card);
  });
}

// 获取途径弹窗（掉落怪物，可点击回怪物图鉴）
function openSourceModal(nameEn){
  const item = allItems.find(x => x.name === nameEn);
  if(!item) return;
  // 战鼓开启物品（附魔卷轴另显示 SHOP 宠物活动 PT 抽取）
  const of = OPEN_FROM[nameEn];
  if(of && !item.monsters.length){
    const isEn = currentLang === "en";
    const drum = `<span class="item-link" onclick="goItem('Riel\\'s War Drum')">${itemNameOf("Riel's War Drum")}</span>`;
    const rows = [ui('obtainByOpening', { x: drum })];
    if(of.pt) rows.push(ui('shopPt'));
    document.getElementById("modalText").innerHTML = rows.map(x=>`<div>${x}</div>`).join("");
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 精髓：分解装备获得（显示在怪物列表上方）
  const coreSrc = CORE_SOURCES[nameEn];
  if(coreSrc){
    const isEn = currentLang === "en";
    const line = `<div style="cursor:default;background:#f3f3f3;">${pickLang(coreSrc)}</div>`;
    const list = item.monsters.slice().sort((a,b)=>{
      const x = monsterDisplayName(a), y = monsterDisplayName(b);
      return currentLang === "cn" ? x.localeCompare(y, "zh-Hans") : x.localeCompare(y);
    });
    document.getElementById("modalText").innerHTML = line + list.map(mn=>{
      const disp = monsterDisplayName(mn);
      const cn = (nameMap[mn] && nameMap[mn].cn) || mn;
      return `<div onclick="goMonster('${disp.replace(/'/g,"\\'")}')">${disp}</div>`;
    }).join("");
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 箱子开出的符文：来源显示为「充满魔力的箱子」（可点击）
  if(BOX_RUNES.includes(nameEn) && !item.monsters.length){
    document.getElementById("modalText").innerHTML =
      `<div onclick="goItem('Box Flowing with Mana')">${itemNameOf("Box Flowing with Mana")}</div>`;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 幸运箱 / 高级幸运箱：只显示来源（对应的地下城宝物，可点击跳转）
  const lbf = luckyBoxFrom(nameEn);
  if(lbf.length && !item.monsters.length){
    const links = lbf.map(t=>
      `<span class="item-link" onclick="goItem('${t.replace(/'/g,"\\'")}')">${itemNameOf(t)}</span>`
    ).join(" / ");
    document.getElementById("modalText").innerHTML = `<div>${ui('obtainByOpening', { x: links })}</div>`;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 地下城宝物：只显示来源（副本完成 / 击杀Boss后退出）
  if(TREASURE_ITEMS.includes(nameEn) && !item.monsters.length){
    const line = chestSourceLine(nameEn);
    document.getElementById("modalText").innerHTML = line ? `<div>${line}</div>` : "";
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 精炼魔力：兑换来源（污染魔力可点击）
  if(nameEn === "Refined Mana" && !item.monsters.length){
    const cmLink = `<span class="item-link" onclick="goItem('Corrupted Mana')">${itemNameOf("Corrupted Mana")}</span>`;
    document.getElementById("modalText").innerHTML =
      `<div>${ui('refinedExchange', { item: cmLink })}</div>`;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  // 补充物品：兑换 / 分解装备 / 魔力之息概率合成
  const sup = SUPPLEMENT_SOURCES[nameEn];
  if(sup && !item.monsters.length){
    const isEn = currentLang === "en";
    let html;
    if(sup.monster){
      const mn = sup.monster;
      const mc = (nameMap[mn] && nameMap[mn].cn) || mn;
      const link = `<span class="item-link" onclick="goMonster('${monsterDisplayName(mn).replace(/'/g,"\\'")}')">${monsterDisplayName(mn)}</span>`;
      html = ui('nearbyWhenDies', { monster: link });
    } else if(sup.link){
      const link = `<span class="item-link" onclick="goItem('${sup.link.replace(/'/g,"\\'")}')">${itemNameOf(sup.link)}</span>`;
      if(sup.gold){
        const goldTxt = (currentLang === "en" || currentLang === "kr") ? sup.gold.toLocaleString() : sup.gold;
        html = ui('craftFromGold', { link: link, qty: sup.qty, gold: goldTxt, out: sup.out });
      } else if(sup.qty && sup.gain){
        html = ui('exchangeForGain', { link: link, qty: sup.qty, gain: sup.gain });
      } else if(sup.qty){
        html = ui('tradeTo', { link: link, qty: sup.qty, target: pickLang(sup) });
      } else {
        html = ui('chanceCraft', { link: link });
      }
    } else {
      html = pickLang(sup);
    }
    document.getElementById("modalText").innerHTML = String(html).split("\n").map(x=>`<div>${x}</div>`).join("");
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalText").scrollTop = 0;
    lockPageScroll(true);
    return;
  }
  if(!item.monsters.length) return;
  const list = item.monsters.slice().sort((a,b)=>{
    const x = monsterDisplayName(a), y = monsterDisplayName(b);
    return currentLang === "cn" ? x.localeCompare(y, "zh-Hans") : x.localeCompare(y);
  });
  // 宝物来源（如湿地宝物 ← 地下城宝物46/48）
  let extra = "";
  const from = CHEST_FROM[nameEn];
  if(from){
    const links = from.map(t=>
      `<span class="item-link" onclick="goItem('${t.replace(/'/g,"\\'")}')">${itemNameOf(t)}</span>`
    ).join(" / ");
    extra = `<div>${ui('obtainByOpening', { x: links })}</div>`;
  }
  document.getElementById("modalText").innerHTML = extra + list.map(mn=>{
    const disp = monsterDisplayName(mn);
    const cn = (nameMap[mn] && nameMap[mn].cn) || mn;
    return `<div onclick="goMonster('${disp.replace(/'/g,"\\'")}')">${disp}</div>`;
  }).join("");
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalText").scrollTop = 0;
  lockPageScroll(true);
}

// 弹窗打开时锁定页面滚动（含滚动条宽度补偿，防止页面横向跳动）
let pageScrollLocked = false;
function lockPageScroll(lock){
  if(lock === pageScrollLocked) return;
  pageScrollLocked = lock;
  if(lock){
    const sw = window.innerWidth - document.documentElement.clientWidth;
    const pr = parseFloat(getComputedStyle(document.body).paddingRight) || 0;
    document.body.style.overflow = "hidden";
    if(sw > 0) document.body.style.paddingRight = (pr + sw) + "px";
  } else {
    document.body.style.overflow = "";
    document.body.style.paddingRight = "";
  }
}

// 定位物品（接收参数 item）
function jumpToItemFromUrl(){
  const params = new URLSearchParams(location.search);
  const key = decodeURIComponent(params.get("item") || "").toLowerCase().trim();
  if(!key) return;

  // 定位前重置分类，避免目标被筛掉
  currentCat = "all";
  document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat === "all");
  });

  const index = allItems.findIndex(item=>{
    const m = dropMap[item.name] || {};
    /* 强跳转：只认完全同名，不再子串模糊匹配 */
    const names = [item.name, m.cn, m.en, m.ja, m.kr].filter(Boolean).map(v=>String(v).toLowerCase().trim());
    return names.indexOf(key) >= 0;
  });

  if(index === -1){
    page = 1;
    renderCards();
    return;
  }

  page = Math.floor(index / getPerPage()) + 1;
  renderCards();

  setTimeout(() => {
    const cards = document.querySelectorAll(".item-card");
    for(const card of cards){
      const stored = [card.dataset.name, card.dataset.nameCn, card.dataset.nameKr].join(" ").toLowerCase().trim();
      if(stored.includes(key)){
        card.scrollIntoView({ behavior:"smooth", block:"center" });
        card.style.boxShadow = "0 0 20px gold";
        setTimeout(() => { card.style.boxShadow = ""; }, 2000);
        break;
      }
    }
  }, 300);
}

async function loadData(){
  let drops = {}, lang = {}, dc = [], equipData = [], chestData = {}, skillData = {};
  try {
    const [r1, r2, r3, r4, r5, r6] = await Promise.all([
      fetch("monster_drops.json"),
      fetch("lang.json"),
      fetch("dropColors.json"),
      fetch("equipment_data/all_equip.json"),
      fetch("chest_data.json"),
      fetch("skill_data.json")
    ]);
    drops = await r1.json();
    lang = await r2.json();
    dc = await r3.json();
    equipData = await r4.json();
    chestData = await r5.json();
    skillData = await r6.json();
  } catch(e) {
    console.log("load fail", e);
  }
  chestContents = chestData.contents || {};
  chestProbs = chestData.probs || {};   /* 官方概率表：幸运箱 / 高级幸运箱 */
  dropMap = lang.dropMap || {};
  nameMap = lang.nameMap || {};
  // 语言对照（lang.json：nav / ui / ja 补充名等）
  LANGDATA = lang;
  twomApplyLangData(lang);
  dcType = {};
  dc.forEach(x=>{ if(x.en) dcType[x.en] = x.type || ""; });
  equipNameMap = {};
  equipData.forEach(e=>{ const xg = (LANGDATA.equips || {})[e.name] || {}; equipNameMap[e.name] = { cn: (e.name_cn || "").trim(), en: e.name, ja: xg.ja || "", kr: xg.kr || "" }; });

  // 物品 -> 可制作装备（解析装备文案中的制作材料）
  craftMap = {};
  const matCnToEn = {};
  for(const en in dropMap){
    const cn = ((dropMap[en] && dropMap[en].cn) || "").trim();
    if(!cn) continue;
    if(!matCnToEn[cn]) matCnToEn[cn] = en;
    const short = cn.replace(/[的之]/g, "");
    if(short && !matCnToEn[short]) matCnToEn[short] = en;
  }
  // 卡牌简写：库伊卡10/J/Q/K/A -> 展开为逐张名称（仅当展开名在库中存在）
  const expandCardShorthand = (name)=>{
    const m = String(name).match(/^([^\s【】\/]+?)((?:10|[JQKA])(?:\/(?:10|[JQKA]))+)$/);
    if(!m) return [name];
    const names = m[2].split("/").map(rk=>m[1] + rk);
    return names.some(n=>matCnToEn[n]) ? names : [name];
  };
  // 同名「魔力卷轴」按装备上下文消歧
  const MAT_CONTEXT = { "Ring of Promise": { "魔力卷轴": "Enchant Scroll - MP" } };
  equipData.forEach(e=>{
    if(e.hide) return;
    const ctx = MAT_CONTEXT[e.name];
    parseRecipeMaterials(e.desc).forEach(cn=>{
      expandCardShorthand(cn).forEach(name=>{
        const en = (ctx && ctx[name]) || matCnToEn[name];
        if(!en) return;
        if(!craftMap[en]) craftMap[en] = [];
        if(!craftMap[en].includes(e.name)) craftMap[en].push(e.name);
      });
    });
  });

  // 物品 -> 可兑换技能（解析技能 extraSources 括号里的材料）
  skillExMap = {};
  const skillItemCn = {};
  for(const en in dropMap){
    const cn = ((dropMap[en] && dropMap[en].cn) || "").trim();
    if(!cn) continue;
    if(!skillItemCn[cn]) skillItemCn[cn] = en;
  }
  Object.keys(skillData).forEach(key=>{
    const s = skillData[key];
    Object.keys(s.extraSources || {}).forEach(lv=>{
      const o = s.extraSources[lv] || {};
      const cn = o.cn || "";
      const m = cn.match(/（([^）]+)）/);
      if(!m) return;
      const book = (s.books || {})[lv] || "";
      if(!book) return;
      const srcCn = (cn.slice(0, m.index) + cn.slice(m.index + m[0].length)).trim();
      const srcEn = (o.en || "").replace(/\s*\([^)]*\)\s*$/, "").trim();
      expandExchangeNames(m[1]).forEach(nm=>{
        const itemEn = skillItemCn[nm];
        if(!itemEn) return;
        (skillExMap[itemEn] = skillExMap[itemEn] || []).push({ book: book, srcCn: srcCn, srcEn: srcEn });
      });
    });
  });

  // 反向映射：物品 -> 掉落怪物（排除装备与技能）
  const map = {};
  Object.keys(drops).forEach(monster=>{
    const list = (drops[monster] && drops[monster].掉落物) || [];
    list.forEach(raw=>{
      const it = String(raw).replace(/\s+x\d+$/i, "");
      if(dcType[it] === "equip" || dcType[it] === "skill" || EXTRA_EQUIP.has(it)) return;
      if(!map[it]) map[it] = { name: it, monsters: [], cat: CONSUMABLES.has(it) ? "consume" : "other" };
      map[it].monsters.push(monster);
    });
  });
  // 特殊物品：不在怪物掉落表中（如恒河豚箱子开出的符文、精炼魔力）
  BOX_RUNES.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  EXTRA_ITEMS.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  SUPPLEMENT_ITEMS.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  TREASURE_ITEMS.forEach(name=>{
    if(!map[name]) map[name] = { name: name, monsters: [], cat: "other" };
  });
  // 宝箱内容涉及、但不在掉落表中的物品（如 第2精髓/幸运箱/返回卷轴/赛乐亚之泪）
  Object.keys(chestContents).forEach(k=>{
    chestContents[k].forEach(raw=>{
      if(/^Gold\b/.test(raw)) return;
      let base = String(raw);
      let m = base.match(/^(.*?)\s*\(([\d\s\-,~]+)\)\s*$/);
      if(m){ base = m[1].trim(); }
      else {
        m = base.match(/^(.*?)\s+x(\d+)\s*$/i);
        if(m){ base = m[1].trim(); }
        else {
          m = base.match(/^(.*?)\s*(\([^()]*\))\s*$/);
          if(m) base = m[1].trim();
        }
      }
      if(equipNameMap[base]) return;
      if(!dropMap[base]) return;
      if(!map[base]) map[base] = { name: base, monsters: [], cat: "other" };
    });
  });
  // 分类归一（箱子/符文优先）
  Object.keys(map).forEach(k=>{ map[k].cat = itemCat(k); });
  allItems = Object.keys(map).map(k=>map[k]);
  // 按当前语言名称排序
  sortItems();
  filteredItems = [...allItems];
  document.getElementById('searchBox').value = "";

  updateLangText();

  if(location.search.includes('item=')){
    jumpToItemFromUrl();
  } else {
    renderCards();
  }
}

});

document.getElementById('prevTop').onclick = goPrev;
document.getElementById('nextTop').onclick = goNext;
document.getElementById('prevBot').onclick = goPrev;
document.getElementById('nextBot').onclick = goNext;

/* 分类按钮 */
document.querySelectorAll('#catBar .type-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ setCat(btn.dataset.cat); });
});

let resizeTimer;
let lastPerPage = getPerPage();

window.addEventListener('resize', () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {

    const perPage = getPerPage();
    if (perPage === lastPerPage) return;
    lastPerPage = perPage;
    renderCards();

  }, 150);

});
loadData();
</script>
<style>
/* ===== PAGE_NAV_PATCH：分页「首页/尾页 + 点击页码输入」 ===== */
/* PAGE_NAV_COMPACT_V5：桌面按钮仍为原尺寸(16px)，手机端只微收 1~2px，保证两位数页码仍在一排 */
.page-jump{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.page-jump:hover > span{text-decoration:underline}
.page-jump-input{display:none;width:66px;padding:6px 4px;border:1px solid #ccc;border-radius:8px;font-size:16px;text-align:center;font-family:inherit;-moz-appearance:textfield;appearance:textfield}
.page-jump-input::-webkit-outer-spin-button,.page-jump-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.page-jump.editing .page-jump-input{display:inline-block}
.page-jump.editing > span{display:none}
.page-btn:disabled{opacity:.45}
/* 分页栏改弹性单行：只为消除 HTML 空白造成的换行，不改按钮尺寸（尺寸仍用页面原有 .page-btn 规则）。
   gap:4px 是补回原先元素间空白所占的宽度，让桌面观感与改动前一致。 */
.pagination{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:4px}
.pagination > *{flex:0 0 auto}
.pagination .page-jump{white-space:nowrap}
/* 手机端只微收一点（越窄越收，最小 14px；桌面 16px 保持不变） */
@media(max-width:480px){
  .pagination{gap:3px}
  .pagination .page-btn{padding:7px;margin:0 3px;font-size:16px}
  .page-jump-input{width:62px;font-size:16px;padding:5px 4px}
}
@media(max-width:400px){
  .pagination{gap:2px}
  .pagination .page-btn{padding:6px;margin:0 2px;font-size:15px}
  .page-jump-input{width:58px;font-size:15px}
}
@media(max-width:340px){
  .pagination{gap:1px}
  .pagination .page-btn{padding:5px;margin:0 1px;font-size:14px}
  .page-jump-input{width:52px;font-size:14px}
}
</style>
<script>
/* ===== PAGE_NAV_PATCH：首页 / 尾页 / 点击「第 x/y 页」输入页码（6 个图鉴页共用） =====
   在各页原有脚本之后运行，复用其 page / filteredXxx / getPerPage / renderCards 或 render / updatePageInfo。 */
(function(){
  var JUMP_LABEL = {
    cn:{first:"首页",last:"尾页",tip:"点击可输入页码"},
    en:{first:"First",last:"Last",tip:"Click to enter a page number"},
    ja:{first:"最初へ",last:"最後へ",tip:"クリックしてページ番号を入力"},
    kr:{first:"처음",last:"마지막",tip:"클릭하여 페이지 번호 입력"}
  };
  function langOf(){ return (typeof currentLang !== "undefined" && currentLang) ? currentLang : "cn"; }
  function lbl(){ return JUMP_LABEL[langOf()] || JUMP_LABEL.cn; }
  function listOf(){
    if(typeof filtered !== "undefined" && filtered) return filtered;
    if(typeof filteredItems !== "undefined" && filteredItems) return filteredItems;
    if(typeof filteredSkills !== "undefined" && filteredSkills) return filteredSkills;
    return [];
  }
  function totalPages(){ return Math.max(1, Math.ceil(listOf().length / getPerPage())); }
  function draw(){
    if(typeof renderCards === "function") return renderCards();
    if(typeof render === "function") return render();
  }
  function syncInfo(){ if(typeof updatePageInfo === "function") updatePageInfo(); }
  function goTo(n){
    var t = totalPages(), v = Math.min(Math.max(1, parseInt(n, 10) || 1), t);
    if(v === page){ syncInfo(); return; }
    page = v; draw(); syncInfo();
  }
  function refresh(){
    var t = totalPages(), L = lbl();
    [["Top","firstTop","lastTop"],["Bot","firstBot","lastBot"]].forEach(function(a){
      var f = document.getElementById(a[1]), l = document.getElementById(a[2]);
      if(f){ f.innerText = L.first; f.disabled = page <= 1; }
      if(l){ l.innerText = L.last;  l.disabled = page >= t; }
      var jw = document.getElementById("pageJump" + a[0]), inp = document.getElementById("pageInput" + a[0]);
      if(jw) jw.title = L.tip;
      if(inp){ inp.max = t; inp.title = L.tip; if(!jw || !jw.classList.contains("editing")) inp.value = page; }
    });
  }
  function cancelEdit(jw, inp){ jw.classList.remove("editing"); inp.value = page; inp.blur(); syncInfo(); }
  function commit(jw, inp){
    if(!jw.classList.contains("editing")) return;
    var v = parseInt(inp.value, 10);
    jw.classList.remove("editing");
    if(!isNaN(v)) goTo(v); else syncInfo();
  }
  function bindJump(sfx){
    var jw = document.getElementById("pageJump" + sfx), inp = document.getElementById("pageInput" + sfx);
    if(!jw || !inp) return;
    jw.onclick = function(ev){
      if(ev && ev.target === inp) return;
      if(jw.classList.contains("editing")) return;
      jw.classList.add("editing");
      inp.value = page;
      inp.focus(); try{ inp.select(); }catch(e){}
    };
    inp.onkeydown = function(e){
      var k = e.key || "";
      if(k === "Enter" || e.keyCode === 13){ e.preventDefault(); commit(jw, inp); inp.blur(); }
      else if(k === "Escape" || e.keyCode === 27){ e.preventDefault(); cancelEdit(jw, inp); }
    };
    inp.onblur = function(){ commit(jw, inp); };
  }
  function bindBtn(id, fn){
    var b = document.getElementById(id);
    if(!b) return;
    b.onclick = function(){ if(b.disabled) return; fn(); };
  }
  ["Top","Bot"].forEach(function(sfx){
    bindJump(sfx);
    bindBtn("first" + sfx, function(){ if(page > 1){ page = 1; draw(); syncInfo(); window.scrollTo(0,0); } });
    bindBtn("last" + sfx,  function(){ var t = totalPages(); if(page < t){ page = t; draw(); syncInfo(); window.scrollTo(0,0); } });
  });
  // 包一层 updatePageInfo：每次刷新（含切语言）都同步按钮文案 / 输入框上下限
  if(typeof updatePageInfo === "function"){
    var _orig = updatePageInfo;
    updatePageInfo = function(){ var r = _orig.apply(this, arguments); refresh(); return r; };
  }
  refresh();
})();
</script>
</body>
</html>
